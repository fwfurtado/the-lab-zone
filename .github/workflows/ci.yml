name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install validation tools
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Install Python validation dependencies
        run: python3 -m pip install --user PyYAML

      - name: Lint YAML
        run: yamllint .

      - name: Check YAML duplicate keys
        run: python3 scripts/check-yaml-duplicate-keys.py

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t manifests < <(
            find apps projects bootstrap \
              -type f \
              \( -name '*.yaml' -o -name '*.yml' \) \
              -not -name 'Chart.yaml' \
              -not -path 'apps/core/gateway-api-crds/crd/*' \
              -not -path 'apps/data/dbt-analytics/chart/templates/*' \
              -print0 \
              | xargs -0 grep -lE '^(apiVersion|kind):' \
              | sort
          )

          kubeconform -strict -summary -ignore-missing-schemas "${manifests[@]}"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform modules
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r module; do
            echo "::group::terraform validate: ${module}"

            # Não reutiliza inicializações locais que possam apontar para o backend S3.
            module_id="${module//\//-}"
            export TF_DATA_DIR="${RUNNER_TEMP}/terraform-data/${module_id}"
            mkdir -p "${TF_DATA_DIR}"

            terraform -chdir="${module}" init \
              -backend=false \
              -input=false \
              -lockfile=readonly
            terraform -chdir="${module}" validate -no-color
            echo "::endgroup::"
          done < <(find infra/prod -type f -name backend.tf -printf '%h\n' | sort)

      - name: Check script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh infra/prod/harbor/*.sh
          python3 -m py_compile scripts/*.py

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh infra/prod/harbor/*.sh

      - name: Scan IaC and Kubernetes configs
        run: |
          trivy config \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --skip-dirs apps/core/gateway-api-crds \
            --skip-dirs 'infra/prod/*/.terraform' \
            .
