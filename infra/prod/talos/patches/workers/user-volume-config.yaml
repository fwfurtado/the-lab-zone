# Talos user volume: seleciona o disco dedicado de PV do tier NVMe,
# formata em xfs e monta em /var/mnt/pv-data. Aplica só nos workers.
#
# IMPORTANTE: com a introducao de um segundo disco de PV em virtio2/local-ssd,
# o seletor precisa continuar apontando so para o tier legado em virtio1.
# Usamos /dev/vdb + transport=virtio, confirmados nos workers via `talosctl get disks`.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: pv-data
provisioning:
  diskSelector:
    match: '!system_disk && disk.transport == "virtio" && disk.dev_path == "/dev/vdb"'
  minSize: 100GiB
  grow: true                 # ocupa o disco inteiro
filesystem:
  type: xfs
