clusterName: lab-zone
talosVersion: v1.13.4          # mesma da ISO
kubernetesVersion: v1.33.1
endpoint: https://10.40.6.10:6443   # VIP — explico abaixo

clusterPodNets:
  - 10.245.0.0/16
clusterSvcNets:
  - 10.97.0.0/16

allowSchedulingOnControlPlanes: false

cniConfig:
  name: none                   # Cilium entra na Fase 2, via bootstrap

worker:
  patches:
    - "@patches/workers/user-volume-config.yaml"

patches:
  - |-
    cluster:
      proxy:
        disabled: true                    # Kube-proxy OFF — Cilium assume via eBPF
  - |-
    machine:
      time:
        servers:
          - pool.ntp.org
      network:
        nameservers:
          - 10.40.0.1                     # UDR (depois: DNS interno da LXC)

nodes:
  - hostname: cp-1
    ipAddress: 10.40.6.11
    controlPlane: true
    talosImageURL: factory.talos.dev/installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515
    installDiskSelector:
      size: "<= 70GB"          # acha o disco de 60GB da VM
    networkInterfaces:
      - deviceSelector:
          busPath: "0*"        # primeira NIC virtio
        addresses: [10.40.6.11/21]
        routes:
          - network: 0.0.0.0/0
            gateway: 10.40.0.1
        vip:
          ip: 10.40.6.10      # VIP compartilhado entre os CPs
  - hostname: cp-2
    ipAddress: 10.40.6.12
    controlPlane: true
    talosImageURL: factory.talos.dev/installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515
    installDiskSelector:
      size: "<= 70GB"          # acha o disco de 60GB da VM
    networkInterfaces:
      - deviceSelector:
          busPath: "0*"        # primeira NIC virtio
        addresses: [10.40.6.12/21]
        routes:
          - network: 0.0.0.0/0
            gateway: 10.40.0.1
        vip:
          ip: 10.40.6.10      # VIP compartilhado entre os CPs
  - hostname: cp-3
    ipAddress: 10.40.6.13
    controlPlane: true
    talosImageURL: factory.talos.dev/installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515
    installDiskSelector:
      size: "<= 70GB"          # acha o disco de 60GB da VM
    networkInterfaces:
      - deviceSelector:
          busPath: "0*"        # primeira NIC virtio
        addresses: [10.40.6.13/21]
        routes:
          - network: 0.0.0.0/0
            gateway: 10.40.0.1
        vip:
          ip: 10.40.6.10      # VIP compartilhado entre os CPs

  - hostname: worker-1
    ipAddress: 10.40.6.21
    controlPlane: false
    talosImageURL: factory.talos.dev/installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515
    installDiskSelector:
      size: ">= 90GB"
    networkInterfaces:
      - deviceSelector:
          busPath: "0*"
        addresses:
          - 10.40.6.21/21
        routes:
          - network: 0.0.0.0/0
            gateway: 10.40.0.1

  - hostname: worker-2
    ipAddress: 10.40.6.22
    controlPlane: false
    talosImageURL: factory.talos.dev/installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515
    installDiskSelector:
      size: ">= 90GB"
    networkInterfaces:
      - deviceSelector:
          busPath: "0*"
        addresses:
          - 10.40.6.22/21
        routes:
          - network: 0.0.0.0/0
            gateway: 10.40.0.1
