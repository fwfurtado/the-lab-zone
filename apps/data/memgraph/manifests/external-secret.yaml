apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memgraph-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: memgraph-credentials
    creationPolicy: Owner
  data:
    - secretKey: USER
      remoteRef:
        key: memgraph
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: PASSWORD
      remoteRef:
        key: memgraph
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
