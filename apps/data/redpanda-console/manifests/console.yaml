apiVersion: cluster.redpanda.com/v1alpha2
kind: Console
metadata:
  name: redpanda-console
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  cluster:
    clusterRef:
      name: redpanda
  config:
    server:
      listenPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
