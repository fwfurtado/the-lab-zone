apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redpanda-superusers
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: redpanda-superusers
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        superusers.txt: |
          {{ .superuserUsername }}:{{ .superuserPassword }}:SCRAM-SHA-512
          console-user:{{ .consolePassword }}:SCRAM-SHA-256
  data:
    - secretKey: superuserUsername
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: redpanda
        property: superuser-username
    - secretKey: superuserPassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: redpanda
        property: superuser-password
    - secretKey: consolePassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: redpanda
        property: console-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redpanda-bootstrap-user
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: redpanda-bootstrap-user
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: redpanda
        property: bootstrap-password
