apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: redpanda
  namespace: observability
  labels:
    component: redpanda
spec:
  namespaceSelector:
    matchNames:
      - data
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
      app.kubernetes.io/instance: redpanda
  podMetricsEndpoints:
    - port: admin
      path: /public_metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
