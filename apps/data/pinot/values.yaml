# Pinot 1.5.1 (chart 1.0.0) -- POC de serving realtime upsert do lakehouse.
# Placement: tudo no worker-4-compute (label node-role.lab/compute + taint
# workload.lab/compute). Deep store: bucket `pinot` no Garage -- o S3PinotFS
# usa forcePathStyle(true) hardcoded (verificado no fonte 1.5.1), compatível
# com Garage sem config extra; credenciais via env AWS_* (chain default do SDK).
image:
  tag: 1.5.1
  pullPolicy: IfNotPresent

cluster:
  name: pinot

# ---- blocos repetidos por componente (o chart não tem defaults globais) ----
# nodeSelector/tolerations idênticos em todos; envFrom de credenciais só em
# quem toca o deep store (controller, server, minion).

controller:
  # recicla o StatefulSet quando o ConfigMap muda (checksum annotation) --
  # sem isso, mudança de config no Git NÃO chega ao processo (Pinot lê no boot)
  automaticReload:
    enabled: true
  replicaCount: 1
  persistence:
    storageClass: openebs-hostpath
    size: 2G
    # CA do Redpanda (TLS na 9093): metadata de partições do stream na criação da tabela
    extraVolumes:
      - name: redpanda-ca
        secret:
          secretName: redpanda-default-cert
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      - name: redpanda-ca
        mountPath: /etc/redpanda-ca
        readOnly: true
  jvmOpts: "-Xms512M -Xmx1G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 1536Mi
  nodeSelector:
    node-role.lab/compute: "true"
  tolerations:
    - key: workload.lab/compute
      operator: Equal
      value: "true"
      effect: NoSchedule
  envFrom:
    - secretRef:
        name: pinot-garage-credentials
  # deep store: value de 1ª classe do chart -- setar TAMBÉM via extra.configs
  # duplicaria a chave e o parser do Pinot concatena com vírgula (visto no log)
  data:
    dir: s3://pinot/deepstore
  extra:
    configs: |-
      pinot.set.instance.id.to.hostname=true
      # scheduler de tasks de minion (UpsertCompaction na etapa 2.4)
      controller.task.scheduler.enabled=true
      # ---- deep store no Garage ----
      controller.local.temp.dir=/var/pinot/controller/data
      pinot.controller.storage.factory.class.s3=org.apache.pinot.plugin.filesystem.S3PinotFS
      pinot.controller.storage.factory.s3.endpoint=http://garage.data.svc.cluster.local:3900
      pinot.controller.storage.factory.s3.region=garage
      pinot.controller.storage.factory.s3.disableAcl=true
      pinot.controller.segment.fetcher.protocols=file,http,s3
      pinot.controller.segment.fetcher.s3.class=org.apache.pinot.common.utils.fetcher.PinotFSSegmentFetcher

broker:
  # recicla o StatefulSet quando o ConfigMap muda (checksum annotation) --
  # sem isso, mudança de config no Git NÃO chega ao processo (Pinot lê no boot)
  automaticReload:
    enabled: true
  replicaCount: 1
  jvmOpts: "-Xms512M -Xmx1G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 1536Mi
  nodeSelector:
    node-role.lab/compute: "true"
  tolerations:
    - key: workload.lab/compute
      operator: Equal
      value: "true"
      effect: NoSchedule

server:
  # recicla o StatefulSet quando o ConfigMap muda (checksum annotation) --
  # sem isso, mudança de config no Git NÃO chega ao processo (Pinot lê no boot)
  automaticReload:
    enabled: true
  replicaCount: 1
  persistence:
    storageClass: openebs-hostpath
    size: 20G
    # CA do Redpanda (TLS na 9093): consumo do tópico
    extraVolumes:
      - name: redpanda-ca
        secret:
          secretName: redpanda-default-cert
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      - name: redpanda-ca
        mountPath: /etc/redpanda-ca
        readOnly: true
  # heap 2G: mapa de upsert (~500k PKs) + consuming segments; headroom aprovado
  jvmOpts: "-Xms2G -Xmx2G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      memory: 4Gi
  nodeSelector:
    node-role.lab/compute: "true"
  tolerations:
    - key: workload.lab/compute
      operator: Equal
      value: "true"
      effect: NoSchedule
  envFrom:
    - secretRef:
        name: pinot-garage-credentials
  extra:
    configs: |-
      pinot.set.instance.id.to.hostname=true
      # ---- deep store no Garage (upload de segmentos selados + re-download) ----
      pinot.server.instance.segment.store.uri=s3://pinot/deepstore
      pinot.server.storage.factory.class.s3=org.apache.pinot.plugin.filesystem.S3PinotFS
      pinot.server.storage.factory.s3.endpoint=http://garage.data.svc.cluster.local:3900
      pinot.server.storage.factory.s3.region=garage
      pinot.server.storage.factory.s3.disableAcl=true
      pinot.server.segment.fetcher.protocols=file,http,s3
      pinot.server.segment.fetcher.s3.class=org.apache.pinot.common.utils.fetcher.PinotFSSegmentFetcher

minionStateless:
  enabled: true
  replicaCount: 1
  jvmOpts: "-Xms256M -Xmx1G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  resources:
    requests:
      cpu: 100m
      memory: 1536Mi
    limits:
      memory: 1536Mi
  nodeSelector:
    node-role.lab/compute: "true"
  tolerations:
    - key: workload.lab/compute
      operator: Equal
      value: "true"
      effect: NoSchedule
  envFrom:
    - secretRef:
        name: pinot-garage-credentials
  extra:
    configs: |-
      pinot.set.instance.id.to.hostname=true
      pinot.minion.storage.factory.class.s3=org.apache.pinot.plugin.filesystem.S3PinotFS
      pinot.minion.storage.factory.s3.endpoint=http://garage.data.svc.cluster.local:3900
      pinot.minion.storage.factory.s3.region=garage
      pinot.minion.storage.factory.s3.disableAcl=true
      pinot.minion.segment.fetcher.protocols=file,http,s3
      pinot.minion.segment.fetcher.s3.class=org.apache.pinot.common.utils.fetcher.PinotFSSegmentFetcher

zookeeper:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      memory: 768Mi
    limits:
      memory: 1Gi
  persistence:
    storageClass: openebs-hostpath
    size: 4G
  nodeSelector:
    node-role.lab/compute: "true"
  tolerations:
    - key: workload.lab/compute
      operator: Equal
      value: "true"
      effect: NoSchedule
