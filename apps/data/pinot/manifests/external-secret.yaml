apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pinot-garage-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: pinot-garage-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # chain default do AWS SDK v2 (S3PinotFS não recebe accessKey/secretKey
        # via config aqui de propósito -- config vaza em API/UI do Pinot)
        AWS_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: garage-pinot
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: secretKey
      remoteRef:
        key: garage-pinot
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
