# Valores do chart dbt-analytics.
serviceAccountName: argo-workflow

# imagem do ensure-db (cria o database via HTTP). Pinar por digest.
curlImage: curlimages/curl:8.20.0

goose:
  # imagem GENÉRICA goose-runner. Pinar por digest após o 1o build.
  image: ofwfurtado/goose-runner:0.1.0

dbt:
  # imagem GENÉRICA (engine; sem projeto). Pinar por digest após o 1o build.
  image: ofwfurtado/dbt-runner:0.1.0
  projectDir: apps/data/dbt-analytics/dbt   # subdir do projeto dentro do repo (git artifact)
  git:
    repo: https://github.com/fwfurtado/the-lab-zone.git
    revision: main          # pode pinar num SHA pra reprodutibilidade total
    credsSecret: ""         # repo público -> vazio. Privado -> nome do secret (username+token)
  schedule: "0 */6 * * *"   # a cada 6h
  timezone: "Etc/UTC"       # convenção do lab; marts são diários, fuso não muda agregação


clickhouse:
  host: clickhouse-clickhouse.data.svc.cluster.local   # CONFIRMAR: kubectl get svc -n data
  httpPort: 8123
  nativePort: 9000
  database: analytics
  adminSecret:
    name: clickhouse-credentials   # secret admin da Fase 6
    key: adminPassword
  analyticsSecret:
    name: clickhouse-analytics     # ESO -> 1Password
    key: password

migrations:
  configMapName: clickhouse-migrations
  mountPath: /migrations
