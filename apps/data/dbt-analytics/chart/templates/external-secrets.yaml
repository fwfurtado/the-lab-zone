# Senha do usuário analytics. 1Password item clickhouse-analytics, campo password
# (criado na Etapa 0). Consumida pelo goose (envsub, pra setar a senha) e depois pelo dbt.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clickhouse.analyticsSecret.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .Values.clickhouse.analyticsSecret.name }}
  data:
    - secretKey: {{ .Values.clickhouse.analyticsSecret.key }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: clickhouse-analytics
        property: password
