# ConfigMap gerado a partir dos arquivos .sql do próprio chart.
# .Files.Glob só enxerga arquivos DENTRO do chart -> migrations/ mora aqui.
# Cada arquivo vira uma key (basename) montada em {{ .Values.migrations.mountPath }}.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.migrations.configMapName }}
  namespace: {{ .Release.Namespace }}
data:
{{ (.Files.Glob "migrations/clickhouse/*.sql").AsConfig | indent 2 }}
