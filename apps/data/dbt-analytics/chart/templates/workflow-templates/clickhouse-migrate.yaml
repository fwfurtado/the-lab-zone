# WorkflowTemplate reusável. 2 steps: ensure-db (cria o database) -> goose-up (migra).
# As migrations chegam por GIT ARTIFACT (checkout em runtime), não mais por ConfigMap/volume.
# Isso é o que mata a verruga: inputs.artifacts faz parte do template, então é herdado via
# templateRef (ao contrário de spec.volumes, que é spec-level e NÃO é herdado).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: clickhouse-migrate
  namespace: {{ .Release.Namespace }}
spec:
  entrypoint: main
  serviceAccountName: {{ .Values.serviceAccountName }}
  podMetadata:
    labels:
      app.kubernetes.io/name: analytics-etl
  templates:
    - name: main
      steps:
        - - name: ensure-db
            template: ensure-db
        - - name: goose-up
            template: goose-up

    # cria o database (idempotente) via HTTP — fora do goose (chicken-egg da version table)
    - name: ensure-db
      container:
        image: {{ .Values.curlImage }}
        command: [sh, -c]
        args:
          - >
            curl -fsS "http://{{ .Values.clickhouse.host }}:{{ .Values.clickhouse.httpPort }}/"
            -H "X-ClickHouse-User: admin"
            -H "X-ClickHouse-Key: ${ADMIN_PW}"
            --data-binary "CREATE DATABASE IF NOT EXISTS {{ .Values.clickhouse.database }}"
        env:
          - name: ADMIN_PW
            valueFrom:
              secretKeyRef:
                name: {{ .Values.clickhouse.adminSecret.name }}
                key: {{ .Values.clickhouse.adminSecret.key }}

    # roda as migrations. Projeto vem do git em /src; GOOSE_MIGRATION_DIR aponta pro subdir.
    # Imagem GENÉRICA: o DSN (com encoding da senha) é montado aqui no command.
    - name: goose-up
      inputs:
        artifacts:
          - name: repo
            path: /src
            git:
              repo: {{ .Values.git.repo | quote }}
              revision: {{ .Values.git.revision | quote }}
              depth: 1
              {{- if .Values.git.credsSecret }}
              # repo privado: secret com username + token (PAT/deploy token read-only)
              usernameSecret:
                name: {{ .Values.git.credsSecret }}
                key: username
              passwordSecret:
                name: {{ .Values.git.credsSecret }}
                key: token
              {{- end }}
      container:
        image: {{ .Values.goose.image }}
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            PWENC="$(printf '%s' "$ADMIN_PW" | jq -sRr @uri)"
            export GOOSE_DRIVER=clickhouse
            export GOOSE_DBSTRING="clickhouse://admin:${PWENC}@{{ .Values.clickhouse.host }}:{{ .Values.clickhouse.nativePort }}/{{ .Values.clickhouse.database }}"
            export GOOSE_MIGRATION_DIR="/src/{{ .Values.migrations.dir }}"
            # ANALYTICS_PASSWORD fica no env -> o envsub da migration o substitui.
            goose up
            goose status
        env:
          - name: ADMIN_PW
            valueFrom:
              secretKeyRef:
                name: {{ .Values.clickhouse.adminSecret.name }}
                key: {{ .Values.clickhouse.adminSecret.key }}
          - name: ANALYTICS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.clickhouse.analyticsSecret.name }}
                key: {{ .Values.clickhouse.analyticsSecret.key }}
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 500m, memory: 256Mi }
