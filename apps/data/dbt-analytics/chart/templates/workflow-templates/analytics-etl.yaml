# DAG do ELT: migrate (goose, reusa clickhouse-migrate) -> dbt build.
# NOTA: o volume `migrations` precisa ser declarado AQUI também — templateRef empresta só o
# template, não o spec.volumes da clickhouse-migrate. O goose-up monta esse volume.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: analytics-elt
  namespace: {{ .Release.Namespace }}
spec:
  entrypoint: dag
  serviceAccountName: {{ .Values.serviceAccountName }}
  volumes:
    - name: migrations
      configMap:
        name: {{ .Values.migrations.configMapName }}
  metrics:
    prometheus:
      - name: analytics_elt_duration_seconds
        help: "Duração da última execução do ELT analytics"
        gauge:
          value: "{{`{{workflow.duration}}`}}"
      - name: analytics_elt_runs_total
        help: "Execuções do ELT por status final"
        labels:
          - key: status
            value: "{{`{{workflow.status}}`}}"
        counter:
          value: "1"
        when: "{{`{{workflow.status}}`}} != Running"
  arguments:
    parameters:
      - name: revision
        value: {{ .Values.dbt.git.revision | quote }}
  templates:
    - name: dag
      dag:
        tasks:
          - name: migrate
            templateRef:
              name: clickhouse-migrate
              template: main
          - name: dbt-build
            dependencies: [migrate]
            template: dbt-build
            arguments:
              parameters:
                - name: revision
                  value: "{{`{{workflow.parameters.revision}}`}}"

    - name: dbt-build
      inputs:
        parameters:
          - name: revision
        artifacts:
          - name: repo
            path: /src
            git:
              repo: {{ .Values.dbt.git.repo | quote }}
              revision: "{{`{{inputs.parameters.revision}}`}}"
              depth: 1
              {{- if .Values.dbt.git.credsSecret }}
              usernameSecret:
                name: {{ .Values.dbt.git.credsSecret }}
                key: username
              passwordSecret:
                name: {{ .Values.dbt.git.credsSecret }}
                key: token
              {{- end }}
      container:
        image: {{ .Values.dbt.image }}
        workingDir: /src/{{ .Values.dbt.projectDir }}
        args: ["build", "--profiles-dir", "."]
        env:
          - name: CH_HOST
            value: {{ .Values.clickhouse.host }}
          - name: CH_PORT
            value: "{{ .Values.clickhouse.httpPort }}"
          - name: CH_USER
            value: analytics
          - name: CH_DATABASE
            value: {{ .Values.clickhouse.database }}
          - name: CH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.clickhouse.analyticsSecret.name }}
                key: {{ .Values.clickhouse.analyticsSecret.key }}
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits: { cpu: "1", memory: 1Gi }
