# DAG do ETL: migrate (goose, reusa clickhouse-migrate) -> dbt build.
# VERRUGA REMOVIDA: não há mais `spec.volumes` aqui. O goose-up agora recebe as migrations
# por git artifact (inputs.artifacts), que É herdado via templateRef — então o `migrate`
# (templateRef -> clickhouse-migrate/main) traz tudo que precisa sozinho. Sem acoplamento.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: analytics-etl
  namespace: {{ .Release.Namespace }}
spec:
  entrypoint: dag
  serviceAccountName: {{ .Values.serviceAccountName }}
  podMetadata:
    labels:
      app.kubernetes.io/name: analytics-etl
  arguments:
    parameters:
      - name: revision
        value: {{ .Values.git.revision | quote }}   # branch ou SHA (pina o dbt-build no run)
  # Métricas custom emitidas no fim do run (prefixo final na VM: argo_workflows_*).
  metrics:
    prometheus:
      - name: analytics_etl_duration_seconds
        help: "Duração da última execução do ETL analytics"
        gauge:
          realtime: false
          value: "{{`{{workflow.duration}}`}}"
      - name: analytics_etl_runs_total
        help: "Execuções do ETL por status final"
        labels:
          - key: status
            value: "{{`{{workflow.status}}`}}"
        counter:
          value: "1"
        when: "{{`{{workflow.status}}`}} != Running"
  templates:
    - name: dag
      dag:
        tasks:
          - name: migrate
            templateRef:
              name: clickhouse-migrate
              template: main
          - name: dbt-build
            dependencies: [migrate]
            template: dbt-build
            arguments:
              parameters:
                - name: revision
                  value: "{{`{{workflow.parameters.revision}}`}}"

    - name: dbt-build
      inputs:
        parameters:
          - name: revision
        artifacts:
          - name: repo
            path: /src
            git:
              repo: {{ .Values.git.repo | quote }}
              revision: "{{`{{inputs.parameters.revision}}`}}"
              depth: 1
              {{- if .Values.git.credsSecret }}
              usernameSecret:
                name: {{ .Values.git.credsSecret }}
                key: username
              passwordSecret:
                name: {{ .Values.git.credsSecret }}
                key: token
              {{- end }}
      container:
        image: {{ .Values.dbt.image }}
        workingDir: /src/{{ .Values.dbt.projectDir }}
        args: ["build", "--profiles-dir", "."]
        env:
          - name: CH_HOST
            value: {{ .Values.clickhouse.host }}
          - name: CH_PORT
            value: "{{ .Values.clickhouse.httpPort }}"
          - name: CH_USER
            value: analytics
          - name: CH_DATABASE
            value: {{ .Values.clickhouse.database }}
          - name: CH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.clickhouse.analyticsSecret.name }}
                key: {{ .Values.clickhouse.analyticsSecret.key }}
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits: { cpu: "1", memory: 1Gi }
