# Dispara a migration via o WorkflowTemplate. Validação da Etapa 2.
#   kubectl create -f test/wf-clickhouse-migrate.yaml
#   kubectl -n data get wf -w
# (ou: argo submit -n data --from workflowtemplate/clickhouse-migrate --watch)
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: clickhouse-migrate-
  namespace: data
spec:
  workflowTemplateRef:
    name: clickhouse-migrate
