version: 2

models:
  - name: int_observations_model
    description: "stg_observations enriquecido com model_dim (canônico/provider/is_local/tier/kind) e project_dim (nome/role)."

  - name: mart_llm_usage_daily
    description: "Custo, tokens e contagens por dia × projeto × modelo × tier × type."
    columns:
      - name: total_cost
        description: "Soma de total_cost. No projeto dos agentes (role='agents') é o custo EFETIVO do LiteLLM (header x-litellm-response-cost via span da app). Somar entre projetos ainda mistura fontes distintas, então agregue por projeto."

  - name: mart_llm_latency_daily
    description: "Percentis de latência (ms) por dia × modelo."

  - name: mart_unmapped_models
    description: "Auditoria: provided_model_name fora do seed. Vazio = seed completo."
