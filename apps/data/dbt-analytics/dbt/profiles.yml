# Conexão via env vars. Local (Etapa 3): port-forward do CH + user analytics (HOST 127.0.0.1
# já liberado na migration 0001). In-cluster (Etapa 4): pod no CIDR 10.245.0.0/16 (também liberado).
# Sem default pra senha de propósito (falha se não setar).
analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CH_HOST', 'localhost') }}"
      port: "{{ env_var('CH_PORT', '8123') | int }}"
      user: "{{ env_var('CH_USER', 'analytics') }}"
      password: "{{ env_var('CH_PASSWORD') }}"
      schema: "{{ env_var('CH_DATABASE', 'analytics') }}"
      secure: false
      connect_timeout: 10
      send_receive_timeout: 300
