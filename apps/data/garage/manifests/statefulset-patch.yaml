# Strategic Merge Patch no StatefulSet gerado pelo chart do Garage.
# Adiciona envFrom apontando para o Secret do ESO com GARAGE_RPC_SECRET
# e GARAGE_ADMIN_TOKEN — que o chart não suporta nativamente.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: data
spec:
  template:
    spec:
      containers:
        - name: garage
          envFrom:
            - secretRef:
                name: garage-secrets
