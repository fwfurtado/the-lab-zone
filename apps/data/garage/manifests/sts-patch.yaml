apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: data
spec:
  template:
    spec:
      initContainers:
        - name: fix-secret-permissions
          image: busybox:stable
          command:
            - sh
            - -c
            - chmod 0600 /etc/garage-secrets/rpcSecret /etc/garage-secrets/adminToken
          volumeMounts:
            - name: garage-secrets
              mountPath: /etc/garage-secrets/rpcSecret
              subPath: rpcSecret
            - name: garage-secrets
              mountPath: /etc/garage-secrets/adminToken
              subPath: adminToken
