apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: garage
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - data
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  podMetricsEndpoints:
    - port: "3903"
      path: /metrics
