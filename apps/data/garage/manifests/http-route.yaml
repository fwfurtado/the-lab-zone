# Expõe a API S3 internamente: s3.lab.the-lab.zone
# Usado por pgBackRest, Velero, ClickHouse backup, etc.
# Não exposto externamente — sem TLS público necessário aqui.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-s3
  namespace: data
spec:
  parentRefs:
    - name: internal-gateway
      namespace: gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "s3.lab.the-lab.zone"
  rules:
    - backendRefs:
        - name: garage
          port: 3900
          group: ''
          kind: Service
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
