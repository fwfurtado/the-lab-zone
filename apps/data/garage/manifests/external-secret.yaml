apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: garage-secrets
    creationPolicy: Owner
    # ESO gera um ConfigMap com o garage.toml já interpolado.
    # O chart usa existingConfigMap para montar esse ConfigMap como config.
    template:
      engineVersion: v2
      type: Opaque
      data:
        # garage.toml completo com secrets interpolados diretamente
        garage.toml: |
          metadata_dir = "/mnt/meta"
          data_dir = "/mnt/data"

          db_engine = "lmdb"
          block_size = 1048576
          replication_factor = 1
          compression_level = 1
          metadata_auto_snapshot_interval = "6h"

          rpc_bind_addr = "[::]:3901"
          rpc_secret = "{{ .rpcSecret }}"

          [kubernetes_discovery]
          namespace = "data"
          service_name = "garage"
          skip_crd = false

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:3900"
          root_domain = ""

          [s3_web]
          bind_addr = "[::]:3902"
          root_domain = ""
          index = "index.html"

          [admin]
          api_bind_addr = "[::]:3903"
          admin_token = "{{ .adminToken }}"
  data:
    - secretKey: rpcSecret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: garage
        property: rpc-secret
    - secretKey: adminToken
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: garage
        property: admin-token
