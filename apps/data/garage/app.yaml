apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: data
  sources:
    - repoURL: https://git.deuxfleurs.fr/Deuxfleurs/garage.git
      path: script/helm/garage
      targetRevision: v2.3.0
      helm:
        releaseName: garage
        valueFiles:
          - $values/apps/data/garage/values.yaml
    - repoURL: https://github.com/fwfurtado/the-lab-zone.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/fwfurtado/the-lab-zone.git
      targetRevision: main
      path: apps/data/garage/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: garage
      namespace: data
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
