# Garage v2.3.0 — single-node, homelab
# Breaking changes vs v1: replication_mode → replication_factor + consistency_mode
# allow_world_readable_secrets agora é opção do toml (não só env var)

garage:
  replicationFactor: 1        # v2: era replicationMode
  dbEngine: "lmdb"
  compressionLevel: "1"
  metadataAutoSnapshotInterval: "6h"
  rpcBindAddr: "[::]:3901"
  rpcSecret: ""               # chart gera automaticamente

  s3:
    api:
      region: "garage"
      rootDomain: ""
    web:
      rootDomain: ""
      index: "index.html"

  # toml completo com secrets via _file e allow_world_readable_secrets no próprio config
  garageTomlString: |
    metadata_dir = "/mnt/meta"
    data_dir = "/mnt/data"

    db_engine = "lmdb"
    block_size = "1M"
    replication_factor = 1
    compression_level = 1
    metadata_auto_snapshot_interval = "6h"

    rpc_bind_addr = "[::]:3901"
    rpc_secret_file = "/etc/garage-secrets/rpcSecret"

    # Permite arquivos de secret com permissão de grupo (fsGroup do K8s)
    # Sem isso o Garage recusa iniciar quando fsGroup aplica bit de leitura de grupo
    allow_world_readable_secrets = true

    [kubernetes_discovery]
    namespace = "data"
    service_name = "garage"
    skip_crd = false

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ""

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ""
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token_file = "/etc/garage-secrets/adminToken"

deployment:
  kind: StatefulSet
  replicaCount: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: OnDelete

persistence:
  enabled: true
  meta:
    storageClass: "openebs-hostpath"
    size: 5Gi
  data:
    storageClass: "openebs-hostpath-ssd"
    size: 100Gi

image:
  repository: dxflrs/amd64_garage
  pullPolicy: IfNotPresent
  tag: ""

extraVolumes:
  - name: garage-secrets
    projected:
      defaultMode: 0600
      sources:
        - secret:
            name: garage-secrets
            items:
              - key: GARAGE_RPC_SECRET
                path: rpcSecret
              - key: GARAGE_ADMIN_TOKEN
                path: adminToken

extraVolumeMounts:
  - name: garage-secrets
    mountPath: /etc/garage-secrets/rpcSecret
    subPath: rpcSecret
    readOnly: true
  - name: garage-secrets
    mountPath: /etc/garage-secrets/adminToken
    subPath: adminToken
    readOnly: true

environment: {}

service:
  type: ClusterIP
  s3:
    api:
      port: 3900
    web:
      port: 3902

ingress:
  s3:
    api:
      enabled: false
    web:
      enabled: false

monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 5
  periodSeconds: 10
