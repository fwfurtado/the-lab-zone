# Garage v1.3.x — single-node, homelab
# Secrets injetados via Strategic Merge Patch no StatefulSet (manifests/sts-patch.yaml)
# O chart não suporta envFrom nem valueFrom no campo environment.

garage:
  replicationMode: "1"
  dbEngine: "lmdb"
  compressionLevel: "1"
  metadataAutoSnapshotInterval: "6h"
  rpcBindAddr: "[::]:3901"
  rpcSecret: ""

  s3:
    api:
      region: "garage"
      rootDomain: ""
    web:
      rootDomain: ""
      index: "index.html"


deployment:
  kind: StatefulSet
  replicaCount: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: OnDelete

persistence:
  enabled: true
  meta:
    storageClass: "openebs-hostpath"
    size: 5Gi
  data:
    storageClass: "openebs-hostpath"
    size: 100Gi

image:
  repository: dxflrs/amd64_garage
  pullPolicy: IfNotPresent
  tag: ""

extraVolumes: {}
extraVolumeMounts: {}
environment:
  GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"

service:
  type: ClusterIP
  s3:
    api:
      port: 3900
    web:
      port: 3902

ingress:
  s3:
    api:
      enabled: false
    web:
      enabled: false

monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 5
  periodSeconds: 10
