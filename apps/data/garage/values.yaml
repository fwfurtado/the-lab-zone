# Garage v1.3.x — single-node, homelab
# Fase 6: object storage interno para WAL CNPG, backups ClickHouse,
#          snapshots Qdrant, e blobs gerais (Langfuse, Forgejo LFS)

garage:
  dbEngine: "lmdb"
  replicationMode: "1"        # single-node: sem replicação
  compressionLevel: "1"       # zstd nível 1
  metadataAutoSnapshotInterval: "6h"

  rpcBindAddr: "[::]:3901"
  rpcSecret: ""               # vazio = chart gera e armazena num Secret K8s automático
                              # para single-node não há risco: sem outros nós para autenticar

  s3:
    api:
      region: "garage"
      rootDomain: ""          # path-style: sem DNS wildcard necessário
    web:
      rootDomain: ""
      index: "index.html"

  # adminToken injetado via garageTomlString que lê env var
  # A env var vem do extraVolumes montando o Secret do ESO
  garageTomlString: |
    metadata_dir = "/mnt/meta"
    data_dir = "/mnt/data"

    db_engine = "{{ .Values.garage.dbEngine }}"
    block_size = {{ .Values.garage.blockSize | default "1048576" }}
    replication_factor = {{ .Values.garage.replicationMode }}
    compression_level = {{ .Values.garage.compressionLevel }}
    metadata_auto_snapshot_interval = "{{ .Values.garage.metadataAutoSnapshotInterval }}"

    rpc_bind_addr = "{{ .Values.garage.rpcBindAddr }}"
    rpc_secret_file = "/etc/garage-secrets/rpcSecret"

    [kubernetes_discovery]
    namespace = "{{ .Release.Namespace }}"
    service_name = "{{ include "garage.fullname" . }}"
    skip_crd = {{ .Values.garage.kubernetesSkipCrd }}

    [s3_api]
    s3_region = "{{ .Values.garage.s3.api.region }}"
    api_bind_addr = "[::]:3900"
    root_domain = "{{ .Values.garage.s3.api.rootDomain }}"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = "{{ .Values.garage.s3.web.rootDomain }}"
    index = "{{ .Values.garage.s3.web.index }}"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token_file = "/etc/garage-secrets/adminToken"

deployment:
  kind: StatefulSet
  replicaCount: 1
  podManagementPolicy: OrderedReady

persistence:
  enabled: true
  meta:
    storageClass: "openebs-hostpath"
    size: 5Gi
  data:
    storageClass: "openebs-hostpath"
    size: 100Gi

image:
  repository: dxflrs/amd64_garage
  pullPolicy: IfNotPresent
  tag: ""

# Monta o Secret do ESO como arquivos — garage lê via *_file no toml
# Evita o problema do campo environment que só aceita strings literais
extraVolumes:
  - name: garage-secrets
    secret:
      secretName: garage-secrets
      defaultMode: 0600  # Garage recusa iniciar se secret for world-readable

extraVolumeMounts:
  - name: garage-secrets
    mountPath: /etc/garage-secrets
    readOnly: true

# GARAGE_ALLOW_WORLD_READABLE_SECRETS: escape hatch oficial do Garage para ambientes
# onde o fsGroup do Kubernetes impede permissões 0600 em volumes Secret montados.
# Ref: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/
environment:
  GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"

service:
  type: ClusterIP
  s3:
    api:
      port: 3900
    web:
      port: 3902

ingress:
  s3:
    api:
      enabled: false
    web:
      enabled: false

monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 5
  periodSeconds: 10
