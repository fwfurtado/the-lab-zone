# Garage v1.3.x — single-node, homelab
# Secrets injetados via Strategic Merge Patch no StatefulSet (manifests/sts-patch.yaml)
# O chart não suporta envFrom nem valueFrom no campo environment.

garage:
  replicationMode: "1"
  dbEngine: "lmdb"
  compressionLevel: "1"
  metadataAutoSnapshotInterval: "6h"
  rpcBindAddr: "[::]:3901"
  rpcSecret: ""

  s3:
    api:
      region: "garage"
      rootDomain: ""
    web:
      rootDomain: ""
      index: "index.html"

  # Garage expande ${VAR} no toml em runtime
  garageTomlString: |
    metadata_dir = "/mnt/meta"
    data_dir = "/mnt/data"

    db_engine = "lmdb"
    block_size = 1048576
    replication_factor = 1
    compression_level = 1
    metadata_auto_snapshot_interval = "6h"

    rpc_bind_addr = "[::]:3901"
    rpc_secret_file = "/etc/garage-secrets/rpcSecret"

    [kubernetes_discovery]
    namespace = "data"
    service_name = "garage"
    skip_crd = false

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ""

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ""
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token_file = "/etc/garage-secrets/adminToken"

deployment:
  kind: StatefulSet
  replicaCount: 1
  podManagementPolicy: OrderedReady

persistence:
  enabled: true
  meta:
    storageClass: "openebs-hostpath"
    size: 5Gi
  data:
    storageClass: "openebs-hostpath"
    size: 100Gi

image:
  repository: dxflrs/amd64_garage
  pullPolicy: IfNotPresent
  tag: ""

extraVolumes: {}
extraVolumeMounts: {}
environment: {}

service:
  type: ClusterIP
  s3:
    api:
      port: 3900
    web:
      port: 3902

ingress:
  s3:
    api:
      enabled: false
    web:
      enabled: false

monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 5
  periodSeconds: 10
