# Garage v1.3.x — single-node, homelab
# Fase 6: object storage interno para WAL CNPG, backups ClickHouse,
#          snapshots Qdrant, e blobs gerais (Langfuse, Forgejo LFS)

garage:
  # Configuração ignorada quando existingConfigMap está definido.
  # O ConfigMap/Secret é gerado pelo ESO com os secrets já interpolados.
  existingConfigMap: garage-secrets   # na verdade é um Secret, mas o chart aceita ambos

  # Necessário para o chart não reclamar de valores ausentes
  replicationMode: "1"
  s3:
    api:
      region: "garage"
      rootDomain: ""
    web:
      rootDomain: ""
      index: "index.html"

deployment:
  kind: StatefulSet
  replicaCount: 1
  podManagementPolicy: OrderedReady

persistence:
  enabled: true
  meta:
    storageClass: "openebs-hostpath"
    size: 5Gi
  data:
    storageClass: "openebs-hostpath"
    size: 100Gi

image:
  repository: dxflrs/amd64_garage
  pullPolicy: IfNotPresent
  tag: ""

# Sem environment, sem extraVolumes — config vem toda do existingConfigMap
environment: {}
extraVolumes: {}
extraVolumeMounts: {}

service:
  type: ClusterIP
  s3:
    api:
      port: 3900
    web:
      port: 3902

ingress:
  s3:
    api:
      enabled: false
    web:
      enabled: false

monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 5
  periodSeconds: 10
