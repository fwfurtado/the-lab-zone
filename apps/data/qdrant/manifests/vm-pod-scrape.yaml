apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: qdrant
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - data
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  podMetricsEndpoints:
    - port: http
      path: /metrics
