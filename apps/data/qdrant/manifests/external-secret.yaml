apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qdrant-apikey
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: qdrant-apikey
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: qdrant
        property: apiKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qdrant-backup-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: qdrant-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: garage-qdrant
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: secretKey
      remoteRef:
        key: garage-qdrant
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
