apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qdrant-apikey
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: qdrant-apikey
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: qdrant
        property: apiKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
