# CronJob de snapshot diário do Qdrant → Garage S3
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qdrant-backup
  namespace: data
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            # Step 1: cria snapshot via API e faz download local
            - name: snapshot
              image: curlimages/curl:latest
              env:
                - name: QDRANT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: qdrant-apikey
                      key: apiKey
              command:
                - sh
                - -c
                - |
                  set -e
                  QDRANT_URL="http://qdrant.data.svc.cluster.local:6333"

                  echo "Creating full storage snapshot..."
                  RESPONSE=$(curl -sf -X POST \
                    -H "api-key: $QDRANT_API_KEY" \
                    "$QDRANT_URL/snapshots")
                  echo "Response: $RESPONSE"

                  SNAPSHOT=$(echo "$RESPONSE" | grep -o '"name":"[^"]*"' | cut -d'"' -f4)
                  echo "Snapshot name: $SNAPSHOT"
                  echo "$SNAPSHOT" > /shared/snapshot_name

                  echo "Downloading snapshot..."
                  curl -sf \
                    -H "api-key: $QDRANT_API_KEY" \
                    "$QDRANT_URL/snapshots/$SNAPSHOT" \
                    -o /shared/snapshot.tar.gz
                  echo "Download complete."
              volumeMounts:
                - name: shared
                  mountPath: /shared

          containers:
            # Step 2: upload para o Garage via rclone
            - name: upload
              image: rclone/rclone:latest
              env:
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: qdrant-backup-credentials
                      key: accessKeyId
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: qdrant-backup-credentials
                      key: secretKey
              command:
                - sh
                - -c
                - |
                  set -e
                  SNAPSHOT=$(cat /shared/snapshot_name)
                  SNAPSHOT_DATE=$(date +%Y-%m-%d)

                  mkdir -p /root/.config/rclone
                  cat > /root/.config/rclone/rclone.conf << RCLONE
                  [garage]
                  type = s3
                  provider = Other
                  access_key_id = $S3_ACCESS_KEY
                  secret_access_key = $S3_SECRET_KEY
                  endpoint = http://garage.data.svc.cluster.local:3900
                  region = garage
                  force_path_style = true
                  no_check_bucket = true
                  RCLONE

                  echo "Uploading $SNAPSHOT to Garage..."
                  rclone copyto /shared/snapshot.tar.gz \
                    "garage:qdrant-snapshots/$SNAPSHOT_DATE/$SNAPSHOT"
                  echo "Backup completed: $SNAPSHOT_DATE/$SNAPSHOT"
              volumeMounts:
                - name: shared
                  mountPath: /shared

          volumes:
            - name: shared
              emptyDir: {}
