# CronJob de snapshot diário do Qdrant → Garage S3
# Fluxo: snapshot via API REST → upload via rclone para o Garage
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qdrant-backup
  namespace: data
spec:
  schedule: "0 3 * * *"   # 03:00 UTC todo dia (mesma janela do ClickHouse)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: rclone/rclone:latest
              env:
                - name: QDRANT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: qdrant-apikey
                      key: apiKey
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: qdrant-backup-credentials
                      key: accessKeyId
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: qdrant-backup-credentials
                      key: secretKey
              command:
                - sh
                - -c
                - |
                  set -e
                  QDRANT_URL="http://qdrant.data.svc.cluster.local:6333"
                  SNAPSHOT_DATE=$(date +%Y-%m-%d)

                  echo "Creating full storage snapshot..."
                  SNAPSHOT=$(curl -sf -X POST \
                    -H "api-key: $QDRANT_API_KEY" \
                    "$QDRANT_URL/snapshots" | \
                    grep -o '"name":"[^"]*"' | cut -d'"' -f4)

                  echo "Snapshot created: $SNAPSHOT"

                  # Configura rclone para o Garage
                  mkdir -p /root/.config/rclone
                  cat > /root/.config/rclone/rclone.conf << RCLONE
                  [garage]
                  type = s3
                  provider = Other
                  access_key_id = $S3_ACCESS_KEY
                  secret_access_key = $S3_SECRET_KEY
                  endpoint = http://garage.data.svc.cluster.local:3900
                  force_path_style = true
                  RCLONE

                  echo "Downloading snapshot locally..."
                  curl -sf \
                    -H "api-key: $QDRANT_API_KEY" \
                    "$QDRANT_URL/snapshots/$SNAPSHOT" \
                    -o /tmp/qdrant-snapshot.tar.gz

                  echo "Uploading to Garage S3..."
                  rclone copyto /tmp/qdrant-snapshot.tar.gz \
                    "garage:qdrant-snapshots/$SNAPSHOT_DATE/$SNAPSHOT"

                  echo "Backup completed: $SNAPSHOT_DATE/$SNAPSHOT"
