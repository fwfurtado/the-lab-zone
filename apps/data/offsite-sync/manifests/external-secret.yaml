# Credenciais do espelho off-site: lê do Garage (key escopada read-only nos
# buckets de backup) e escreve no B2 (app key escopada no bucket the-lab-zone-dr).
#
# Itens no 1Password (vault the-lab-zone):
#   garage-dr-sync : accessKeyId, secretKey  (Garage key — read nos 4 buckets)
#   b2-dr-sync     : accessKeyId, secretKey  (B2 app key — rw em the-lab-zone-dr)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dr-offsite-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: dr-offsite-credentials
    creationPolicy: Owner
  data:
    - secretKey: GARAGE_ACCESS_KEY_ID
      remoteRef:
        key: garage-dr-sync
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: GARAGE_SECRET_KEY
      remoteRef:
        key: garage-dr-sync
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: B2_ACCESS_KEY_ID
      remoteRef:
        key: b2-dr-sync
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: B2_SECRET_KEY
      remoteRef:
        key: b2-dr-sync
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
