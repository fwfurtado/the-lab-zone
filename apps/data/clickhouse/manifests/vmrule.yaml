apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: clickhouse-backup
  namespace: data
  labels:
    app.kubernetes.io/name: clickhouse-backup
spec:
  groups:
    - name: clickhouse-backup
      rules:
        - alert: ClickHouseBackupFailed
          expr: |
            sum by (status) (
              increase(argo_workflows_clickhouse_backup_runs_total{status=~"Failed|Error"}[26h])
            ) > 0
          for: 5m
          labels:
            severity: warning
            component: clickhouse-backup
            triage: "true"
          annotations:
            summary: "Backup do ClickHouse falhou"
            description: >-
              O CronWorkflow clickhouse-backup registrou {{ $value }} falha(s)
              nas últimas 26h. Verifique: argo -n data list --completed --prefix
              clickhouse-backup && argo -n data logs @latest

        - alert: ClickHouseBackupMissing
          expr: |
            sum(increase(argo_workflows_clickhouse_backup_runs_total[26h])) < 1
          for: 15m
          labels:
            severity: warning
            component: clickhouse-backup
            triage: "true"
          annotations:
            summary: "Backup do ClickHouse não executou"
            description: >-
              Nenhuma execução do clickhouse-backup foi registrada em 26h
              (esperado diariamente às 03:00 UTC). Verifique: kubectl -n data
              get cronworkflow clickhouse-backup -o wide
