apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-backup
  namespace: data
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: busybox:stable
              command:
                - sh
                - -c
                - |
                  set -e
                  SIDECAR="http://chi-clickhouse-default-0-0.data.svc.cluster.local:7171"
                  BACKUP_NAME="backup-$(date +%Y-%m-%dT%H-%M-%S)"

                  echo "Creating backup: $BACKUP_NAME"
                  wget -qO- --post-data="" "$SIDECAR/backup/create?name=$BACKUP_NAME"

                  echo "Waiting for backup to complete..."
                  sleep 30

                  echo "Uploading backup: $BACKUP_NAME"
                  wget -qO- --post-data="" "$SIDECAR/backup/upload/$BACKUP_NAME"

                  echo "Waiting for upload to complete..."
                  sleep 30

                  echo "Done"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
