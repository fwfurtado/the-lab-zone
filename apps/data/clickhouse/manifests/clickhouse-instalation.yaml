apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse
  namespace: data
spec:
  defaults:
    templates:
      podTemplate: clickhouse-pod
      dataVolumeClaimTemplate: clickhouse-data
      logVolumeClaimTemplate: clickhouse-log

  configuration:
    users:
      # Sem passwordSecretRef — operator não relê Secrets após criação
      # Hashes SHA256 injetados via files/users.d montado no pod
      admin/networks/ip: "::/0"
      admin/access_management: "1"
      langfuse/networks/ip: "::/0"
      langfuse/profile: default
      backup/networks/ip: "::/0"

    files:
      # Arquivo de usuários com hashes SHA256 vindos do Secret via volumeMount
      # O operator monta files/ como /etc/clickhouse-server/config.d/
      "users.d/custom-users.xml": |
        <clickhouse>
          <users>
            <admin>
              <password_sha256_hex from_env="CLICKHOUSE_ADMIN_PASSWORD_SHA256"/>
              <access_management>1</access_management>
              <networks><ip>::/0</ip></networks>
            </admin>
            <langfuse>
              <password_sha256_hex from_env="CLICKHOUSE_LANGFUSE_PASSWORD_SHA256"/>
              <networks><ip>::/0</ip></networks>
              <profile>default</profile>
            </langfuse>
            <backup>
              <password_sha256_hex from_env="CLICKHOUSE_ADMIN_PASSWORD_SHA256"/>
              <networks><ip>::/0</ip></networks>
            </backup>
          </users>
        </clickhouse>

    settings:
      timezone: UTC
      compression/case/method: zstd

    clusters:
      - name: default
        layout:
          shardsCount: 1
          replicasCount: 1

  templates:
    podTemplates:
      - name: clickhouse-pod
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.3
              env:
                - name: CLICKHOUSE_ADMIN_PASSWORD_SHA256
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-credentials
                      key: adminPasswordSha256
                - name: CLICKHOUSE_LANGFUSE_PASSWORD_SHA256
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-credentials
                      key: langfusePasswordSha256
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi

            - name: clickhouse-backup
              image: altinity/clickhouse-backup:latest
              args:
                - server
              env:
                - name: LOG_LEVEL
                  value: info
                - name: ALLOW_EMPTY_BACKUPS
                  value: "true"
                - name: API_LISTEN
                  value: "0.0.0.0:7171"
                - name: CLICKHOUSE_HOST
                  value: localhost
                - name: CLICKHOUSE_PORT
                  value: "9000"
                - name: CLICKHOUSE_USERNAME
                  value: backup
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-credentials
                      key: adminPassword
                - name: S3_BUCKET
                  value: clickhouse-backup
                - name: S3_ENDPOINT
                  value: http://garage.data.svc.cluster.local:3900
                - name: S3_REGION
                  value: garage
                - name: S3_PATH
                  value: clickhouse
                - name: S3_FORCE_PATH_STYLE
                  value: "true"
                - name: S3_DISABLE_SSL
                  value: "true"
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-backup-credentials
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-backup-credentials
                      key: S3_SECRET_KEY
              ports:
                - containerPort: 7171
                  name: backup-api
              volumeMounts:
                - name: clickhouse-data
                  mountPath: /var/lib/clickhouse
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi

    volumeClaimTemplates:
      - name: clickhouse-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
          storageClassName: openebs-hostpath

      - name: clickhouse-log
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          storageClassName: openebs-hostpath
