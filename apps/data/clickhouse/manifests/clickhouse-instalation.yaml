apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse
  namespace: data
spec:
  defaults:
    templates:
      podTemplate: clickhouse-pod
      dataVolumeClaimTemplate: clickhouse-data
      logVolumeClaimTemplate: clickhouse-log

  configuration:
    users:
      # Sem passwordSecretRef — operator não relê Secrets após criação
      # Hashes SHA256 injetados via files/users.d montado no pod
      admin/networks/ip: "::/0"
      admin/access_management: "1"
      langfuse/networks/ip: "::/0"
      langfuse/profile: default
      backup/networks/ip: "::/0"

    files:
      # Habilita endpoint Prometheus na porta 9363
      "config.d/prometheus.xml": |
        <clickhouse>
          <prometheus>
            <endpoint>/metrics</endpoint>
            <port>9363</port>
            <metrics>true</metrics>
            <events>true</events>
            <asynchronous_metrics>true</asynchronous_metrics>
          </prometheus>
        </clickhouse>
      # Nível de log. O default do clickhouse-server é `trace` (emite
      # <Trace>/<Debug> — MergeTree, MemoryTracker — no stdout, coletado pelo
      # filelog → VLS). `information` mantém notice/warning/error e corta o
      # ruído de <Debug>. O <logger><level> controla file E console (o
      # <console> só liga a saída; o threshold é compartilhado).
      # NÃO mexe nos system.*_log — a introspecção do dbt/analytics
      # (GRANT SELECT ON system.*) depende deles.
      "config.d/logger.xml": |
        <clickhouse>
          <logger>
            <level>information</level>
          </logger>
        </clickhouse>
      # Arquivo de usuários com hashes SHA256 vindos do Secret via volumeMount
      # O operator monta files/ como /etc/clickhouse-server/config.d/
      "users.d/custom-users.xml": |
        <clickhouse>
          <users>
            <admin>
              <password_sha256_hex from_env="CLICKHOUSE_ADMIN_PASSWORD_SHA256"/>
              <access_management>1</access_management>
              <networks><ip>::/0</ip></networks>
            </admin>
            <langfuse>
              <password_sha256_hex from_env="CLICKHOUSE_LANGFUSE_PASSWORD_SHA256"/>
              <networks><ip>::/0</ip></networks>
              <profile>default</profile>
            </langfuse>
            <backup>
              <password_sha256_hex from_env="CLICKHOUSE_ADMIN_PASSWORD_SHA256"/>
              <networks><ip>::/0</ip></networks>
            </backup>
            <!-- analytics (dbt/goose): ANTES era criado por SQL na migration goose
                 (CREATE USER IF NOT EXISTS). Dois defeitos: (1) IF NOT EXISTS nunca
                 converge senha em rotação; (2) usuário SQL mora no access storage
                 (storage='disk'), fora do ciclo de vida do operator — sumiu num
                 recreate enquanto goose_db_version (dado, no PVC) sobreviveu, e o
                 goose passou a pular a migration ("no migrations to run").
                 Aqui ele é declarativo: reconciliado a cada boot, senha do ESO.
                 Definido só neste arquivo (senha + rede + grants juntos). -->
            <analytics>
              <password_sha256_hex from_env="CLICKHOUSE_ANALYTICS_PASSWORD_SHA256"/>
              <!-- Least-privilege de rede: pods do cluster + loopback (igual ao
                   HOST IP da migration antiga). Não usa ::/0. -->
              <networks>
                <ip>10.245.0.0/16</ip>
                <ip>127.0.0.1</ip>
                <ip>::1</ip>
              </networks>
              <profile>default</profile>
              <!-- ISOLAMENTO: SELECT em default.* (schema do Langfuse, read-only)
                   + ALL em analytics.* + SELECT em system.* (introspecção do dbt).
                   Nenhuma escrita em default. `grants` é incompatível com
                   access_management/allow_databases — analytics não usa nenhum. -->
              <grants>
                <query>GRANT SELECT ON `default`.*</query>
                <query>GRANT ALL ON analytics.*</query>
                <query>GRANT SELECT ON system.*</query>
              </grants>
            </analytics>
          </users>
        </clickhouse>

    settings:
      timezone: UTC
      compression/case/method: zstd

    clusters:
      - name: default
        layout:
          shardsCount: 1
          replicasCount: 1

  templates:
    podTemplates:
      - name: clickhouse-pod
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9363"
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.12
              env:
                - name: CLICKHOUSE_ADMIN_PASSWORD_SHA256
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-credentials
                      key: adminPasswordSha256
                - name: CLICKHOUSE_LANGFUSE_PASSWORD_SHA256
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-credentials
                      key: langfusePasswordSha256
                # Mesmo valor que o dbt lê em claro no secret clickhouse-analytics
                # (1Password item clickhouse-analytics, campo password) — fonte única.
                - name: CLICKHOUSE_ANALYTICS_PASSWORD_SHA256
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-credentials
                      key: analyticsPasswordSha256
              ports:
                - containerPort: 9363
                  name: metrics
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi

            - name: clickhouse-backup
              image: altinity/clickhouse-backup:latest
              args:
                - server
              env:
                - name: REMOTE_STORAGE
                  value: s3
                - name: LOG_LEVEL
                  value: info
                - name: ALLOW_EMPTY_BACKUPS
                  value: "true"
                - name: API_LISTEN
                  value: "0.0.0.0:7171"
                - name: CLICKHOUSE_HOST
                  value: localhost
                - name: CLICKHOUSE_PORT
                  value: "9000"
                - name: CLICKHOUSE_USERNAME
                  value: backup
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-credentials
                      key: adminPassword
                - name: S3_BUCKET
                  value: clickhouse-backup
                - name: S3_ENDPOINT
                  value: http://garage.data.svc.cluster.local:3900
                - name: S3_REGION
                  value: garage
                - name: S3_PATH
                  value: clickhouse
                - name: S3_FORCE_PATH_STYLE
                  value: "true"
                - name: S3_DISABLE_SSL
                  value: "true"
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-backup-credentials
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-backup-credentials
                      key: S3_SECRET_KEY
              ports:
                - containerPort: 7171
                  name: backup-api
              volumeMounts:
                - name: clickhouse-data
                  mountPath: /var/lib/clickhouse
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi

    volumeClaimTemplates:
      - name: clickhouse-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
          storageClassName: openebs-hostpath-ssd

      - name: clickhouse-log
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          storageClassName: openebs-hostpath-ssd
