# ClickHouseInstallation — single-node, homelab
# Gerenciado pelo altinity-clickhouse-operator
# Fase 6: backend do Langfuse e analytics
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse
  namespace: data
spec:
  defaults:
    templates:
      podTemplate: clickhouse-pod
      dataVolumeClaimTemplate: clickhouse-data
      logVolumeClaimTemplate: clickhouse-log

  configuration:
    users:
      # Usuário admin
      admin/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: clickhouse-credentials
            key: adminPassword
      admin/networks/ip: "::/0"
      admin/access_management: "1"

      # Usuário dedicado para Langfuse
      langfuse/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: clickhouse-credentials
            key: langfusePassword
      langfuse/networks/ip: "::/0"
      langfuse/profile: default

    settings:
      # UTC obrigatório — Langfuse faz queries que quebram com timezone local
      timezone: UTC
      # Compressão padrão
      compression/case/method: zstd

    clusters:
      - name: default
        layout:
          shardsCount: 1
          replicasCount: 1

  templates:
    podTemplates:
      - name: clickhouse-pod
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.3-lts
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi

    volumeClaimTemplates:
      - name: clickhouse-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
          storageClassName: openebs-hostpath

      - name: clickhouse-log
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          storageClassName: openebs-hostpath
