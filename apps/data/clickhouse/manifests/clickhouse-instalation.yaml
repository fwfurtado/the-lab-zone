# ClickHouseInstallation — single-node, homelab
# Passwords via passwordSecretRef (suportado pelo operator 0.25+)
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse
  namespace: data
spec:
  defaults:
    templates:
      podTemplate: clickhouse-pod
      dataVolumeClaimTemplate: clickhouse-data
      logVolumeClaimTemplate: clickhouse-log

  configuration:
    users:
      admin/passwordSecretRef:
        name: clickhouse-credentials
        key: adminPassword
      admin/networks/ip: "::/0"
      admin/access_management: "1"

      langfuse/passwordSecretRef:
        name: clickhouse-credentials
        key: langfusePassword
      langfuse/networks/ip: "::/0"
      langfuse/profile: default

    settings:
      timezone: UTC
      compression/case/method: zstd

    clusters:
      - name: default
        layout:
          shardsCount: 1
          replicasCount: 1

  templates:
    podTemplates:
      - name: clickhouse-pod
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.3-lts
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi

    volumeClaimTemplates:
      - name: clickhouse-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
          storageClassName: openebs-hostpath

      - name: clickhouse-log
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          storageClassName: openebs-hostpath
