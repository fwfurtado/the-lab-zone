apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: clickhouse
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - data
  selector:
    matchLabels:
      clickhouse.altinity.com/chi: clickhouse
  podMetricsEndpoints:
    - port: "9363"
      path: /metrics
