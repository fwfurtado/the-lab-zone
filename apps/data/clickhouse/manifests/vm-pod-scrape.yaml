apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: clickhouse
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - data
  selector:
    matchLabels:
      clickhouse.altinity.com/chi: clickhouse
      clickhouse.altinity.com/app: chop
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
