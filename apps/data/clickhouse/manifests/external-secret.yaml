apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: clickhouse-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Plaintext — usado pelo sidecar clickhouse-backup
        adminPassword: "{{ .adminPassword }}"
        langfusePassword: "{{ .langfusePassword }}"
        # SHA256 hex — usado diretamente no chi.yaml via configmap externo
        adminPasswordSha256: "{{ .adminPassword | sha256sum }}"
        langfusePasswordSha256: "{{ .langfusePassword | sha256sum }}"
        # analytics: hash pro users.d do CHI. A senha em claro NÃO é exposta aqui —
        # o dbt a lê do secret clickhouse-analytics (mesmo item/campo no 1Password),
        # então os dois lados convergem por construção.
        analyticsPasswordSha256: "{{ .analyticsPassword | sha256sum }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: clickhouse
        property: adminPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: langfusePassword
      remoteRef:
        key: clickhouse
        property: langfusePassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    # Item SEPARADO (clickhouse-analytics), o mesmo consumido pelo ExternalSecret do
    # dbt-analytics. Rotacionar lá converge os dois: hash no CHI + senha em claro no dbt.
    - secretKey: analyticsPassword
      remoteRef:
        key: clickhouse-analytics
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-backup-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: clickhouse-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: garage-clickhouse
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: garage-clickhouse
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
