# apps/data/cnpg/manifests/consumers/openwebui.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openwebui
  namespace: data
spec:
  name: openwebui
  owner: openwebui
  databaseReclaimPolicy: retain
  cluster:
    name: cnpg-cluster
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-role-openwebui
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cnpg-role-openwebui
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "openwebui"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: open-webui
        property: pgPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
