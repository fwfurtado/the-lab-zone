# apps/data/cnpg/manifests/consumers/litellm.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: litellm
  namespace: data
spec:
  name: litellm
  owner: litellm
  databaseReclaimPolicy: retain
  cluster:
    name: cnpg-cluster
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-role-litellm
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cnpg-role-litellm
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "litellm"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: litellm
        property: pgPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
