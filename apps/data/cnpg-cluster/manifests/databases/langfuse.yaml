apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: langfuse
  namespace: data
spec:
  name: langfuse
  owner: langfuse
  databaseReclaimPolicy: retain     # não dropa o db se o CR sumir
  cluster:
    name: cnpg-cluster              # confirme o nome do seu Cluster
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-role-langfuse
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cnpg-role-langfuse
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth      # username + password, exatamente o que managed.roles espera
      data:
        username: "langfuse"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: langfuse
        property: pgPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
