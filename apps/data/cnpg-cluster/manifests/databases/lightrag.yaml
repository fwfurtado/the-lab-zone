apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: lightrag
  namespace: data
spec:
  name: lightrag
  owner: lightrag
  databaseReclaimPolicy: retain
  cluster:
    name: cnpg-cluster
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-role-lightrag
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cnpg-role-lightrag
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "lightrag"
        password: "{{ .pgPassword }}"
  data:
    - secretKey: pgPassword
      remoteRef:
        key: lightrag
        property: pgPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
