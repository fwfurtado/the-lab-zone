apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cnpg-cluster
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - data
  selector:
    matchLabels:
      cnpg.io/cluster: cnpg-cluster
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
