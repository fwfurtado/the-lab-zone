# CNPG cluster chart v0.6.1 — PostgreSQL 18, single-instance, homelab
# Fase 6: backend relacional para Langfuse, LangGraph checkpointer, apps gerais

# Tipo postgresql (default) — sem extensões especiais como TimescaleDB
type: postgresql

# Modo standalone — novo cluster, não replica nem restore
mode: standalone

cluster:
  instances: 1

  # PostgreSQL 18 — imagem standard (minimal + extensões, sem Barman embutido)
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie

  storage:
    size: 20Gi
    storageClass: openebs-hostpath

  postgresql:
    parameters:
      # UTC obrigatório — Langfuse quebra com timezone local
      timezone: "UTC"
      log_timezone: "UTC"
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"

  # Roles gerenciados pelo ExternalSecret
  roles:
    - name: langfuse
      ensure: present
      inherit: true
      connectionLimit: -1
      login: true
      superuser: false
      passwordSecret:
        name: cnpg-role-langfuse
    - name: litellm
      ensure: present
      inherit: true
      connectionLimit: -1
      login: true
      superuser: false
      passwordSecret:
        name: cnpg-role-litellm
    - name: openwebui
      ensure: present
      inherit: true
      connectionLimit: -1
      login: true
      superuser: false
      passwordSecret:
        name: cnpg-role-openwebui
    - name: lightrag
      ensure: present
      inherit: true
      connectionLimit: -1
      login: true
      superuser: false
      passwordSecret:
        name: cnpg-role-lightrag

  # Usuário app criado no bootstrap — cada app cria seu próprio database depois
  initdb:
    database: app
    owner: app
    secret:
      name: cnpg-app-user

  superuserSecret: cnpg-superuser

  # Monitoring via VMAgent annotation — PodMonitor deprecated no CNPG 1.29
  monitoring:
    enablePodMonitor: false

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi

backups:
  enabled: true
  provider: s3
  endpointURL: http://garage.data.svc.cluster.local:3900
  destinationPath: s3://cnpg-wal/
  s3:
    region: garage
    bucket: cnpg-wal
    path: /
    # o chart 0.6.1 quer os valores; aponta pro secret existente NÃO é suportado
    # nativamente aqui — ver nota abaixo sobre a env do path-style e creds.
    accessKey: ""      # ver nota: preenchido via secret.name, não inline
    secretKey: ""
  secret:
    create: false
    name: cnpg-garage-creds   # secret que o ESO já materializa
  wal:
    compression: gzip
    encryption: ""            # Garage não faz SSE; "" evita header x-amz-...
    maxParallel: 2
  data:
    compression: gzip
    encryption: ""            # idem — NÃO deixar o default AES256
    jobs: 2
  scheduledBackups:
    - name: daily-backup
      schedule: "0 0 2 * * *" # 6 campos no CNPG (seg min hora ...) — 02:00 UTC
      backupOwnerReference: self
      method: barmanObjectStore
  retentionPolicy: "7d"
