# CNPG cluster chart v0.6.1 — PostgreSQL 18, single-instance, homelab
# Fase 6: backend relacional para Langfuse, LangGraph checkpointer, apps gerais

# Tipo postgresql (default) — sem extensões especiais como TimescaleDB
type: postgresql

# Modo standalone — novo cluster, não replica nem restore
mode: standalone

cluster:
  instances: 1

  # PostgreSQL 18 — imagem standard (minimal + extensões, sem Barman embutido)
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie

  storage:
    size: 20Gi
    storageClass: openebs-hostpath

  postgresql:
    parameters:
      # UTC obrigatório — Langfuse quebra com timezone local
      timezone: "UTC"
      log_timezone: "UTC"
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"

  # Roles gerenciados pelo ExternalSecret
  roles:
    - name: langfuse
      ensure: present
      inherit: true
      connectionLimit: -1
      login: true
      superuser: false
      passwordSecret:
        name: cnpg-role-langfuse
    - name: litellm
      ensure: present
      inherit: true
      connectionLimit: -1
      login: true
      superuser: false
      passwordSecret:
        name: cnpg-role-litellm

  # WAL archiving para Garage via barman-object-store
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-wal/
      endpointURL: http://garage.data.svc.cluster.local:3900
      s3Credentials:
        accessKeyId:
          name: cnpg-garage-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-garage-creds
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "7d"

  # Usuário app criado no bootstrap — cada app cria seu próprio database depois
  initdb:
    database: app
    owner: app
    secret:
      name: cnpg-app-user

  superuserSecret: cnpg-superuser

  # Monitoring via VMAgent annotation — PodMonitor deprecated no CNPG 1.29
  monitoring:
    enablePodMonitor: false

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi

# Backup diário às 02:00 UTC
scheduledBackup:
  enabled: true
  schedule: "0 2 * * *"
  backupOwnerReference: self
  immediate: true
