apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: data
  source:
    repoURL: https://github.com/fwfurtado/the-lab-zone.git
    targetRevision: main
    path: apps/data/cnpg-cluster/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  ignoreDifferences:
    # CNPG rotaciona o campo managed passwords — ignora drift no secret
    - group: ""
      kind: Secret
      namespace: data
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
