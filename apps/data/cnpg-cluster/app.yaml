apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: data
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cluster
      targetRevision: 0.6.1
      helm:
        releaseName: cnpg-cluster
        valueFiles:
          - $values/apps/data/cnpg-cluster/values.yaml
    - repoURL: https://github.com/fwfurtado/the-lab-zone.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/fwfurtado/the-lab-zone.git
      targetRevision: main
      path: apps/data/cnpg-cluster/manifests
    - repoURL: https://github.com/fwfurtado/the-lab-zone.git
      targetRevision: main
      path: apps/data/cnpg-cluster/manifests/databases
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  ignoreDifferences:
    # CNPG rotaciona o campo managed passwords — ignora drift no secret
    - group: ""
      kind: Secret
      namespace: data
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
