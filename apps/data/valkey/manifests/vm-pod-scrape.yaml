apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: valkey-exporter
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - data
  selector:
    matchLabels:
      app: valkey-exporter
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
