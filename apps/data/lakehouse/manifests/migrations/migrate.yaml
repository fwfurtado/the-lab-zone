# Runner de migrations do lakehouse (one-shot). O bootstrap antigo virou a m001.
# Migrations ESCREVEM na tabela => contrato single-writer. Procedimento de rerun:
#   1. kubectl -n data patch sparkapplication generator-accounts --type merge -p '{"spec":{"suspend":true}}'
#   2. kubectl -n data delete sparkapplication lakehouse-migrate   # ArgoCD recria e roda
#   3. kubectl -n data logs lakehouse-migrate-driver -f            # até MIGRATE_OK
#   4. kubectl -n data patch sparkapplication generator-accounts --type merge -p '{"spec":{"suspend":false}}'
# Migration nova = release nova da imagem lakehouse-jobs + bump da tag aqui e nos
# demais jobs + rerun acima.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: lakehouse-migrate
  namespace: data
spec:
  type: Python
  mode: cluster
  image: ghcr.io/fwfurtado/lakehouse-jobs:0.2.2
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/app/migrate.py
  sparkVersion: "4.1.1"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 30
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 60
  sparkConf:
    # ---- bloco s3a canônico (Garage) ----
    spark.hadoop.fs.s3a.endpoint: "http://garage.data.svc.cluster.local:3900"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.endpoint.region: "garage"
    spark.hadoop.fs.s3a.aws.credentials.provider: "software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    # ---- bloco Delta canônico ----
    spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
    spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    spark.sql.shuffle.partitions: "8"
  driver:
    serviceAccount: spark-operator-spark
    cores: 1
    memory: "1g"
    # Não co-locar Spark com Garage: o tráfego S3/Delta força leituras frias no
    # Garage e dispara major page faults quando ambos disputam o mesmo page cache.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.lab/compute
                  operator: In
                  values:
                    - "true"
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: garage
                app.kubernetes.io/instance: garage
            topologyKey: kubernetes.io/hostname
    tolerations:
      - key: workload.lab/compute
        operator: Equal
        value: "true"
        effect: NoSchedule
    envFrom:
      - secretRef:
          name: spark-garage-credentials
  executor:
    instances: 1
    cores: 1
    memory: "1g"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.lab/compute
                  operator: In
                  values:
                    - "true"
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: garage
                app.kubernetes.io/instance: garage
            topologyKey: kubernetes.io/hostname
    tolerations:
      - key: workload.lab/compute
        operator: Equal
        value: "true"
        effect: NoSchedule
    envFrom:
      - secretRef:
          name: spark-garage-credentials
