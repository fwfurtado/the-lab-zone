apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spark-garage-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: spark-garage-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Nomes exigidos pelo org.apache.hadoop.fs.s3a.EnvironmentVariableCredentialsProvider
        # (não são os S3_ACCESS_KEY/S3_SECRET_KEY genéricos usados pelo ClickHouse/Barman).
        AWS_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: garage-spark
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: secretKey
      remoteRef:
        key: garage-spark
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
