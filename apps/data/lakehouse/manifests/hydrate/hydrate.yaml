# Hidratação one-shot do Pinot: snapshot@V da Delta -> tópico accounts.cdf com
# _commit_version=V (o comparison column do upsert resolve o interleaving com o
# stream vivo -- SEM suspend de nada). Idempotente; rerun:
#   kubectl -n data delete sparkapplication lakehouse-hydrate   # ArgoCD recria
# Reusa o user spark-cdf (já tem Write+Describe no tópico).
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: lakehouse-hydrate
  namespace: data
spec:
  type: Python
  mode: cluster
  image: ghcr.io/fwfurtado/lakehouse-jobs:0.2.0
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/app/hydrate.py
  sparkVersion: "4.1.1"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 30
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 60
  sparkConf:
    # ---- bloco s3a canônico (Garage) ----
    spark.hadoop.fs.s3a.endpoint: "http://garage.data.svc.cluster.local:3900"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.endpoint.region: "garage"
    spark.hadoop.fs.s3a.aws.credentials.provider: "software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    # ---- bloco Delta canônico ----
    spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
    spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    spark.sql.shuffle.partitions: "8"
  driver:
    serviceAccount: spark-operator-spark
    cores: 1
    memory: "1g"
    # Não co-locar Spark com Garage: o tráfego S3/Delta força leituras frias no
    # Garage e dispara major page faults quando ambos disputam o mesmo page cache.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.lab/compute
                  operator: In
                  values:
                    - "true"
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: garage
                app.kubernetes.io/instance: garage
            topologyKey: kubernetes.io/hostname
    tolerations:
      - key: workload.lab/compute
        operator: Equal
        value: "true"
        effect: NoSchedule
    env:
      - name: TABLE_PATH
        value: "s3a://lakehouse/tables/accounts"
      - name: KAFKA_TOPIC
        value: "accounts.cdf"
      - name: KAFKA_BOOTSTRAP
        value: "redpanda.data.svc.cluster.local:9093"
      - name: KAFKA_USERNAME
        value: "spark-cdf"
    envFrom:
      - secretRef:
          name: spark-garage-credentials
      - secretRef:
          name: spark-kafka-credentials
    volumeMounts:
      - name: redpanda-ca
        mountPath: /etc/redpanda-ca
        readOnly: true
  executor:
    instances: 1
    cores: 1
    memory: "1g"
    # mesma lição do gerador: fatia nativa (buffers do producer Kafka + Netty)
    memoryOverhead: "512m"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.lab/compute
                  operator: In
                  values:
                    - "true"
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: garage
                app.kubernetes.io/instance: garage
            topologyKey: kubernetes.io/hostname
    tolerations:
      - key: workload.lab/compute
        operator: Equal
        value: "true"
        effect: NoSchedule
    env:
      - name: KAFKA_USERNAME
        value: "spark-cdf"
    envFrom:
      - secretRef:
          name: spark-garage-credentials
      - secretRef:
          name: spark-kafka-credentials
    volumeMounts:
      - name: redpanda-ca
        mountPath: /etc/redpanda-ca
        readOnly: true
  volumes:
    - name: redpanda-ca
      secret:
        secretName: redpanda-default-cert
        items:
          - key: ca.crt
            path: ca.crt
