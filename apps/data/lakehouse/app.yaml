apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lakehouse
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"   # depois de garage(1) e spark-operator/core(6)
spec:
  project: data
  sources:
    - repoURL: https://github.com/fwfurtado/the-lab-zone.git
      targetRevision: main
      path: apps/data/lakehouse/manifests
      # manifests organizados em subdirs por app (shared/bootstrap/generator/
      # streaming/jupyter); sem recurse o source de diretório ignora subdirs
      # e o prune deletaria todos os recursos
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
