apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: memgraph-lab
  namespace: data
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
      sectionName: https-wildcard

  hostnames:
    - "memgraph.lab.the-lab.zone"
  rules:
    - backendRefs:
        - name: memgraph-lab
          port: 3000
          group: ""
          kind: Service
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
