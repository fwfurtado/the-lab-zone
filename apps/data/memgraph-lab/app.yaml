apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memgraph-lab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: data
  sources:
    - repoURL: https://memgraph.github.io/helm-charts
      chart: memgraph-lab
      targetRevision: 1.0.0
      helm:
        releaseName: memgraph-lab
        valueFiles:
          - $values/apps/data/memgraph-lab/values.yaml
    - repoURL: https://github.com/fwfurtado/the-lab-zone.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/fwfurtado/the-lab-zone.git
      targetRevision: main
      path: apps/data/memgraph-lab/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
