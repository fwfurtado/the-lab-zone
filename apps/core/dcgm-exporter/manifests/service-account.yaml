# SA dedicada, SEM RBAC: o DCGM nao fala com o API server. O mapeamento GPU->pod
# (DCGM_EXPORTER_KUBERNETES=true) usa o socket local do kubelet (pod-resources gRPC),
# que nao passa por RBAC. Entao nada de ClusterRole/Binding aqui.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcgm-exporter
  namespace: kube-system
  labels:
    app.kubernetes.io/name: dcgm-exporter
