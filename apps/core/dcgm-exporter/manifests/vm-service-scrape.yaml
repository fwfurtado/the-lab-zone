# Diz pro VMAgent raspar o Service do DCGM.
#
# >>> DISCOVERY CROSS-NAMESPACE <<<
# O VMAgent do victoria-metrics-k8s-stack descobre VMServiceScrapes no namespace DELE
# (observability) — e nao no kube-system. Por isso este objeto vive na observability e
# usa namespaceSelector p/ apontar pro Service do DCGM la no kube-system.
#
# GitOps: continua nesta mesma Application (dcgm-exporter). A destination da App e
# kube-system, mas o AppProject `core` permite destinations em namespace "*", entao o
# ArgoCD aplica este objeto na observability via o metadata.namespace explicito.
#
# (Se um dia o teu VMAgent tiver selectAllByDefault: true, este objeto funciona igual —
#  o namespaceSelector so torna o alvo explicito.)
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: dcgm-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: dcgm-exporter
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
