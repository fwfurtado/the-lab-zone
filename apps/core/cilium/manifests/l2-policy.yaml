apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lab-l2
spec:
  externalIPs: true
  loadBalancerIPs: true
  interfaces:
    - ^ens[0-9]+$
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
      # Fase 10: worker-3-gpu usa enp7s0 (não casa ^ens) e é o nó de manutenção
      # frequente (driver/GPU). Fora do pool de anúncio L2 do gateway.
      - key: kubernetes.io/hostname
        operator: NotIn
        values:
          - worker-3-gpu
