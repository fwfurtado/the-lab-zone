apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: core
  sources:
    - repoURL: https://helm.altinity.com
      chart: altinity-clickhouse-operator
      targetRevision: 0.27.1
      helm:
        releaseName: clickhouse-operator
        valueFiles:
          - $values/apps/core/clickhouse-operator/values.yaml
    - repoURL: https://github.com/fwfurtado/the-lab-zone.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: clickhouse-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
