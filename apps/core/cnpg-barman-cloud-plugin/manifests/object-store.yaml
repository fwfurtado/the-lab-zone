apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-garage-store
  namespace: data
spec:
  retentionPolicy: "7d"
  instanceSidecarConfiguration:
    env:
      # path-style: Garage tem root_domain="" (OBRIGATÓRIO)
      - name: BARMAN_S3_USE_PATH_STYLE
        value: "true"
      # region real do Garage (o s3Credentials.region é ignorado pelo boto3 — issue #9724)
      - name: AWS_DEFAULT_REGION
        value: "garage"
      # workaround do checksum sha256 do boto3 com S3 não-AWS (issue #393)
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: "when_required"
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: "when_required"
  configuration:
    destinationPath: s3://cnpg-wal/
    endpointURL: http://garage.data.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: cnpg-garage-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-garage-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 2   # SEM encryption (Garage não faz SSE)
    data:
      compression: gzip
      jobs: 2
