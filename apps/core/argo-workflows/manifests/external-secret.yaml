# Credenciais Garage do artifact repo. O secret vive no ns onde os Workflows rodam (`data`),
# porque o controller resolve accessKeySecret/secretKeySecret no namespace do Workflow.
# Item 1Password `garage-argo` (key Garage com owner do bucket argo-workflows), no padrão dos
# outros garage-* da Fase 6.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-artifacts
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: argo-artifacts
  data:
    - secretKey: accessKey
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: garage-argo
        property: accessKeyId
    - secretKey: secretKey
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: garage-argo
        property: secretKey
