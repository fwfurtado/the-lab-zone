# node-agent monta hostPath (/var/lib/kubelet/pods) e roda privileged pra ler os
# volumes dos outros pods. No Talos o PodSecurity default barra isso — então o ns
# precisa ser `privileged` (mesma classe da isenção do kube-system pro DCGM/Fase 7).
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
