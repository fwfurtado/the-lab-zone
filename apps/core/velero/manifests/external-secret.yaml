# O plugin AWS do Velero quer um arquivo de credenciais no formato ini, na chave
# `cloud` do secret. O ESO monta o item b2-velero (1Password) nesse formato via
# template.
#
# Item no 1Password (vault the-lab-zone):
#   b2-velero : accessKeyId, secretKey  (B2 app key — rw em the-lab-zone-velero)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-b2-creds
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: velero-b2-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .accessKeyId }}
          aws_secret_access_key={{ .secretKey }}
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: b2-velero
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: secretKey
      remoteRef:
        key: b2-velero
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
