apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "10.40.7.10"
  listeners:
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.lab.the-lab.zone"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-lab-tls       # cert-manager cria via a annotation
      allowedRoutes:
        namespaces:
          from: All                       # HTTPRoutes de qualquer ns podem anexar
