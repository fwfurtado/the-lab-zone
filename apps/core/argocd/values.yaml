# ArgoCD — instalado pelo bootstrap.sh, adotado por ele mesmo via GitOps.

configs:
  params:
    # TLS termina no Gateway (Fase 2.5); o server fica HTTP interno:
    server.insecure: true

  cm:
    # Diffs mais estáveis com charts que geram campos server-side:
    application.resourceTrackingMethod: annotation
    # Health check de Applications dentro de app-of-apps:
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

    url: https://argocd.lab.the-lab.zone
    oidc.config: |
      name: Authentik
      issuer: https://auth.mgmt.the-lab.zone/application/o/argocd/
      clientID: argocd
      # resolve do Secret `argocd-oidc` (ESO) — exige o label part-of: argocd
      clientSecret: $argocd-oidc:client_secret
      requestedScopes: [openid, profile, email, groups, offline_access]
      requestedIDTokenClaims:
        groups:
          essential: true

  rbac:
    # `the-lab-admins` = o grupo (não-superuser) que você criou no directory.tf.
    # O scope `groups` precisa estar ligado pro ArgoCD ler o claim.
    policy.csv: |
      g, the-lab-admins, role:admin
    scopes: "[groups]"

# SSO entra com o Authentik (Fase 6); até lá, admin local:
dex:
  enabled: false

notifications:
  enabled: false

# Homelab: sem HA do ArgoCD — réplicas únicas, menos RAM.
redis-ha:
  enabled: false
controller:
  replicas: 1
server:
  replicas: 1
repoServer:
  replicas: 1
