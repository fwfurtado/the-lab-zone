# apps/core/argocd/manifests/externalsecret-oidc.yaml
#
# Lê o item oidc-argocd (vault the-lab-zone) — o MESMO que o módulo authentik/sso
# setou no Authentik — e materializa o Secret `argocd-oidc` no namespace argocd.
#
# DETALHE QUE PEGA: o argocd-server só resolve a referência `$secret:key` no
# oidc.config se o Secret tiver o label `app.kubernetes.io/part-of: argocd`.
# Sem o label, o ArgoCD ignora o secret e o clientSecret chega vazio.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd # OBRIGATÓRIO p/ o $argocd-oidc:client_secret resolver
  data:
    - secretKey: client_secret
      remoteRef:
        key: oidc-argocd # título do item no vault the-lab-zone
        property: client_secret
