# Kyverno — perfil homelab (single-replica; HA nao necessario).
# Os defaults do chart ja sobem 1 replica por controller, entao aqui so enxugamos
# o que nao usamos. Tuning fino de recursos: ver o values reference do chart em
# https://artifacthub.io/packages/helm/kyverno/kyverno?modal=values
#
# Controllers do Kyverno:
#   - admissionController  (obrigatorio) -> faz a mutacao na admissao (nossa policy depende dele)
#   - backgroundController (gera/atualiza policy reports; necessario p/ mutateExisting)
#   - reportsController    (PolicyReports — visibilidade do que foi mutado/validado)
#   - cleanupController    (CleanupPolicy/TTL de recursos) -> NAO usamos

# Nao usamos CleanupPolicy -> desliga p/ economizar recursos
cleanupController:
  enabled: false

# Os CRDs wgpolicyk8s.io ficam sob ownership do trivy-polr-adapter, que alimenta
# o Policy Reporter. Evita shared ownership e conflitos de upgrade/migracao entre
# o app core/kyverno e a stack security.
crds:
  groups:
    wgpolicyk8s:
      clusterpolicyreports: false
      policyreports: false

# Desligamos os PolicyReports do Kyverno para nao disputar ownership dos CRDs
# wgpolicyk8s.io com a stack security. A mutacao/admission continua funcionando.
# backgroundController:
#   enabled: false
reportsController:
  enabled: false
