image:
  repository: ghcr.io/berriai/litellm-database
  tag: "" # segue o appVersion do chart

replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 2Gi
  limits:
    memory: 4Gi

service:
  type: ClusterIP
  port: 4000

# master key vem do secret (o chart injeta PROXY_MASTER_KEY)
masterkeySecretName: litellm-env
masterkeySecretKey: masterkey

# salt + openrouter + langfuse keys → env (envFrom)
environmentSecrets:
  - litellm-env

# OTLP para o OTel Collector (DaemonSet). OTEL_ENDPOINT aponta pro serviço do
# collector-agent na 4318 (OTLP/HTTP). service.name=litellm separa esse tráfego no
# Langfuse (projeto único por service.name) e é o filtro que MANTÉM o LiteLLM fora
# do pipeline traces/langfuse — ele só chega ao Tempo.
# OTEL_EXPORTER=otlp_http é o transporte HTTP (não exige grpcio na imagem).
envVars:
  OTEL_EXPORTER: "otlp_http"
  OTEL_SERVICE_NAME: "litellm"

extraEnvVars:
  - name: HOST_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  - name: OTEL_ENDPOINT
    value: "http://$(HOST_IP):4318"

# DB existente (CNPG) — credenciais via secret dedicado
db:
  useExisting: true
  deployStandalone: false
  endpoint: cnpg-cluster-rw.data.svc.cluster.local
  database: litellm
  secret:
    name: litellm-db
    usernameKey: username
    passwordKey: password

# pod auto-migra (replica única) — sem job/hook
migrationJob:
  enabled: false

# /metrics é enterprise → sem ServiceMonitor/scrape
serviceMonitor:
  enabled: false

proxyConfigMap:
  create: true
proxy_config:
  model_list:
    # # --- local (self-hosted, RTX 3090 @ worker-3-gpu — free + privado) ---
    # - model_name: qwen3-coder-30b-local
    #   litellm_params:
    #     # MoE: 30B total / 3B ativos. q4_K_M = 19GB -> cabe na 3090.
    #     model: ollama_chat/qwen3-coder:30b-a3b-q4_K_M
    #     api_base: http://ollama.ai.svc.cluster.local:11434
    #     num_ctx: 32768 # capa o contexto p/ nao estourar os 24GB (19GB peso + KV)
    #   model_info:
    #     mode: chat

    - model_name: lightrag
      litellm_params:
        # ollama_chat usa /api/chat — que é o endpoint que o LightRAG emula.
        # (ollama puro usa /api/generate, que o LightRAG pode não implementar.)
        model: ollama_chat/lightrag:latest
        api_base: http://lightrag.ai.svc.cluster.local:9621
        # LightRAG está com API Key auth; o header que ele espera é X-API-Key.
        extra_headers:
          X-API-Key: os.environ/LIGHTRAG_API_KEY
      model_info:
        mode: chat

    - model_name: kimi-k2.7-code-paid
      litellm_params:
        model: openrouter/moonshotai/kimi-k2.7-code
        api_key: os.environ/OPENROUTER_API_KEY

    - model_name: qwen3-embedding # alias estável p/ o LightRAG
      litellm_params:
        model: openai/qwen/qwen3-embedding-8b # via openai-compat, não openrouter/ (bug #17773)
        api_base: https://openrouter.ai/api/v1
        api_key: os.environ/OPENROUTER_API_KEY

    # --- gratuitos (:free — rate limit por dia, ver nota) ---
    - model_name: qwen3-coder
      litellm_params:
        model: openrouter/qwen/qwen3-coder:free
        api_key: os.environ/OPENROUTER_API_KEY

    - model_name: qwen3-next-80b
      litellm_params:
        model: openrouter/qwen/qwen3-next-80b-a3b-instruct:free
        api_key: os.environ/OPENROUTER_API_KEY

    - model_name: gemma-4-26b
      litellm_params:
        model: openrouter/google/gemma-4-26b-a4b-it:free
        api_key: os.environ/OPENROUTER_API_KEY

    - model_name: gpt-oss-120b
      litellm_params:
        model: openrouter/openai/gpt-oss-120b:free
        api_key: os.environ/OPENROUTER_API_KEY

    # --- pagos ---
    - model_name: minimax-m3-paid
      litellm_params:
        model: openrouter/minimax/minimax-m3
        api_key: os.environ/OPENROUTER_API_KEY

    - model_name: deepseek-v4-pro-paid
      litellm_params:
        model: openrouter/deepseek/deepseek-v4-pro
        api_key: os.environ/OPENROUTER_API_KEY

    - model_name: deepseek-v4-flash-paid
      litellm_params:
        model: openrouter/deepseek/deepseek-v4-flash
        api_key: os.environ/OPENROUTER_API_KEY

    - model_name: qwen3-coder-paid
      litellm_params:
        model: openrouter/qwen/qwen3-coder
        api_key: os.environ/OPENROUTER_API_KEY
      model_info:
        hidden: true

    - model_name: qwen3-coder-next-paid
      litellm_params:
        model: openrouter/qwen/qwen3-coder-next
        api_key: os.environ/OPENROUTER_API_KEY

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    user_header_name: X-OpenWebUI-User-Id

  litellm_settings:
    # LiteLLM não escreve mais no Langfuse: a instrumentação vive na app (o span
    # de generation é dono do custo EFETIVO, lido do header x-litellm-response-cost)
    # e o ledger autoritativo de spend é o DB do LiteLLM. Removido o
    # success_callback: ["langfuse"] — era a origem da duplicação no projeto
    # gateway. (As keys LANGFUSE_* do secret langfuse-gateway ficam órfãs; podar
    # depois, junto com o projeto gateway.)
    num_retries: 2
    # Instrumentação OTLP: o callback "otel" emite um trace por request
    # (proxy -> auth -> LLM call -> DB). Vai pro OTel Collector (envVars abaixo),
    # que faz fanout: TUDO -> Tempo; só os 3 agentes -> Langfuse (filtro por
    # service.name no pipeline traces/langfuse). Logo o LiteLLM NÃO reabre a
    # duplicação no Langfuse que a remoção do success_callback matou — ele aparece
    # só no Tempo, virando o nó REAL que hoje o service graph mostra como virtual.
    callbacks: ["otel"]
    fallbacks:
      - { "qwen3-coder": ["qwen3-coder-paid"] }
      - { "gpt-oss-120b": ["deepseek-v4-flash-paid"] }
      - { "qwen3-next-80b": ["deepseek-v4-flash-paid"] }
      - { "gemma-4-26b": ["deepseek-v4-flash-paid"] }
      # minimax-m3-paid é o primário do qa-bot e da triagem. Cadeia:
      #   minimax-m3-paid -> deepseek-v4-flash-paid -> gpt-oss-120b (free)
      # deepseek-v4-flash é o pick para QA/triagem (tool-calling + RAG): iguala o
      # Pro em raciocínio a ~12x menos custo; o Pro só compensa em loops agênticos
      # profundos e recall factual, que não é este caso. gpt-oss-120b (free) é a
      # última rede — família diferente dos frees já saturados, então tem chance de
      # não estar no MESMO 429. Se o gpt-oss-120b também vier a viver estrangulado,
      # troque por outro free de família distinta.
      - { "minimax-m3-paid": ["deepseek-v4-flash-paid", "gpt-oss-120b"] }

  # Comportamento do router sob falha/429. Aplica a TODOS os model groups.
  router_settings:
    # Ao tomar 429/erro, o deployment sai da rotação por N segundos em vez de ser
    # martelado de novo. É o que reduz as tentativas natimortas que apareciam no
    # trace (router repetido, 18s de latência). 60s dá tempo da janela de rate
    # limit do provider free renovar antes de tentar de novo.
    cooldown_time: 60
    # Quantas falhas na janela de cooldown antes de esfriar o deployment. 2 =
    # tolera um pico isolado, mas esfria rápido um provider consistentemente em 429.
    allowed_fails: 2
    # usage-based-routing-v2 distribui por TPM/RPM ENTRE deployments do mesmo
    # model_name. Hoje cada modelo é único (um provider por nome), então isto é
    # quase inócuo — passa a valer quando você registrar o mesmo modelo em vários
    # providers. Incluído para já deixar a política pronta; o que resolve o 429
    # agora é cooldown + fallback acima.
    routing_strategy: usage-based-routing-v2
