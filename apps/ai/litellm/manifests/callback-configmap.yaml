apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-callback-files
  namespace: ai
data:
  # Shim de compatibilidade LiteLLM <-> headroom. Resolve DOIS descasamentos:
  #
  # 1. O LiteLLM exige uma INSTÂNCIA nomeada (formato "arquivo.instancia"); o
  #    headroom-ai só exporta a CLASSE HeadroomCallback. Este arquivo instancia.
  #    Montado via subPath em /etc/litellm/custom_callbacks.py (dir do --config).
  #
  # 2. HeadroomCallback herda só de `object` — imita a interface de callback do
  #    LiteLLM por duck-typing (só implementa async_pre_call_hook, a compressão).
  #    O LiteLLM 1.90.2 chama outros hooks do CustomLogger (post_success,
  #    post_failure, streaming) e estoura com 'object has no attribute ...'.
  #    A herança dupla (HeadroomCallback, CustomLogger) resolve a CATEGORIA
  #    inteira: o pre_call vem do headroom (primeiro no MRO), todos os outros
  #    hooks caem nos defaults do CustomLogger. Sem whack-a-mole por hook.
  custom_callbacks.py: |
    from headroom.integrations.litellm_callback import HeadroomCallback
    from litellm.integrations.custom_logger import CustomLogger


    class _HeadroomCallback(HeadroomCallback, CustomLogger):
        # MRO: _HeadroomCallback -> HeadroomCallback -> CustomLogger -> object.
        # async_pre_call_hook (compressão) vem do HeadroomCallback; os demais
        # hooks que o LiteLLM possa chamar vêm dos defaults do CustomLogger.
        pass


    headroom_callback = _HeadroomCallback()
