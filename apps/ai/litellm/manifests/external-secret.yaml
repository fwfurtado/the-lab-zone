apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: litellm-env
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: litellm
        property: masterKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: litellm
        property: saltKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openrouter
        property: apiKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: langfuse-gateway
        property: publicKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: langfuse-gateway
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
  # LANGFUSE_HOST é fixo (service interno) — adiciono via template
  # (se preferir, crie a property no 1Password)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: litellm-db
    template:
      engineVersion: v2
      data:
        username: "litellm"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: litellm
        property: pgPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
