apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headroom
  namespace: argocd
  annotations:
    # Depois do litellm (wave 2): o headroom encaminha o tráfego comprimido pra ele.
    # Dependência é de runtime, não de deploy, mas mantém a ordem coerente.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai
  # Single-source raw: serviço único env-driven, sem chart. Só a triagem aponta
  # pra cá (LITELLM_BASE_URL); QA/LightRAG/resto seguem direto no litellm.
  source:
    repoURL: https://github.com/fwfurtado/the-lab-zone
    targetRevision: main
    path: apps/ai/headroom/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
