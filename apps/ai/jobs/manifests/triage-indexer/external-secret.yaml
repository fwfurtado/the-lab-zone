# Credenciais do triage-indexer para LER os relatórios do Garage (bucket
# triage-reports) via rclone. Idealmente uma Garage key escopada READ-ONLY no
# bucket triage-reports — o indexer só lê; a escrita é da borda triage-webhook.
#
# Item no 1Password (vault the-lab-zone):
#   triage-indexer-garage : GARAGE_ACCESS_KEY, GARAGE_SECRET_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: triage-indexer-garage
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: triage-indexer-garage
    creationPolicy: Owner
  data:
    - secretKey: GARAGE_ACCESS_KEY
      remoteRef:
        key: garage-triage
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: GARAGE_SECRET_KEY
      remoteRef:
        key: garage-triage
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
# Chave do LiteLLM para o step `classifier` do WorkflowTemplate (ADR-0013).
# Mesmo item 1Password que a borda usa (Labot/litellm-token) — o classificador é
# só mais um consumidor do gateway.
#
# O código lê `LITELLM_API_KEY`; o item no 1Password chama `litellm-token`. O
# mapeamento vive aqui, não no código.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: triage-indexer-litellm
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: triage-indexer-litellm
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_KEY
      remoteRef:
        key: Labot
        property: litellm-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
