# mcp-searxng (ihor-sokoliuk 0.8.0) — busca web + leitura de URL.
#
# POR QUE STDIO (e nao HTTP nativo): o bridge TEM modo HTTP (MCP_HTTP_PORT), mas
# BINDA em 127.0.0.1 e NAO expoe env de host. O CONFIGURATION.md oficial so lista
# MCP_HTTP_PORT na secao HTTP Transport — nao existe MCP_HTTP_HOST (isso e do fork
# OvertliDS/mcp-searxng-enhanced). Como o proxy do ToolHive roda em POD SEPARADO e
# chega pelo Service -> pod, ele nunca alcanca o 127.0.0.1 do backend (connection
# refused). Logo, HTTP nativo so funcionaria colado no cliente (mesma maquina).
#
# Solucao: STDIO + proxyMode streamable-http (igual github/fastcrw). O proxy anexa no
# stdin/stdout do pod (sem bind de rede) e expoe streamable-http pros clientes.
# Single-session (chamadas serializam) — OK pra uso solo. Como e stdio, nao depende de
# Service de backend acessivel -> imune a Cilium/Kyverno.
#
# Consome o engine via SEARXNG_URL (-> searxng-engine, API JSON ja habilitada).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: searxng
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # depois do engine SearXNG (wave 0)
spec:
  image: docker.io/isokoliuk/mcp-searxng:1.11.1
  transport: stdio
  proxyMode: streamable-http      # so vale com transport: stdio — expoe HTTP no proxy
  proxyPort: 8080
  env:
    - name: SEARXNG_URL
      value: "http://searxng-engine.ai.svc.cluster.local:8080"
  permissionProfile:
    type: builtin
    name: network        # alcanca o engine SearXNG + faz fetch nas URLs (tool web_url_read)
  resources:
    limits:
      cpu: "250m"
      memory: "128Mi"
    requests:
      cpu: "25m"
      memory: "32Mi"
