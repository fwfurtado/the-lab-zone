# Engine SearXNG (metabusca). NAO e um MCPServer — e um workload normal que o
# mcp-searxng consome via SEARXNG_URL. O initContainer copia o settings.yml do
# ConfigMap pra um emptyDir e substitui o placeholder do secret_key pelo valor do
# ESO (ConfigMap e read-only, por isso o copy+sed num emptyDir gravavel).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      initContainers:
        - name: render-settings
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              sed "s|__SEARXNG_SECRET__|${SEARXNG_SECRET}|" \
                /tmp/template/settings.yml > /etc/searxng/settings.yml
              # o container principal roda non-root; garante leitura do settings e
              # escrita no dir (o entrypoint do SearXNG pode tocar /etc/searxng no boot)
              chmod 0777 /etc/searxng
              chmod 0644 /etc/searxng/settings.yml
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: secretKey
          volumeMounts:
            - name: settings-template
              mountPath: /tmp/template
            - name: settings
              mountPath: /etc/searxng
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.6.8-f3fab143b
          ports:
            - containerPort: 8080
          # A imagem atual (Granian) ja bind em :::8080 por default (GRANIAN_HOST/PORT).
          # Se num cluster IPv4-only o bind :: nao pegar, force: env GRANIAN_HOST=0.0.0.0
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
      volumes:
        - name: settings-template
          configMap:
            name: searxng-settings
        - name: settings
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: ai
spec:
  selector:
    app: searxng
  ports:
    - name: http
      port: 8080
      targetPort: 8080
