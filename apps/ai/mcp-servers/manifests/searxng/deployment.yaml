# Engine SearXNG (metabusca). NAO e um MCPServer — workload normal que o mcp-searxng
# consome via SEARXNG_URL.
#
# NOME `searxng-engine` (NAO `searxng`) DE PROPOSITO: o MCPServer se chama `searxng`, e
# o ToolHive cria um Deployment com o nome do MCPServer (`searxng`) pro proxy. Se o
# engine tambem fosse `searxng`, os dois Deployments colidiriam (mesmo nome/ns) e o
# proxy do MCP nao subiria. Por isso o engine fica `searxng-engine`.
#
# O initContainer copia o settings.yml do ConfigMap pra um emptyDir e injeta o
# secret_key do ESO (ConfigMap e read-only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-engine
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng-engine
  template:
    metadata:
      labels:
        app: searxng-engine
    spec:
      # Desliga service links (boa pratica; o rename ja tira a colisao SEARXNG_PORT,
      # mas mantemos por seguranca contra qualquer outra var <NOME>_PORT/_HOST).
      enableServiceLinks: false
      initContainers:
        - name: render-settings
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              sed "s|__SEARXNG_SECRET__|${SEARXNG_SECRET}|" \
                /tmp/template/settings.yml > /etc/searxng/settings.yml
              # o container principal roda non-root; garante leitura do settings e
              # escrita no dir (o entrypoint do SearXNG pode tocar /etc/searxng no boot)
              chmod 0777 /etc/searxng
              chmod 0644 /etc/searxng/settings.yml
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: secretKey
          volumeMounts:
            - name: settings-template
              mountPath: /tmp/template
            - name: settings
              mountPath: /etc/searxng
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.6.8-f3fab143b
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
      volumes:
        - name: settings-template
          configMap:
            name: searxng-settings
        - name: settings
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng-engine
  namespace: ai
spec:
  selector:
    app: searxng-engine
  ports:
    - name: http
      port: 8080
      targetPort: 8080
