# secret_key do SearXNG. Gere um valor aleatorio (ex.: `openssl rand -hex 32`) e
# guarde no 1Password no item `searxng`, campo `secretKey`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-secret
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: searxng-secret
    creationPolicy: Owner
  data:
    - secretKey: secretKey
      remoteRef:
        key: searxng
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
