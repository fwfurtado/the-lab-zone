---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: VirtualMCPServer
metadata:
  name: lab-vmcp
  namespace: ai
spec:
  groupRef:
    name: lab-readonly
  config:
    # Prefixo evita colisão de tools entre os três backends
    # (ex. um "search" no qdrant vs outro). O bot vê k8s-ro_*, vm-mcp_*, etc.
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"

    operational:
      failureHandling:
        healthCheckInterval: 30s

  # Q&A interno, sem auth de cliente (o boundary read-only está nos backends).
  # Se um dia quiser plugar no Authentik, troca pra type: oidc + oidcConfigRef.
  incomingAuth:
    type: anonymous
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-vmcp
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
      sectionName: https-wildcard
  hostnames:
    - "mcp-readonly.lab.the-lab.zone"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: vmcp-lab-vmcp
          port: 4483
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
