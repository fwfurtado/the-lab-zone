apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-mcp-secret
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: proxmox-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: token-id
      remoteRef:
        key: proxmox-mcp
        property: readonly-token-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: token-secret
      remoteRef:
        key: proxmox-mcp
        property: readonly-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
