# Secret que o MCPServer github referencia (name: github-token, key: token).
# Crie um PAT no GitHub (fine-grained, escopado aos repos que voce quer) e
# guarde no 1Password no item `github-mcp`, campo `pat`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: github-mcp
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
