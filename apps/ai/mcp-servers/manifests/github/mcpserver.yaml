# GitHub MCP. O modo `http` do github-mcp-server v1.4.0 exige OAuth do cliente no
# /mcp (registra "OAuth protected resource endpoints") -> o proxy do ToolHive
# conecta sem token e leva Unauthorized. Solucao (guia oficial Stacklok): rodar em
# STDIO + proxyMode streamable-http. O backend usa o env PAT (sem OAuth de cliente),
# e o proxy expoe streamable-http. Bonus: stdio se anexa ao stdin/stdout do pod, sem
# ClusterIP de backend -> o problema de sessionAffinity/Cilium nao se aplica aqui.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: github
  namespace: ai
spec:
  image: ghcr.io/github/github-mcp-server:v1.6.0
  transport: stdio
  proxyMode: streamable-http   # clientes falam streamable-http no proxy; backend stdio
  proxyPort: 8080
  env:
    - name: GITHUB_TOOLSETS
      value: "repos,issues,pull_requests,actions"
    # so-leitura (opcional): - name: GITHUB_READ_ONLY  value: "1"
  secrets:
    - name: github-token
      key: token
      targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN
  permissionProfile:
    type: builtin
    name: network
  resources:
    limits:
      cpu: "250m"
      memory: "128Mi"
    requests:
      cpu: "25m"
      memory: "32Mi"
