apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-mcp-token
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: argocd-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: argocd-mcp
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
