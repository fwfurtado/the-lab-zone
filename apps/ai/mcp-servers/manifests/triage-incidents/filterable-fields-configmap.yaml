# Campos filtraveis da tool de busca da collection triage_incidents (Fase D).
# Injetado no container via envFrom (escapa da validacao de env do ToolHive).
# JSON minificado numa linha; o pydantic-settings do upstream desserializa.
apiVersion: v1
kind: ConfigMap
metadata:
  name: triage-incidents-filterable-fields
  namespace: ai
# NOTA: 'confirmation' foi removido dos campos filtráveis (ADR-0012). O campo tem
# condition '!=' (o valor passado é EXCLUÍDO), semântica que o agente aplicou
# errado em produção (passou 'unverified', zerando a busca — todos os relatórios
# são unverified hoje). Dormente até a Fatia B dar valores variados a confirmation;
# readicionar então com condition 'any' (valor positivo), não '!='.
# outcome/confidence vêm do artefato de conclusão (ADR-0013), enriquecidos no
# payload pelo indexer. Condition POSITIVA (== high, == diagnosed): o agente
# filtra pelo que QUER, nunca pelo que exclui — a inversão do '!=' derrotou o
# agente em produção (o mesmo motivo da remoção do confirmation, acima).
data:
  FILTERABLE_FIELDS: '[{"name":"namespace","description":"Namespace Kubernetes do incidente (ex.: data, observability, ai). Use para restringir a incidentes do mesmo namespace.","field_type":"keyword","condition":"==","required":false},{"name":"alertnames","description":"Nomes de alerta do incidente (ex.: CiliumPolicyDrop, TargetDown). Use para achar incidentes do mesmo tipo de alerta.","field_type":"keyword","condition":"any","required":false},{"name":"outcome","description":"Se o relatorio chegou a uma causa: diagnosed (elegeu uma causa provavel) ou inconclusive (sem dado suficiente). Filtre outcome=diagnosed para recuperar so triagens que concluiram.","field_type":"keyword","condition":"==","required":false},{"name":"confidence","description":"Confianca do diagnostico PRIMARIO extraida do relatorio: high, medium, low. So existe quando outcome=diagnosed. Filtre confidence=high para so recuperar diagnosticos de alta confianca (a memoria mais confiavel).","field_type":"keyword","condition":"==","required":false},{"name":"confirmation","description":"Se um diagnostico passado foi validado por um humano: confirmed (validado), refuted (desmentido), unverified (sem feedback ainda, a maioria dos casos). Use condition any com uma lista positiva, por exemplo any([confirmed, unverified]) para excluir SO os diagnosticos refutados, sem perder os ainda nao verificados. NUNCA use confirmation diferente de refuted como forma de excluir.","field_type":"keyword","condition":"any","required":false}]'
