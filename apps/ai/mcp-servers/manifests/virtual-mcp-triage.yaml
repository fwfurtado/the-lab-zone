apiVersion: toolhive.stacklok.dev/v1alpha1
kind: VirtualMCPServer
metadata:
  name: triage-vmcp
  namespace: ai
spec:
  groupRef:
    name: lab-readonly
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
      # SEM excludeAllTools. Listo só o que ESCONDER.
      tools:
        # --- workloads fora do escopo: zerados ---
        - workload: argocd
          excludeAll: true
        - workload: grafana
          excludeAll: true
        - workload: qdrant-mcp
          excludeAll: true

        - workload: proxmox
          excludeAll: false
        - workload: kubernetes
          excludeAll: false
        - workload: victoria-metrics
          filter:
            - query
            - query_range
            - labels
            - label_values
            - series
            - metrics
            - metrics_metadata
            - metric_statistics
            - rules
            - alerts
            - tsdb_status
        # --- victoria-logs: poda documentation (RAG) e flags ---
        - workload: victoria-logs
          filter:
            - query
            - hits
            - facets
            - stats_query
            - stats_query_range
            - streams
            - stream_field_names
            - stream_field_values
            - field_names
            - field_values
    operational:
      failureHandling:
        healthCheckInterval: 30s
  incomingAuth:
    type: anonymous
