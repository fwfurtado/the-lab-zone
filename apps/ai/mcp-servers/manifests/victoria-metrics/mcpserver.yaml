apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: victoria-metrics
  namespace: ai
spec:
  image: ghcr.io/victoriametrics/mcp-victoriametrics:1.20.2
  transport: streamable-http
  proxyPort: 8080
  groupRef:
    name: lab-readonly
  env:
    - name: VM_INSTANCE_ENTRYPOINT
      value: "http://vmsingle-victoria-metrics-vmks.observability.svc.cluster.local:8428"
    - name: VM_INSTANCE_TYPE
      value: "single"
    - name: MCP_SERVER_MODE
      value: http
    - name: MCP_LISTEN_ADDR
      value: :8080
    - name: MCP_LOG_FORMAT
      value: "json"
    # Desabilita o vector-DB de documentação embutido. Motivos:
    #  1) É "the main source of resource usage" (RAM/CPU) segundo a doc do mcp-victoriametrics.
    #  2) A resposta da tool `documentation` é logada inteira numa única linha JSON gigante,
    #     que o runtime corta em fragmentos de ~16KB -> só o 1o fragmento tem `level`,
    #     o resto vira unknown no VictoriaLogs (era o dominante do namespace `ai`).
    # Os agentes de triage consultam métricas via MCP, não a documentação embutida.
    - name: MCP_DISABLED_TOOLS
      value: documentation
