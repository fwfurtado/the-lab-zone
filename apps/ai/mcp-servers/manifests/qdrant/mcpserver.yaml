spec:
  image: ofwfurtado/mcp-server-qdrant:0.2.2
  transport: sse
  mcpPort: 8000
  proxyPort: 8080
  env:
    - name: FASTMCP_SERVER_HOST
      value: "0.0.0.0"
    - name: FASTEMBED_CACHE_PATH
      value: "/cache"
    - name: QDRANT_URL
      value: "http://qdrant.data.svc.cluster.local:6333"
    - name: COLLECTION_NAME
      value: "qa_docs"
    - name: EMBEDDING_PROVIDER
      value: "fastembed"
    - name: EMBEDDING_MODEL
      value: "intfloat/multilingual-e5-large"
    - name: QDRANT_READ_ONLY
      value: "true"
  secrets:
    - name: qdrant-apikey-ai
      key: apiKey
      targetEnvName: QDRANT_API_KEY
  permissionProfile:
    type: builtin
    name: network
  podTemplateSpec:
    spec:
      initContainers:
        - name: seed-cache
          image: ofwfurtado/mcp-server-qdrant:0.2.2
          command: ["sh", "-c", "cp -r /opt/models/. /cache/ || true"]
          volumeMounts:
            - name: cache
              mountPath: /cache
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
  resources:
    limits:
      cpu: "500m"
      memory: "2Gi"
    requests:
      cpu: "50m"
      memory: "512Mi"
