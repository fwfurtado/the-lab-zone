apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: qdrant-mcp
  namespace: ai
spec:
  image: ofwfurtado/mcp-server-qdrant:0.2.2
  transport: streamable-http
  mcpPort: 8000
  proxyPort: 8080
  groupRef:
    name: lab-readonly
  args:
    - mcp-server-qdrant
    - --transport
    - streamable-http
  env:
    - name: FASTMCP_SERVER_HOST
      value: "0.0.0.0"
    - name: FASTEMBED_CACHE_PATH
      value: "/cache"
    - name: QDRANT_URL
      value: "http://qdrant.data.svc.cluster.local:6333"
    - name: COLLECTION_NAME
      value: "qa_docs"
    - name: EMBEDDING_PROVIDER
      value: "fastembed"
    - name: EMBEDDING_MODEL
      value: "intfloat/multilingual-e5-large"
    - name: QDRANT_READ_ONLY
      value: "true"
    - name: TOOL_FIND_DESCRIPTION
      value: >-
        Busca na base de conhecimento da infra do homelab the-lab-zone:
        documentação, runbooks, decisões de arquitetura (BOOTSTRAP.md),
        incidentes e configurações. Use SEMPRE que a pergunta for sobre
        como/por que algo está configurado, como um componente funciona,
        ou o histórico/decisões da infraestrutura.
  secrets:
    - name: qdrant-apikey-ai
      key: apiKey
      targetEnvName: QDRANT_API_KEY
  permissionProfile:
    type: builtin
    name: network
  podTemplateSpec:
    spec:
      initContainers:
        - name: seed-cache
          image: ofwfurtado/mcp-server-qdrant:0.2.2
          command: ["sh", "-c", "cp -r /opt/models/. /cache/ || true"]
          volumeMounts:
            - name: cache
              mountPath: /cache
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
  resources:
    limits:
      cpu: "500m"
      memory: "2Gi"
    requests:
      cpu: "50m"
      memory: "512Mi"
