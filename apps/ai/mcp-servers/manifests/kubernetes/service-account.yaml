# ServiceAccount que o pod do MCP de Kubernetes usa pra falar com a API.
# A permissao (read-only) vem do ClusterRoleBinding -> ClusterRole/view, que
# vive no projeto `core` (cluster-scoped): apps/core/toolhive/manifests/kubernetes-mcp-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # antes do MCPServer que a referencia
