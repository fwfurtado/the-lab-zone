# Secret que o MCPServer grafana referencia (name: grafana-token, key: token).
# Crie um Service Account no Grafana com role VIEWER (least-privilege), gere um
# token e guarde no 1Password no item `grafana-mcp`, campo `token`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-token
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: grafana-mcp
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
