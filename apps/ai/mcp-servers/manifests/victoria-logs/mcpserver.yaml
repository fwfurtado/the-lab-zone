apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: victoria-logs
  namespace: ai
spec:
  image: ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0
  transport: streamable-http      # isto é o transport do ToolHive (correto)
  proxyPort: 8080
  groupRef:
    name: lab-readonly
  env:
    - name: VL_INSTANCE_ENTRYPOINT
      value: http://victoria-logs-vls-server.observability.svc.cluster.local:9428
    - name: MCP_SERVER_MODE
      value: http                  # isto é o env do mcp-victorialogs (= Streamable HTTP)
    - name: MCP_LISTEN_ADDR
      value: :8080                 # casa com o proxyPort que o ToolHive espera
    # Mesmo racional do VM MCP: desliga o vector-DB de documentação embutido
    # (RAM/CPU segundo a doc do mcp-victorialogs) e evita dumps futuros da tool
    # `documentation` em linha gigante. Os 649 unknown atuais do VL MCP são
    # access logs logfmt (level=INFO) — devem classificar pela rota logfmt do filelog.
    - name: MCP_DISABLED_TOOLS
      value: documentation
