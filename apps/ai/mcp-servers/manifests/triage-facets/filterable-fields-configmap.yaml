# Campos filtraveis da tool de busca da collection triage_facets (Fase D).
# section e o eixo proprio desta collection. Injetado via envFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: triage-facets-filterable-fields
  namespace: ai
data:
  FILTERABLE_FIELDS: '[{"name":"metadata.section","description":"Faceta do relatorio: symptom (sintoma observado), evidence (metricas/logs/eventos investigados — a LINHA DE RACIOCINIO), cause (causa provavel), next_step (acao sugerida). Filtre por section para buscar dentro de uma faceta especifica.","field_type":"keyword","condition":"==","required":false},{"name":"metadata.namespace","description":"Namespace Kubernetes do incidente (ex.: data, observability, ai).","field_type":"keyword","condition":"==","required":false},{"name":"metadata.confirmation","description":"Estado de confirmacao do diagnostico: unverified, confirmed ou refuted. Use != refuted para excluir o que se provou errado.","field_type":"keyword","condition":"!=","required":false}]'
