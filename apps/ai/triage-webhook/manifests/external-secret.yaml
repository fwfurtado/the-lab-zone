# apps/ai/triage-webhook/manifests/external-secret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: triage-webhook
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: triage-webhook
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_KEY
      remoteRef:
        key: Labot
        property: litellm-token
