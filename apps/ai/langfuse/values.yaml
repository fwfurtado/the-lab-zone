langfuse:
  telemetryEnabled: false

  salt:
    secretKeyRef:
      name: langfuse-secrets
      key: salt
  nextauth:
    url: https://langfuse.lab.the-lab.zone
    secret:
      secretKeyRef:
        name: langfuse-secrets
        key: nextauthSecret
  encryptionKey:
    secretKeyRef:
      name: langfuse-secrets
      key: encryptionKey

  web:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  worker:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi

  additionalEnv:
    # ClickHouse single-node — SEM cluster (não há Keeper → ON CLUSTER trava)
    - name: CLICKHOUSE_CLUSTER_ENABLED
      value: "false"

postgresql:
  deploy: false
  host: cnpg-cluster-rw.data.svc.cluster.local
  port: 5432
  auth:
    username: langfuse
    database: langfuse
    existingSecret: langfuse-secrets
    secretKeys:
      userPasswordKey: pgPassword

clickhouse:
  deploy: false
  host: clickhouse-clickhouse.data.svc.cluster.local
  auth:
    username: langfuse
    existingSecret: langfuse-secrets
    existingSecretKey: chPassword

redis:
  deploy: false
  host: valkey.data.svc.cluster.local
  port: 6379
  auth:
    existingSecret: langfuse-secrets
    existingSecretPasswordKey: redisPassword

s3:
  deploy: false
  # config de conexão top-level — vale pra todos os tipos de upload
  bucket: langfuse
  region: garage
  endpoint: http://garage.data.svc.cluster.local:3900
  forcePathStyle: true                     # obrigatório pro Garage (path-style)
  accessKeyId:
    secretKeyRef:
      name: langfuse-secrets
      key: s3AccessKeyId
  secretAccessKey:
    secretKeyRef:
      name: langfuse-secrets
      key: s3SecretAccessKey
  # cada tipo herda bucket/region/endpoint do top-level; só sobrescrevo o prefix
  eventUpload:
    prefix: events/
  batchExport:
    prefix: exports/
  mediaUpload:
    prefix: media/
