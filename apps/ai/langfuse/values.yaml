langfuse:
  telemetryEnabled: false

  salt:
    secretKeyRef:
      name: langfuse-secrets
      key: salt
  nextauth:
    url: https://langfuse.lab.the-lab.zone
    secret:
      secretKeyRef:
        name: langfuse-secrets
        key: nextauthSecret
  encryptionKey:
    secretKeyRef:
      name: langfuse-secrets
      key: encryptionKey

  web:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi
  worker:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi

  additionalEnv:
    # ClickHouse single-node — SEM cluster (não há Keeper → ON CLUSTER trava)
    - name: CLICKHOUSE_CLUSTER_ENABLED
      value: "false"
    # - name: AUTH_DISABLE_SIGNUP # Failed to compare desired state to live state: failed to calculate diff: error calculating structured merge diff: error building typed value from config resource: .spec.template.spec.containers[name="langfuse-worker"].env: duplicate entries for key [name="AUTH_DISABLE_SIGNUP"]
    #   value: "true"

    # ── OIDC / Authentik (Fase 9) — provider DEDICADO AUTH_AUTHENTIK_* ──────────
    - name: AUTH_AUTHENTIK_CLIENT_ID
      value: "langfuse"             # = chave do app no oidc.tf (não é segredo)
    - name: AUTH_AUTHENTIK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets    # mesmo secret do resto (ESO), nova key abaixo
          key: oidcClientSecret
    # Formato exigido: https://<domain>/application/o/<slug> (trailing slash ok).
    # Com slash p/ casar o `iss` que o Authentik emite (per_provider).
    - name: AUTH_AUTHENTIK_ISSUER
      value: "https://auth.mgmt.the-lab.zone/application/o/langfuse"
    # Linka o login SSO à conta que você JÁ tem no Langfuse (mesmo email) —
    # preserva a org/projetos existentes. Sem isto: erro "sign in with the same
    # provider you used to create this account".
    - name: AUTH_AUTHENTIK_ALLOW_ACCOUNT_LINKING
      value: "true"

postgresql:
  deploy: false
  host: cnpg-cluster-rw.data.svc.cluster.local
  port: 5432
  auth:
    username: langfuse
    database: langfuse
    existingSecret: langfuse-secrets
    secretKeys:
      userPasswordKey: pgPassword

clickhouse:
  deploy: false
  host: clickhouse-clickhouse.data.svc.cluster.local
  auth:
    username: langfuse
    existingSecret: langfuse-secrets
    existingSecretKey: chPassword

redis:
  deploy: false
  host: valkey.data.svc.cluster.local
  port: 6379
  auth:
    existingSecret: langfuse-secrets
    existingSecretPasswordKey: redisPassword

s3:
  deploy: false
  # config de conexão top-level — vale pra todos os tipos de upload
  bucket: langfuse
  region: garage
  endpoint: http://garage.data.svc.cluster.local:3900
  forcePathStyle: true # obrigatório pro Garage (path-style)
  accessKeyId:
    secretKeyRef:
      name: langfuse-secrets
      key: s3AccessKeyId
  secretAccessKey:
    secretKeyRef:
      name: langfuse-secrets
      key: s3SecretAccessKey
  # cada tipo herda bucket/region/endpoint do top-level; só sobrescrevo o prefix
  eventUpload:
    prefix: events/
  batchExport:
    prefix: exports/
  mediaUpload:
    prefix: media/
