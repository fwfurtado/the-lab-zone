apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: langfuse-secrets
    creationPolicy: Owner
  data:

    - secretKey: salt
      remoteRef:
        key: langfuse
        property: salt
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: nextauthSecret
      remoteRef:
        key: langfuse
        property: nextauthSecret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: encryptionKey
      remoteRef:
        key: langfuse
        property: encryptionKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: pgPassword
      remoteRef:
        key: langfuse
        property: pgPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: chPassword
      remoteRef:
        key: clickhouse
        property: langfusePassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: redisPassword
      remoteRef:
        key: valkey
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: s3AccessKeyId
      remoteRef:
        key: garage-langfuse
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: s3SecretAccessKey
      remoteRef:
        key: garage-langfuse
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: oidcClientSecret
      remoteRef:
        key: oidc-langfuse
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
