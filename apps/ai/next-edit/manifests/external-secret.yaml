apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextedit-secrets
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: nextedit-secrets
    creationPolicy: Owner
  data:
    - secretKey: hf-token
      remoteRef:
        key: hugging-face
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

