apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: next-edit
  namespace: ai
  labels:
    app.kubernetes.io/name: next-edit
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
      sectionName: https-wildcard
  # Coberto pelo wildcard *.lab.the-lab.zone: DNS (split-horizon PowerDNS) e TLS
  # (wildcard-lab-tls) ja resolvem sem mudanca adicional.
  hostnames:
    - next-edit.lab.the-lab.zone
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: next-edit
          port: 8000
          weight: 1
