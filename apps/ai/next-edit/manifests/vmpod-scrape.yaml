# vLLM expoe metricas Prometheus em /metrics na propria porta http (8000).
# Estas metricas adicionam latencia de inferencia, throughput e ocupacao
# do KV cache do vLLM.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: next-edit
  namespace: ai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: next-edit
  podMetricsEndpoints:
    - port: http
      path: /metrics
