apiVersion: v1
kind: Service
metadata:
  name: next-edit
  namespace: ai
  labels:
    app.kubernetes.io/name: next-edit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: next-edit
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
# Consumidor: Zed (edit-prediction) via HTTPRoute -> https://next-edit.lab.the-lab.zone
# Endpoint OpenAI-compat do vLLM: /v1/completions (text completion, nao chat).
