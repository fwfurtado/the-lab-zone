# vLLM servindo sweepai/sweep-next-edit-v2-7B (next-edit prediction) 100% residente na 3090.
# runtimeClassName: nvidia -> injeta nodeSelector (nvidia.com/gpu.present) + toleration
# do taint + runtime GPU. Com o Ollama em replicas:0, a 3090 esta livre e inteira.
#
# Numeros REAIS medidos no boot de 21/08 (v0.25.1, bf16, max-model-len 16384):
#   pesos          14.29 GiB
#   KV cache        4.68 GiB -> 87.696 tokens -> 5.35x de concorrencia @16k
#   cudagraphs      0.05 GiB
#   load do PVC   271 s (~54 MB/s) <- gargalo de cold start, ver bloco de resources
apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-edit
  namespace: ai
  labels:
    app.kubernetes.io/name: next-edit
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate # PVC RWO: nunca dois pods montando o mesmo volume no rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: next-edit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: next-edit
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          # TODO: pinar por digest (vllm/vllm-openai@sha256:...). Com tag mutavel +
          # IfNotPresent, uma troca de node pode entregar um binario diferente do
          # que voce validou, sem nenhum sinal no rollout.
          image: vllm/vllm-openai:v0.25.1
          imagePullPolicy: IfNotPresent
          args:
            # MUDOU: modelo como argumento posicional. O --model= esta deprecado
            # (WARNING argparse_utils.py:257) e sera removido numa versao futura.
            - sweepai/sweep-next-edit-v2-7B
            # served-model-name = o que o Zed manda no campo "model".
            # O prompt_format do lado do Zed precisa ser "sweep" (ou "infer", que
            # detecta pelo nome sweep-next-edit-*). NAO deixe nome zeta* aqui: o
            # cliente montaria o prompt no formato errado e as predicoes sairiam
            # silenciosamente ruins, sem erro nenhum no log.
            - --served-model-name=sweep-next-edit-v2-7B
            # 3090 (Ampere) NAO tem FP8 tensor cores -> bf16 nativo. Nada de fp8/fp8_e4m3.
            - --dtype=bfloat16
            # Contexto do edit-predict (edits recentes + janela do arquivo + retrieval).
            # Medido: sobram 4.68 GiB de KV = 87.696 tokens. Folgado pra 1 usuario.
            - --max-model-len=16384
            - --gpu-memory-utilization=0.90
            # 1 usuario: fila de 2 (a request em voo + a que substitui ela quando
            # voce digita de novo). Captura de cudagraph tambem fica mais rapida.
            - --max-num-seqs=2
            # Prefill inteiro num passo so -> melhor TTFT. Sem batch pra proteger.
            - --max-num-batched-tokens=16384
            # Prompt reuse alto no edit-predict -> prefix caching ajuda muito.
            - --enable-prefix-caching
            # NOVO: o generation_config.json do REPO DO MODELO (nao e nosso) forca
            # max_tokens=2048 -> WARNING model.py:1528. O card declara 1024.
            # Rede de seguranca: se os stop tokens (<|file_sep|>, <|endoftext|>)
            # falharem, sem isso a geracao vai ate 2048 tokens (~30s a 55 tok/s).
            # Alternativa mais grossa: --generation-config=vllm (ignora o arquivo).
            - '--override-generation-config={"max_tokens":1024}'
            # NAO use --enforce-eager. Em batch=1 os cudagraphs valem 15-20% do decode.
            #
            # ngram spec decoding: output do rewrite-window e quase todo copia do
            # bloco current/, entao a aceitacao tende a ser alta. POREM custa dois
            # WARNINGs no boot: desliga o async scheduling (vllm.py:1010) e cai do
            # Model Runner V2 pro V1 (vllm.py:548) -- ou seja, voce abre mao do
            # principal ganho da 0.25.0. Meca a aceitacao em /metrics (grep spec_decode)
            # antes de assumir que compensa.
            - '--speculative-config={"method":"ngram","num_speculative_tokens":10,"prompt_lookup_max":6,"prompt_lookup_min":2}'
            # --- Config alternativa do A/B: sem ngram, COM Model Runner V2 + async
            # scheduling. Comente o --speculative-config acima e descomente a linha
            # abaixo. Compare p50/p90 com payload REAL (prompt aleatorio zera o ngram).
            # - --async-scheduling
            - --host=0.0.0.0
            - --port=8000
            # Corta o access log do uvicorn (INFO: <ip> - "POST /v1/... HTTP/1.1" 200),
            # ~99% probe/health noise. Afeta so o logger uvicorn; os logs proprios do
            # vLLM (engine, throughput) ficam no logger `vllm`, intactos. Throughput
            # real e observado via VMPodScrape, nao pelo access log.
            # Alternativa mais cirurgica em vLLM novo: --disable-uvicorn-access-log.
            - --uvicorn-log-level=warning
          env:
            # Cache do HF no PVC -> baixa o modelo uma vez, reusa em todo restart.
            - name: HF_HOME
              value: /data/hf
            # Modelo e publico (open-weights); token so ajuda contra rate limit anonimo.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nextedit-secrets
                  key: hf-token
            # NOTA: se o build da imagem/CI injeta VLLM_BUILD_COMMIT, VLLM_IMAGE_TAG,
            # VLLM_BUILD_URL, VLLM_BUILD_PIPELINE nesse pod, o vLLM varre tudo com
            # prefixo VLLM_ e loga "Unknown vLLM environment variable" pra cada uma.
            # Renomeie pra BUILD_* ou mova pra annotations do pod.
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: models
              mountPath: /data/hf
            # vLLM usa /dev/shm; o default de 64Mi do container estoura mesmo em 1 GPU.
            - name: dshm
              mountPath: /dev/shm
          # 1o boot: download (~157s) + load do PVC (~271s) + compile/warmup (~47s).
          # Medido end-to-end: 8m40s. Restart com cache quente ainda paga os ~271s
          # de load. failureThreshold 90 x 10s = 15min de folga.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: 1
              # MUDOU: 16Gi -> 24Gi. O checkpoint tem 14.19 GiB e e lido via mmap;
              # o page cache conta no cgroup. Com limite de 16Gi o kernel fica
              # reclamando pagina no meio do load, o que provavelmente explica os
              # 54 MB/s. Se o tempo de load nao cair com 24Gi, o gargalo e o
              # storage class -> avaliar PV local em NVMe ou --load-format=instanttensor.
              memory: "24Gi"
            requests:
              # MUDOU: cpu 1 -> 2 (tokenizacao, loader, torch.compile).
              # De proposito SEM limits.cpu: throttling durante o warmup e pior
              # que vizinho barulhento num node que so roda isso.
              cpu: "2"
              memory: "8Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: next-edit-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
