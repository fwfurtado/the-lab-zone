# vLLM servindo zed-industries/zeta-2 (next-edit prediction) 100% residente na 3090.
# runtimeClassName: nvidia -> injeta nodeSelector (nvidia.com/gpu.present) + toleration
# do taint + runtime GPU. Com o Ollama em replicas:0, a 3090 esta livre e inteira.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-edit
  namespace: ai
  labels:
    app.kubernetes.io/name: next-edit
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate # PVC RWO: nunca dois pods montando o mesmo volume no rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: next-edit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: next-edit
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.25.1
          imagePullPolicy: IfNotPresent
          args:
            - --model=sweepai/sweep-next-edit-v2-7B
            # served-model-name = o que o Zed manda em "model". Com prompt_format:infer
            # o Zed detecta o formato zeta2.1 (Multi-Region) a partir desse nome.
            - --served-model-name=sweep-next-edit-v2-7B
            # 3090 (Ampere) NAO tem FP8 tensor cores -> bf16 nativo. Nada de fp8/fp8_e4m3.
            - --dtype=bfloat16
            # Contexto do edit-predict (edits recentes + janela do arquivo). 16k e folgado;
            # ajuste se quiser mais KV cache livre.
            - --max-model-len=16384
            # Card inteiro livre -> 0.90 seguro (~21.6GB pro modelo + KV pool).
            - --gpu-memory-utilization=0.90
            # 1 usuario: fila de 2 (a request em voo + a que substitui ela quando
            # voce digita de novo). Captura de cudagraph tambem fica mais rapida.
            - --max-num-seqs=2            
            # Prefill inteiro num passo so -> melhor TTFT. Sem batch pra proteger.
            - --max-num-batched-tokens=16384            
            # Prompt reuse alto no edit-predict -> prefix caching ajuda muito.
            - --enable-prefix-caching
            # NAO use --enforce-eager. Em batch=1 os cudagraphs valem 15-20% do decode.
            - --speculative-config={"method":"ngram","num_speculative_tokens":10,"prompt_lookup_max":6,"prompt_lookup_min":2}
            - --host=0.0.0.0
            - --port=8000
            # Corta o access log do uvicorn (INFO: <ip> - "POST /v1/... HTTP/1.1" 200),
            # ~99% probe/health noise. Afeta só o logger uvicorn; os logs próprios do
            # vLLM (engine, throughput) ficam no logger `vllm`, intactos. Throughput
            # real é observado via VMPodScrape, não pelo access log.
            # Alternativa mais cirúrgica em vLLM novo: --disable-uvicorn-access-log.
            - --uvicorn-log-level=warning
          env:
            # Cache do HF no PVC -> baixa o modelo uma vez, reusa em todo restart.
            - name: HF_HOME
              value: /data/hf
            # Modelo e publico (open-weights); token so ajuda contra rate limit anonimo.
            # Descomente + crie a ExternalSecret se bater em 429 no pull:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nextedit-secrets
                  key: hf-token
          ports:
            - name: http
              containerPort: 8000
          # vLLM usa /dev/shm; o default de 64Mi do container estoura mesmo em 1 GPU.
          volumeMounts:
            - name: models
              mountPath: /data/hf
            - name: dshm
              mountPath: /dev/shm
          # 1o boot baixa ~16GB do HF + carrega na VRAM -> startupProbe generoso
          # (nao deixa o liveness matar o pod durante o download).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90 # ~15min de folga pro 1o pull
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "16Gi"
            requests:
              cpu: "1"
              memory: "4Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: next-edit-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
