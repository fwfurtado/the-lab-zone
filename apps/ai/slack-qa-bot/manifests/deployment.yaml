# apps/ai/slack-qa-bot/manifests/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-qa-bot
  namespace: ai
  labels:
    app.kubernetes.io/name: slack-qa-bot
spec:
  replicas: 1                      # Socket Mode: 1 réplica (2 abririam 2 conexões)
  strategy:
    type: Recreate                 # sem sentido rolar 2 sockets simultâneos
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-qa-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack-qa-bot
    spec:
      containers:
        - name: bot
          image: ghcr.io/fwfurtado/the-lab-zone-agents-core:0.9.0
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: TOOLHIVE_VMCP_URL
              value: http://vmcp-lab-vmcp.ai.svc.cluster.local:4483/mcp
            - name: LITELLM_BASE_URL
              value: http://litellm.ai.svc.cluster.local:4000/v1
            - name: MODEL_NAME
              value: minimax-m3-paid
            - name: LOG_LEVEL
              value: "INFO"
            # Observabilidade OTel: o QA é dono dos spans e roota o próprio trace
            # (não há borda Go aqui). Exporta pro Collector node-local; HOST_IP
            # via downward API. Nota: no caminho streaming (run_stream) o LiteLLM
            # ainda não emite o header de custo, então gen_ai.usage.cost pode
            # faltar no QA — diferente da triagem (run, não-streaming).
            - name: OTEL_ENABLED
              value: "true"
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(HOST_IP):4318
            - name: OTEL_SERVICE_NAME
              value: qa-bot
            # Garage (feedback humano de triagem, ADR-0014): o listener de
            # confirmação/refutação (botão/modal) roda neste MESMO processo
            # (ver comentário do 'replicas: 1' acima — Socket Mode não tolera
            # 2 conexões, então o feedback não pode ir para um Deployment
            # separado sem abrir um segundo app Slack dedicado).
            # Sem esquema (http/https decidido por GARAGE_USE_SSL) — mesma
            # convenção do triage-webhook (Go, minio-go). Ausência de
            # GARAGE_ENDPOINT desliga o listener de feedback sem derrubar o
            # QA bot (agents/qa/main.py loga e segue sem a capacidade).
            - name: GARAGE_ENDPOINT
              value: garage.data.svc.cluster.local:3900
            - name: GARAGE_BUCKET
              value: triage-reports
            - name: GARAGE_REGION
              value: garage
            - name: GARAGE_USE_SSL
              value: "false"
          envFrom:
            - secretRef:
                name: slack-qa-bot
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
