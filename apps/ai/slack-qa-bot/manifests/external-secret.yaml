# apps/ai/slack-qa-bot/manifests/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-qa-bot
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: slack-qa-bot
    creationPolicy: Owner
  data:
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: Labot
        property: bot-token
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: Labot
        property: app-token
    - secretKey: LITELLM_KEY
      remoteRef:
        key: Labot
        property: litellm-token
    # Garage (feedback humano de triagem, ADR-0014): a MESMA chave que o
    # triage-webhook (Go) já usa para escrever triage/ — não há isolamento
    # real a ganhar com uma chave nova, já que o Garage concede permissão por
    # BUCKET, não por prefixo (mesma ressalva da Fatia B.1, ADR-0013: a
    # imutabilidade de triage/ é convenção do código, não fronteira imposta
    # pela credencial). O listener escreve só confirmations/, mas a chave
    # tecnicamente poderia escrever em qualquer prefixo do bucket.
    - secretKey: GARAGE_ACCESS_KEY
      remoteRef:
        key: garage-triage
        property: accessKeyId
    - secretKey: GARAGE_SECRET_KEY
      remoteRef:
        key: garage-triage
        property: secretKey
