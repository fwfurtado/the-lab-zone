# ADICIONAR em apps/ai/open-webui/manifests/ (arquivo novo ou no external-secrets
# existente). Lê o MESMO item do 1Password que alimenta o client_secret do
# provider no Terraform — os dois lados têm que ter o mesmo valor.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oidc
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # antes do app (open-webui em wave 3)
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: open-webui-oidc
  data:
    - secretKey: client_secret
      remoteRef:
        key: oidc-open-webui
        property: client_secret
        metadataPolicy: None
        nullBytePolicy: Ignore
        conversionStrategy: Default
        decodingStrategy: None
