apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-env
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: open-webui-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://openwebui:{{ .pgPassword }}@cnpg-cluster-rw.data.svc.cluster.local:5432/openwebui"
        WEBUI_SECRET_KEY: "{{ .secretKey }}"
        LITELLM_VIRTUAL_KEY: "{{ .litellmKey }}"
  data:
    - secretKey: pgPassword
      remoteRef:
        key: open-webui
        property: pgPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: secretKey
      remoteRef:
        key: open-webui
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: litellmKey
      remoteRef:
        key: open-webui
        property: litellmKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
