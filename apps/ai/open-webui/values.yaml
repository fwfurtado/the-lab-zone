pipelines:
  enabled: true
ollama:
  enabled: false
redis:
  enabled: false
websocket:
  enabled: false
tika:
  enabled: false

image:
  repository: ghcr.io/open-webui/open-webui
  tag: ""

workload:
  kind: Deployment
  replicaCount: 1
  strategy:
    type: Recreate

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: openebs-hostpath
  provider: local

# conexão única OpenAI-compatible → LiteLLM
enableOpenaiApi: true
openaiBaseApiUrl: "http://litellm.ai.svc.cluster.local:4000/v1"
openaiApiKeysExistingSecret: open-webui-env
openaiApiKeysExistingSecretKey: OPENAI_API_KEYS

databaseUrl: ""               # vem por DATABASE_URL no extraEnvVars

extraEnvVars:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: open-webui-env
        key: DATABASE_URL
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: open-webui-env
        key: WEBUI_SECRET_KEY
  - name: ENABLE_FORWARD_USER_INFO_HEADERS
    value: "true"
  - name: WEBUI_URL
    value: "https://chat.lab.the-lab.zone"
  - name: ENABLE_PERSISTENT_CONFIG
    value: "false"

route:
  enabled: true
  apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  hostnames:
    - chat.lab.the-lab.zone
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
      sectionName: https-wildcard
  matches:
    - path:
        type: PathPrefix
        value: /

sso:
  enabled: false # auth nativa até o Authentik (Fase 9)
