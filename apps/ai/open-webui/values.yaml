pipelines:
  enabled: true
  persistence:
    enabled: true
    storageClass: openebs-hostpath-ssd
  extraEnvVars:
    - name: PIPELINES_URLS
      value: "https://raw.githubusercontent.com/open-webui/pipelines/main/examples/filters/langfuse_filter_pipeline.py"
    - name: LANGFUSE_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: open-webui-pipelines-env
          key: LANGFUSE_PUBLIC_KEY
    - name: LANGFUSE_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: open-webui-pipelines-env
          key: LANGFUSE_SECRET_KEY
    - name: LANGFUSE_HOST
      value: "http://langfuse-web.ai.svc.cluster.local:3000"

ollama:
  enabled: false
redis:
  enabled: false
websocket:
  enabled: false
tika:
  enabled: false

image:
  repository: ghcr.io/open-webui/open-webui
  tag: ""

workload:
  kind: Deployment
  replicaCount: 1
  strategy:
    type: Recreate

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: openebs-hostpath-ssd
  provider: local

# conexão única OpenAI-compatible → LiteLLM
enableOpenaiApi: true
openaiBaseApiUrl: "http://litellm.ai.svc.cluster.local:4000/v1"
openaiApiKeysExistingSecret: open-webui-env
openaiApiKeysExistingSecretKey: OPENAI_API_KEYS

databaseUrl: ""               # vem por DATABASE_URL no extraEnvVars

extraEnvVars:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: open-webui-env
        key: DATABASE_URL
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: open-webui-env
        key: WEBUI_SECRET_KEY
  - name: ENABLE_FORWARD_USER_INFO_HEADERS
    value: "true"
  - name: WEBUI_URL
    value: "https://chat.lab.the-lab.zone"
  - name: ENABLE_PERSISTENT_CONFIG
    value: "false"
  # ── OIDC / Authentik (Fase 9) ───────────────────────────────────────────────
  - name: ENABLE_OAUTH_SIGNUP
    value: "true"
  - name: OAUTH_PROVIDER_NAME
    value: "Authentik"
  # discovery é PER-SLUG no Open WebUI (diferente do Grafana, que usa endpoints
  # globais). [CONFERIR] slug do app no data.tf (provável: open-webui).
  - name: OPENID_PROVIDER_URL
    value: "https://auth.mgmt.the-lab.zone/application/o/open-webui/.well-known/openid-configuration"
  # [CONFERIR] tem que bater EXATAMENTE com o redirect declarado no data.tf.
  - name: OPENID_REDIRECT_URI
    value: "https://chat.lab.the-lab.zone/oauth/oidc/callback"
  - name: OAUTH_SCOPES
    value: "openid email profile groups"
  - name: OAUTH_CLIENT_ID
    value: "open-webui"            # = chave do app no oidc.tf (não é segredo)
  - name: OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: open-webui-oidc      # ESO materializa (ver external-secret)
        key: client_secret
  - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
    value: "true"

  # ── Role mapping por grupo ──────────────────────────────────────────────────
  # the-lab-admins -> admin no Open WebUI. O claim `groups` do Authentik traz os
  # nomes dos grupos nativamente (mesmo claim do Grafana).
  - name: ENABLE_OAUTH_ROLE_MANAGEMENT
    value: "true"
  - name: OAUTH_ROLES_CLAIM
    value: "groups"
  - name: OAUTH_ADMIN_ROLES
    value: "the-lab-admins"
  # quem pode logar. Só the-lab-admins por enquanto (single-user). Pra liberar
  # outros como usuário comum, cria um grupo e soma aqui: "the-lab-admins,the-lab-users".
  - name: OAUTH_ALLOWED_ROLES
    value: "the-lab-admins"

route:
  enabled: true
  apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  hostnames:
    - chat.lab.the-lab.zone
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
      sectionName: https-wildcard
  matches:
    - path:
        type: PathPrefix
        value: /

sso:
  enabled: false # auth nativa até o Authentik (Fase 9)
