apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: skillshare-default-deny-ingress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: skillshare
  ingress:
    - fromEntities:
        - host
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "19420"
              protocol: TCP
