apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skillshare-github-app
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: skillshare-github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: AI-Skills GitHub App
        property: app_id
    - secretKey: installation-id
      remoteRef:
        key: AI-Skills GitHub App
        property: installation_id
    - secretKey: private-key
      remoteRef:
        key: AI-Skills GitHub App
        property: private_key
