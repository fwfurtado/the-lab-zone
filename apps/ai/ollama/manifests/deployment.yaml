# Ollama com GPU. runtimeClassName: nvidia -> a RuntimeClass injeta nodeSelector
# (nvidia.com/gpu.present) + toleration do taint + o runtime que expoe a 3090.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 0
  strategy:
    type: Recreate # PVC RWO: nunca dois pods montando o mesmo volume
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        app.kubernetes.io/name: ollama
    spec:
      runtimeClassName: nvidia # injeta nodeSelector + toleration + runtime GPU (via RuntimeClass scheduling)
      containers:
        - name: ollama
          image: ollama/ollama:0.32.1
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1" # menos VRAM por token de contexto
            - name: OLLAMA_KV_CACHE_TYPE
              value: "q8_0" # KV cache q8 -> mais contexto cabe nos 24GB
            - name: OLLAMA_KEEP_ALIVE
              value: "30m" # mantem o modelo na VRAM entre chamadas
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1" # 24GB: 1 modelo grande por vez
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "16Gi"
            requests:
              cpu: "500m"
              memory: "2Gi"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
