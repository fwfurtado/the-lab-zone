apiVersion: v1
kind: Service
metadata:
  name: lightrag
  namespace: ai
  labels:
    app.kubernetes.io/name: lightrag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lightrag
  ports:
    - name: http
      port: 9621
      targetPort: http
      protocol: TCP
# Consumidores internos:
#   - Open WebUI / agentes:  http://lightrag.ai.svc.cluster.local:9621
#   - API OpenAI/Ollama-compatible exposta pelo proprio LightRAG
