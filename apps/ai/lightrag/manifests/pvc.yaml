apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lightrag-data
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath-ssd
  resources:
    requests:
      # Com Qdrant/Memgraph/CNPG externos, /app/data guarda sobretudo os
      # documentos originais em inputs/ (re-processaveis) + estado local minimo.
      # 10Gi e folgado pra comecar; cresce conforme o volume de fontes ingeridas.
      storage: 10Gi
