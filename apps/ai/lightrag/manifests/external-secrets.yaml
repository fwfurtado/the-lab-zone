apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lightrag-env
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: lightrag-env
    creationPolicy: Owner
  # Sem template: cada chave do Secret ja tem o nome exato da env var, entao o
  # Deployment pode consumir tudo via envFrom.secretRef. Valores 1:1 do 1Password.
  data:
    # --- CNPG (PGKVStorage + PGDocStatusStorage) ---
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: lightrag
        property: pgPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    # --- LiteLLM (mesma virtual key serve LLM e embedding) ---
    - secretKey: LLM_BINDING_API_KEY
      remoteRef:
        key: lightrag
        property: litellmKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: EMBEDDING_BINDING_API_KEY
      remoteRef:
        key: lightrag
        property: litellmKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    # --- Auth do server LightRAG (API key + JWT + contas da WebUI) ---
    # NOTA: confirme os nomes destas 3 vars contra o env.example da tag que voce
    # pinou; auth e o tipo de coisa que o projeto as vezes renomeia entre versoes.
    - secretKey: LIGHTRAG_API_KEY
      remoteRef:
        key: lightrag
        property: apiKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: TOKEN_SECRET
      remoteRef:
        key: lightrag
        property: tokenSecret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: AUTH_ACCOUNTS
      remoteRef:
        key: lightrag
        property: authAccounts
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    # --- Memgraph ---
    - secretKey: MEMGRAPH_PASSWORD
      remoteRef:
        key: lightrag
        property: memgraphPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    # --- Qdrant ---
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: qdrant
        property: apiKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    # --- Langfuse (project rag) ---
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: langfuse-rag
        property: publicKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: langfuse-rag
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
