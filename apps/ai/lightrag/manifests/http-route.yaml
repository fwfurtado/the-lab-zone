apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lightrag
  namespace: ai
  labels:
    app.kubernetes.io/name: lightrag
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
      sectionName: https-wildcard
  hostnames:
    - lightrag.lab.the-lab.zone
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: lightrag
          port: 9621
          weight: 1
