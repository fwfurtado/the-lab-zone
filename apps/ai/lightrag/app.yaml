apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lightrag
  namespace: argocd
  annotations:
    # Depois de litellm/langfuse (wave 2) e do delta CNPG no app data.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai
  # Single-source: LightRAG nao tem chart Helm oficial; e um container unico
  # 100% env-driven, entao manifestos raw sao mais limpos que a danca multi-source.
  source:
    repoURL: https://github.com/fwfurtado/the-lab-zone
    targetRevision: main
    path: apps/ai/lightrag/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
