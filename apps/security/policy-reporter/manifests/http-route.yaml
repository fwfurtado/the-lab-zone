# UI navegável dos reports de segurança. Split-horizon/Tailscale como as demais
# UIs internas; se um dia sair dessa fronteira, colocar OIDC/Auth na frente.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-reporter
  namespace: policy-reporter
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
      sectionName: https-wildcard
  hostnames:
    - policy-reporter.lab.the-lab.zone
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: policy-reporter-ui
          port: 8080
          weight: 1
