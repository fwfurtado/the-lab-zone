# Scrape do Policy Reporter core pelo vmagent.
#
# O trivy-plugin serve a API em /vulnr/v1/policies, mas não expoe /metrics; se
# entrar neste selector, o vmagent gera TargetDown com scrape rapido/404.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: policy-reporter
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  namespaceSelector:
    matchNames:
      - policy-reporter
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-reporter
  endpoints:
    - port: http
      path: /metrics
