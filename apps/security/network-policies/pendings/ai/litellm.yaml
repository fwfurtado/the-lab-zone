# apps/security/network-policies/pending/ai/litellm.yaml
# Default-deny INGRESS puro. ingress: [] NEGA tudo; ingress: [{}] LIBERA tudo (não usar).
# Sem egress -> egress livre nesta fase. Allows vêm da observação (verdict AUDIT). Ver README.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-default-deny-ingress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm # [CONFERIR]
  ingress: []
