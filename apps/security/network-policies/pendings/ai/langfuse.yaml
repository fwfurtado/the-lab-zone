# apps/security/network-policies/pending/ai/langfuse.yaml
# Default-deny INGRESS puro. ingress: [] NEGA tudo; ingress: [{}] LIBERA tudo (não usar).
# Sem egress -> egress livre nesta fase. Allows vêm da observação (verdict AUDIT). Ver README.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-default-deny-ingress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse # [CONFERIR] cobre web+worker? senao crie 2 CNPs
  ingress: []
