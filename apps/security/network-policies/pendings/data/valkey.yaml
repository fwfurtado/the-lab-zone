apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey-default-deny-ingress
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: velkey-exporter
