# apps/security/network-policies/pending/data/garage.yaml
# Default-deny INGRESS puro. ingress: [] NEGA tudo; ingress: [{}] LIBERA tudo (não usar).
# Sem egress -> egress livre nesta fase. Allows vêm da observação (verdict AUDIT). Ver README.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage-default-deny-ingress
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage # [CONFERIR]
  ingress: []
