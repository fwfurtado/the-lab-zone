apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage-default-deny-ingress
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: langfuse
        # tempo: blocos de trace (Parquet) vão pro bucket `tempo`; só o WAL fica no PVC.
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: tempo
        # pyroscope: blocos de profiles vão pro bucket `pyroscope`; o PVC segura
        # dados locais/metastore do single-binary.
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: pyroscope
        - matchLabels:
            io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: clickhouse
        # qdrant-backup: upload rclone do snapshot + archiveLogs do wait sidecar (Argo)
        - matchLabels:
            io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: qdrant-backup
        # clickhouse-backup: NÃO faz upload (o sidecar `clickhouse` faz), mas como Workflow
        # o wait sidecar arquiva logs no Garage (artifact-repositories archiveLogs: true).
        - matchLabels:
            io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: clickhouse-backup
        # analytics-etl: idem (archiveLogs). Gap latente que já existia antes destes backups —
        # só não mordeu porque o garage ainda está em Policy Audit Mode.
        - matchLabels:
            io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: analytics-etl
        - matchLabels:
            io.kubernetes.pod.namespace: argo-workflows
            app.kubernetes.io/name: argo-workflows-server
        # offsite-sync (Fase 10): LÊ todos os buckets de backup via S3 (3900) pra espelhar
        # no B2. Sem isso, em enforce, o sync é dropado e o off-site nunca enche.
        - matchLabels:
            io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: offsite-sync
        # Barman precisa de acesso ao cluster CNPG para ler os backups
        - matchLabels:
            io.kubernetes.pod.namespace: data
            cnpg.io/cluster: cnpg-cluster
        # triage-webhook (Fase D, ADR-0007): a borda persiste os relatórios de
        # triagem no Garage como fonte de verdade da memória. Sem esta regra o
        # PUT é dropado quando o garage sair do audit mode — e o MultiPublisher
        # best-effort só loga o erro, então a memória não persistiria em silêncio.
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: triage-webhook
        # triage-indexer (Fase D, Fatia A): LÊ os relatórios do bucket
        # triage-reports via rclone para embedar no Qdrant. Só leitura.
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: triage-indexer
        # slack-qa-bot (Fatia B.2, ADR-0014): o listener de feedback humano
        # (botão/modal de confirmação da triagem) roda no MESMO processo do
        # QA bot — ESCREVE confirmations/ no bucket triage-reports. Sem esta
        # regra o PUT é dropado quando o garage sair do audit mode, e a falha
        # é só logada (best-effort) — o feedback se perderia em silêncio.
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: slack-qa-bot
        # lakehouse (Spark/Delta, etapa 1.2): driver e executor leem/escrevem Parquet
        # via s3a no bucket `lakehouse`. Pods do spark-operator NÃO carregam
        # app.kubernetes.io/name -- o label real é spark-role (driver/executor),
        # setado pelo próprio Spark, não pelo operator. Cobre qualquer SparkApplication
        # em `data`, não só uma app específica -- o Role escopado por namespace do
        # operator já limita quem pode rodar SparkApplication ali.
        - matchLabels:
            io.kubernetes.pod.namespace: data
            spark-role: driver
        - matchLabels:
            io.kubernetes.pod.namespace: data
            spark-role: executor
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
