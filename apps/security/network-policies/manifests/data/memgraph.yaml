apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: memgraph-default-deny-ingress
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: memgraph
  # LightRAG era o unico cliente do grafo; removido, o Memgraph fica sem consumidor.
  # `ingress: - {}` = regra presente porem vazia = nega tudo (nao e allow-all; allow-all
  # seria fromEntities: [all]). Ver runbook cilium-cnp-default-deny.
  ingress:
    - {}
