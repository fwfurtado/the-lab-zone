apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: memgraph-default-deny-ingress
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: memgraph
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: lightrag
      toPorts:
        - ports:
            - port: "7687"
              protocol: TCP
