apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qdrant-default-deny-ingress
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: lightrag
        - matchLabels:
            io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: qdrant-backup
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            toolhive-name: qdrant-mcp
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: qa-indexer
        # triage-indexer (Fase D): reconcilia a memória de triagens para a
        # collection triage_reports. Mesmo acesso 6333 do qa-indexer.
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: triage-indexer
        # MCPs de consumo da memória de triagens (Fase D): as duas instâncias
        # que servem busca sobre triage_incidents e triage_facets ao agente.
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            toolhive-name: triage-incidents-mcp
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            toolhive-name: triage-facets-mcp
      toPorts:
        - ports:
            - port: "6333"
              protocol: TCP
