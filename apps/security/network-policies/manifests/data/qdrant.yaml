apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qdrant-default-deny-ingress
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: lightrag
        - matchLabels:
            io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: qdrant-backup
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app: qdrant-mcp
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: qa-indexer
      toPorts:
        - ports:
            - port: "6333"
              protocol: TCP
