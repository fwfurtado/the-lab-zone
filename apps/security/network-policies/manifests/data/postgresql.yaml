# apps/security/network-policies/pending/data/postgresql.yaml
# Default-deny INGRESS puro. ingress: [] NEGA tudo; ingress: [{}] LIBERA tudo (não usar).
# Sem egress -> egress livre nesta fase. Allows vêm da observação (verdict AUDIT). Ver README.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgresql-default-deny-ingress
  namespace: data
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: cnpg-cluster
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: langfuse
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: open-webui
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: lightrag
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
