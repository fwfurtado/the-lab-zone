apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-default-deny-ingress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: open-webui
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: lightrag
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: qdrant-mcp
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: qa-indexer
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: slack-qa-bot
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: headroom
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
