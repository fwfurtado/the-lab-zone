apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-default-deny-ingress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: open-webui
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: qdrant-mcp
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: qa-indexer
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: slack-qa-bot
        # Núcleo da triagem por alerta (sidecar no pod triage-webhook, ADR-0017)
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: triage-webhook
        # Step `classifier` do WorkflowTemplate triage-indexer: extrai
        # verdict/confidence dos relatórios via LLM (ADR-0013). O label vem do
        # podMetadata do workflow, logo vale para todos os pods do run — só o
        # classifier de fato abre conexão.
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: triage-indexer
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
