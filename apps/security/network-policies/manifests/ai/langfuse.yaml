apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-default-deny-ingress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Duas classes de ingestao no Langfuse:
    #  - opentelemetry-collector: OTLP dos 3 agentes (fanout traces/langfuse).
    #  - pipelines (open-webui-pipelines): o langfuse_filter_pipeline do OWUI
    #    exporta trace via SDK direto (nao passa pelo collector). Label do pod =
    #    app.kubernetes.io/name: pipelines (subchart do open-webui).
    # A origem lightrag foi removida (LightRAG desligado, ADR-0018).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: pipelines
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
