apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-default-deny-ingress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Ingestao OTLP dos agentes chega via OTel Collector (fanout traces/langfuse).
    # As origens diretas lightrag e pipelines (OWUI) foram removidas: LightRAG
    # desligado e a instrumentacao do open-webui saiu de escopo.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
