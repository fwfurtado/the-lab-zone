apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-default-deny-ingress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: pipelines
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: lightrag
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
