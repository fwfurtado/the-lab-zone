apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headroom-default-deny-ingress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: headroom
  ingress:
    # Quando a triagem for empacotada (Job/Deployment em ai), ela chama o headroom
    # aqui. Ajuste o label se a triagem subir com outro app.kubernetes.io/name.
    # (Teste local via port-forward NÃO passa por aqui — vai pelo túnel do kubelet.)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: triage
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
