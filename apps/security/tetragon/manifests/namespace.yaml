apiVersion: v1
kind: Namespace
metadata:
  name: tetragon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    # eBPF + bpffs hostPath + CAP_SYS_ADMIN: o DaemonSet exige privileged.
    # Mesmo racional dos namespaces openebs/observability (node-exporter).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
