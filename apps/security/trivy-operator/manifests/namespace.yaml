apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    # O operator e os scan jobs NÃO precisam de hostPath/hostNetwork/privileged.
    # baseline é suficiente (diferente do tetragon, que exige privileged).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
