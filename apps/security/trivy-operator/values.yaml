# trivy-operator 0.33.2 — scanning CONTÍNUO de runtime (in-cluster).
#
# Camada distinta do Harbor: o Harbor escaneia no PUSH (imagens que entram no
# registry); o trivy-operator escaneia o que ESTÁ RODANDO no cluster e materializa
# os achados como CRs (VulnerabilityReport, ConfigAuditReport, ...) consultáveis
# via kubectl. Decisão da Fase 9: só o operator, Harbor fica como está.
#
# [CONFERIR] valide os nomes das chaves abaixo com:
#   helm show values oci://ghcr.io/aquasecurity/helm-charts/trivy-operator --version 0.33.2
# (histórico do repo: chart que ignora chave inexistente já mordeu — openebs NDM,
#  victoria-logs clusterIP. Mantemos o values MÍNIMO de propósito.)

trivy:
  # Standalone: o trivy roda embutido no job, sem servidor externo.
  mode: Standalone
  # Só reporta CVE COM fix disponível — corta o ruído de "unfixed" que não dá pra agir.
  ignoreUnfixed: true

# Escopo inicial de estabilizacao: o objetivo operacional e saber o que esta
# rodando agora, sem multiplicar scans por ReplicaSet/Job/CronJob historicos.
targetWorkloads: "pod"

# Top-level no chart. Manter fora do bloco operator; dentro dele a chave e
# ignorada e OPERATOR_EXCLUDE_NAMESPACES fica vazio.
excludeNamespaces: "kube-system,trivy-system"

operator:
  # TTL dos relatórios: re-scan periódico mantém o retrato fresco.
  scannerReportTTL: "24h"
  # Limita jobs simultâneos pra não competir com workload real nem com o etcd
  # enquanto os control planes ainda compartilham o pool local-nvme.
  scanJobsConcurrentLimit: 1
  # Fase de estabilizacao: manter apenas vulnerability scanning. Os scanners
  # auxiliares aumentam CRs/reconciliacao e podem ser reabilitados um a um.
  configAuditScannerEnabled: false
  exposedSecretScannerEnabled: false
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false

# Métricas: usamos VMServiceScrape próprio (manifests/), não o ServiceMonitor
# do Prometheus que o chart oferece.
serviceMonitor:
  enabled: false

# Recursos do OPERATOR (resources top-level mapeia pro container do operator).
# O operator faz watch de ~30 tipos de recurso (todos os nativos + os ~12 CRDs
# do trivy); cada informer guarda cache em memória proporcional ao nº de objetos.
# Num cluster cheio, 256Mi OOM-mata no startup -> CrashLoop + liveness :9090
# connection refused. 1Gi dá folga (o T630 tem RAM sobrando).
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi
