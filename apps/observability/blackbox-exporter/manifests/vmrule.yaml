apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  groups:
    - name: blackbox-exporter
      rules:
        - alert: BlackboxProbeFailed
          expr: probe_success{job=~"blackbox-.*"} == 0
          for: 2m
          labels:
            severity: warning
            component: blackbox
            triage: "true"
          annotations:
            summary: "Blackbox probe failed for {{ $labels.instance }}"
            description: "The {{ $labels.probe_class }} target {{ $labels.instance }} has failed synthetic probing for at least 2 minutes."
        - alert: BlackboxProbeSlow
          expr: probe_duration_seconds{job=~"blackbox-.*"} > 5
          for: 5m
          labels:
            severity: info
            component: blackbox
          annotations:
            summary: "Blackbox probe is slow for {{ $labels.instance }}"
            description: "The {{ $labels.probe_class }} target {{ $labels.instance }} has taken more than 5 seconds to probe for at least 5 minutes."
