# Nome estavel para o VMProbe apontar para o Service sem depender do fullname do chart.
fullnameOverride: blackbox-exporter

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: ip4

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
