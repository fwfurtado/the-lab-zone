apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-zone-test
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-2"      # antes do collector (wave 2), p/ o env existir no boot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: langfuse-zone-test
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LANGFUSE_ZONE_TEST_OTEL_AUTH: 'Basic {{ printf "%s:%s" .pk .sk | b64enc }}'
  data:
    - secretKey: pk
      remoteRef:
        key: langfuse-zone-test        # <- ajuste: item no 1Password
        property: publicKey        # <- ajuste: campo com o pk-lf-...
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: sk
      remoteRef:
        key: langfuse-zone-test
        property: secretKey        # <- ajuste: campo com o sk-lf-...
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
