apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-zone-test
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: langfuse-zone-test
    creationPolicy: Owner
  data:
    - secretKey: LANGFUSE_ZONE_TEST_OTEL_AUTH
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: langfuse-zone-test
        property: basicAuthEncoded
