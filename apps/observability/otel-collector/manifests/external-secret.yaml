apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-agents
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-2"      # antes do collector (wave 2), p/ o env existir no boot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: langfuse-agents
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LANGFUSE_OTEL_AUTH: 'Basic {{ printf "%s:%s" .pk .sk | b64enc }}'
  data:
    - secretKey: pk
      remoteRef:
        key: langfuse-zone
        property: publicKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: sk
      remoteRef:
        key: langfuse-zone
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
