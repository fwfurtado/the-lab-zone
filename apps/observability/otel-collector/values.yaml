# OTel Collector — DaemonSet no cluster (chart 0.158.1)
# Fase 5: recebe métricas/logs via OTLP e encaminha para VictoriaMetrics/VictoriaLogs
# Traces de IA: exportados para o Langfuse (projeto único de observabilidade dos agentes) via otlp_http.
# (VictoriaTraces full-stack fica para a Fase 7)

mode: daemonset

# Obrigatório desde chart ~0.127.x — sem isso o helm template falha
# otelcol-k8s é a distribuição recomendada para Kubernetes (inclui k8s receivers)
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s

command:
  name: otelcol-k8s

presets:
  # Adiciona k8s metadata em todos os spans/métricas/logs automaticamente
  # (k8s.pod.name, k8s.namespace.name, k8s.node.name, etc.)
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false
    extractAllPodAnnotations: false
  # Coleta logs de todos os containers via filelog receiver
  logsCollection:
    enabled: true
    includeCollectorLogs: false
    storeCheckpoints: false

# Credencial OTLP do Langfuse (ESO/Infisical). Deve conter a chave
# LANGFUSE_OTEL_AUTH = "Basic <base64(pk:sk)>" do projeto único dos agentes.
# Injetada como env no pod para o ${env:...} do exporter resolver.
extraEnvsFrom:
  - secretRef:
      name: langfuse-agents

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: 0.0.0.0:4318
    # Removendo jaeger/zipkin/prometheus — não usamos
    jaeger: null
    zipkin: null
    prometheus: null

  processors:
    batch:
      timeout: 10s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 5s        # era 1s no values antigo; default do chart é 5s (mais correto)
      limit_percentage: 75
      spike_limit_percentage: 15

  exporters:
    otlp_http/metrics:
      endpoint: http://vmsingle-victoria-metrics-vmks.observability.svc.cluster.local:8428/opentelemetry
      tls:
        insecure: true

    otlp_http/logs:
      endpoint: http://victoria-logs-vls-server.observability.svc.cluster.local:9428/insert/opentelemetry
      tls:
        insecure: true

    # Traces de IA -> Langfuse (projeto único de observabilidade dos agentes).
    # HTTP-only: o Langfuse não aceita gRPC; o exporter anexa /v1/traces ao endpoint base.
    otlp_http/langfuse-agents:
      endpoint: http://langfuse-web.ai.svc.cluster.local:3000/api/public/otel
      headers:
        Authorization: ${env:LANGFUSE_OTEL_AUTH}   # "Basic <base64(pk:sk)>"
        x-langfuse-ingestion-version: "4"

  connectors:
    # span_metrics: deriva RED (rate/erros/duração) dos spans do agente e emite
    # como métrica pro VictoriaMetrics — plano de SISTEMA, alertável via VMRule,
    # sem consultar o Langfuse. Consome spans (exporter no pipeline traces) e
    # produz métricas (receiver no pipeline metrics/span_metrics).
    span_metrics:
      histogram:
        explicit:
          # Runs de agente vão de ms (tool calls) a minutos (triagem inteira);
          # os buckets cobrem as duas pontas pra ter percentil útil em ambas.
          buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s, 120s, 300s]
      dimensions:
        - name: gen_ai.request.model    # RED por modelo (baixa cardinalidade)
      exemplars:
        enabled: true
      metrics_flush_interval: 15s
      namespace: agents.span_metrics

  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/metrics]
      logs:
        receivers: [otlp, filelog]  # filelog injetado pelo preset logsCollection
        processors: [memory_limiter, batch]
        exporters: [otlp_http/logs]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/langfuse-agents, span_metrics]
      # RED derivado dos spans -> VictoriaMetrics. O connector span_metrics é o
      # receiver aqui; as séries (agents_span_metrics_calls_total / _duration_*)
      # ficam alertáveis via VMRule sem tocar no Langfuse.
      metrics/span_metrics:
        receivers: [span_metrics]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/metrics]

# Porta metrics habilitada para o VMAgent scrape o próprio collector
ports:
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP
  # Desabilita portas que não usamos
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# GOMEMLIMIT = 80% de limits.memory (feature do chart, altamente recomendado)
useGOMEMLIMIT: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Tolera o taint do nó GPU para coletar telemetria do worker-3-gpu também.
# O taint nvidia.com/gpu=present:NoSchedule existe para barrar workload genérico —
# DaemonSet de telemetria é exceção: queremos observabilidade JUSTO no nó mais quente
# (Ollama, DCGM, inferência). Sem isso o controller não agenda o agent lá e o
# pod pré-taint vira misscheduled (KubeDaemonSetMisScheduled + RolloutStuck).
tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
