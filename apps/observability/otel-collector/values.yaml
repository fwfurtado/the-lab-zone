# OTel Collector — DaemonSet no cluster (chart 0.158.1)
# Fase 5: recebe métricas/logs via OTLP e encaminha para VictoriaMetrics/VictoriaLogs
# Traces de IA: exportados para o Langfuse (projeto único de observabilidade dos agentes) via otlp_http.
# (VictoriaTraces full-stack fica para a Fase 7)

mode: daemonset

# Obrigatório desde chart ~0.127.x — sem isso o helm template falha
# otelcol-k8s é a distribuição recomendada para Kubernetes (inclui k8s receivers)
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s

command:
  name: otelcol-k8s

presets:
  # Adiciona k8s metadata em todos os spans/métricas/logs automaticamente
  # (k8s.pod.name, k8s.namespace.name, k8s.node.name, etc.)
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false
    extractAllPodAnnotations: false
  # Coleta logs de todos os containers via filelog receiver
  logsCollection:
    enabled: true
    includeCollectorLogs: false
    storeCheckpoints: false

# Credencial OTLP do Langfuse (ESO/Infisical). Deve conter a chave
# LANGFUSE_OTEL_AUTH = "Basic <base64(pk:sk)>" do projeto único dos agentes.
# Injetada como env no pod para o ${env:...} do exporter resolver.
extraEnvsFrom:
  - secretRef:
      name: langfuse-agents

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: 0.0.0.0:4318
    # Removendo jaeger/zipkin/prometheus — não usamos
    jaeger: null
    zipkin: null
    prometheus: null

  processors:
    batch:
      timeout: 10s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 5s        # era 1s no values antigo; default do chart é 5s (mais correto)
      limit_percentage: 75
      spike_limit_percentage: 15
    # Converte NOMES e CHAVES DE LABEL do span_metrics para snake_case.
    # Necessário porque o VM guarda métricas OTLP como vêm (sem
    # -opentelemetry.usePrometheusNaming): sem isso chegam pontuadas
    # (agents.span_metrics.calls{service.name=...}). E MetricsQL NÃO aceita label
    # com ponto em `by()` — exigiria label_replace em todo VMRule/dashboard.
    # Escopo: só o pipeline metrics/span_metrics; o pipeline `metrics` geral não é tocado.
    transform/span_metrics_naming:
      error_mode: ignore
      metric_statements:
        # CARDINALIDADE: o VM promove TODO resource attribute a label. O span_metrics
        # copia o resource do span (container.image.tag, k8s.pod.uid, ...), que muda a
        # cada deploy e multiplica séries sem servir a nenhuma agregação de RED.
        # Allowlist explícita — enumerar, não excluir (mesmo princípio do RBAC).
        - context: resource
          statements:
            - 'keep_matching_keys(resource.attributes, "^(service\\.name|service\\.namespace|deployment\\.environment)$")'
            - 'replace_all_patterns(resource.attributes, "key", "\\.", "_")'
        - context: metric
          statements:
            - 'replace_pattern(metric.name, "\\.", "_")'
        # atributos do datapoint: span.name, span.kind, status.code, gen_ai.request.model
        #
        # collector.instance.id: o connector o adiciona para SEPARAR os contadores de
        # cada instância do collector — sem ele, dois pods do daemonset emitindo a mesma
        # série colidem e o rate() vira serra. Mas o valor é um UUID gerado no boot: todo
        # rollout cria séries novas e abandona as antigas (churn sem teto).
        # Troca por identidade ESTÁVEL por nó: daemonset = 1 collector por nó, e o nome do
        # nó não muda no restart. `${env:OTEL_K8S_NODE_NAME}` é expandido pelo collector no
        # load do config (o chart injeta essa env via fieldRef spec.nodeName).
        - context: datapoint
          statements:
            - 'set(datapoint.attributes["collector_node"], "${env:OTEL_K8S_NODE_NAME}")'
            - 'delete_key(datapoint.attributes, "collector.instance.id")'
            - 'replace_all_patterns(datapoint.attributes, "key", "\\.", "_")'
    # O connector service_graph emite os histogramas como
    # traces_service_graph_request_{client,server} (unidade: segundos). O Grafana
    # (Service Graph do datasource Tempo) procura o nome com sufixo _seconds — que
    # o VM não adiciona, por não fazer naming Prometheus. Renomeia explicitamente.
    transform/service_graph_naming:
      error_mode: ignore
      metric_statements:
        # Mesma poda do span_metrics: sem ela os labels client/server ganham carona de
        # container.image.tag, k8s.pod.uid e cia.
        - context: resource
          statements:
            - 'keep_matching_keys(resource.attributes, "^(service\\.name|service\\.namespace|deployment\\.environment)$")'
            - 'replace_all_patterns(resource.attributes, "key", "\\.", "_")'
        - context: metric
          statements:
            - 'set(metric.name, "traces_service_graph_request_server_seconds") where metric.name == "traces_service_graph_request_server"'
            - 'set(metric.name, "traces_service_graph_request_client_seconds") where metric.name == "traces_service_graph_request_client"'
        - context: datapoint
          statements:
            - 'replace_all_patterns(datapoint.attributes, "key", "\\.", "_")'

    # Langfuse é o plano de LLM: só spans dos agentes entram lá. O Tempo recebe TUDO.
    # Sem isso, span de infra (Gateway, CNPG, Argo...) viraria lixo no projeto `zone`
    # — mesma lição do flood de /healthz. O filter DESCARTA o que casa a condição,
    # então a condição é "não é um dos serviços de agente".
    filter/langfuse_agents_only:
      error_mode: ignore
      traces:
        span:
          - 'resource.attributes["service.name"] != "triage-webhook" and resource.attributes["service.name"] != "triage-agent" and resource.attributes["service.name"] != "qa-bot"'

  exporters:
    otlp_http/metrics:
      endpoint: http://vmsingle-victoria-metrics-vmks.observability.svc.cluster.local:8428/opentelemetry
      tls:
        insecure: true

    otlp_http/logs:
      endpoint: http://victoria-logs-vls-server.observability.svc.cluster.local:9428/insert/opentelemetry
      tls:
        insecure: true

    # Traces de IA -> Langfuse (projeto único de observabilidade dos agentes).
    # HTTP-only: o Langfuse não aceita gRPC; o exporter anexa /v1/traces ao endpoint base.
    otlp_http/langfuse-agents:
      endpoint: http://langfuse-web.ai.svc.cluster.local:3000/api/public/otel
      headers:
        Authorization: ${env:LANGFUSE_OTEL_AUTH}   # "Basic <base64(pk:sk)>"
        x-langfuse-ingestion-version: "4"

    # Traces de TODO o cluster -> Tempo (backend de traces, Fase 7). gRPC: o Tempo
    # aceita OTLP nativo, diferente do Langfuse (HTTP-only).
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true

  connectors:
    # span_metrics: deriva RED (rate/erros/duração) dos spans do agente e emite
    # como métrica pro VictoriaMetrics — plano de SISTEMA, alertável via VMRule,
    # sem consultar o Langfuse. Consome spans (exporter no pipeline traces) e
    # produz métricas (receiver no pipeline metrics/span_metrics).
    span_metrics:
      histogram:
        explicit:
          # Runs de agente vão de ms (tool calls) a minutos (triagem inteira);
          # os buckets cobrem as duas pontas pra ter percentil útil em ambas.
          buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s, 120s, 300s]
      dimensions:
        - name: gen_ai.request.model    # RED por modelo (baixa cardinalidade)
      exemplars:
        enabled: true
      metrics_flush_interval: 15s
      namespace: agents.span_metrics

    # service_graph: deriva as ARESTAS entre serviços (quem chama quem) a partir de
    # pares de spans client/server no mesmo trace. É o que alimenta o Service Graph
    # do Grafana — o span_metrics NÃO produz isso (ele dá RED por serviço, não o grafo).
    service_graph:
      latency_histogram_buckets: [10ms, 100ms, 500ms, 1s, 5s, 30s, 120s]
      store:
        ttl: 10s          # janela pra casar client<->server; triagens longas fecham a aresta na borda
        max_items: 1000
      metrics_flush_interval: 30s

  service:
    # Telemetria interna do Collector. O chart só cria o reader Prometheus se este
    # `address` existir; sem ele a 8888 não é servida e as séries otelcol_* (spans
    # enviados/falhos por exporter, fila, refused) simplesmente não existem.
    telemetry:
      metrics:
        address: ${env:MY_POD_IP}:8888
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/metrics]
      logs:
        receivers: [otlp, filelog]  # filelog injetado pelo preset logsCollection
        processors: [memory_limiter, batch]
        exporters: [otlp_http/logs]
      # TUDO -> Tempo (backend de traces do cluster) + span_metrics (RED).
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo, span_metrics, service_graph]
      # Só os agentes -> Langfuse (plano de LLM). Mesmo receiver: o Collector faz
      # fanout do otlp para os dois pipelines; o filter recorta este.
      traces/langfuse:
        receivers: [otlp]
        processors: [memory_limiter, filter/langfuse_agents_only, batch]
        exporters: [otlp_http/langfuse-agents]
      # RED derivado dos spans -> VictoriaMetrics. O connector span_metrics é o
      # receiver aqui; as séries (agents_span_metrics_calls_total / _duration_*)
      # ficam alertáveis via VMRule sem tocar no Langfuse.
      metrics/span_metrics:
        receivers: [span_metrics]
        processors: [memory_limiter, transform/span_metrics_naming, batch]
        exporters: [otlp_http/metrics]
      # Arestas do grafo de serviços -> VictoriaMetrics (traces_service_graph_*).
      metrics/service_graph:
        receivers: [service_graph]
        processors: [memory_limiter, transform/service_graph_naming, batch]
        exporters: [otlp_http/metrics]

# Porta metrics habilitada para o VMAgent scrape o próprio collector
ports:
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP
  # Desabilita portas que não usamos
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# GOMEMLIMIT = 80% de limits.memory (feature do chart, altamente recomendado)
useGOMEMLIMIT: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Tolera o taint do nó GPU para coletar telemetria do worker-3-gpu também.
# O taint nvidia.com/gpu=present:NoSchedule existe para barrar workload genérico —
# DaemonSet de telemetria é exceção: queremos observabilidade JUSTO no nó mais quente
# (Ollama, DCGM, inferência). Sem isso o controller não agenda o agent lá e o
# pod pré-taint vira misscheduled (KubeDaemonSetMisScheduled + RolloutStuck).
tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule

# A porta de métricas é DESABILITADA por default no chart; sem ela não há o que
# scrapear (VMPodScrape em manifests/vmpod-scrape.yaml).
ports:
  metrics:
    enabled: true
