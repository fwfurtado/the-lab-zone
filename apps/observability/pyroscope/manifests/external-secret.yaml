# Credenciais S3 do Garage pro Pyroscope. Item dedicado por bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pyroscope-s3
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: pyroscope-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: garage-pyroscope
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: garage-pyroscope
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
