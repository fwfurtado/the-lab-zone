# Credenciais S3 do Garage pro Tempo. Item dedicado por bucket, como o garage-triage.
# Os NOMES das keys são AWS_* porque o tempo.yaml usa ${AWS_ACCESS_KEY_ID} /
# ${AWS_SECRET_ACCESS_KEY} (expandidos via -config.expand-env=true).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-s3
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-2"   # antes do Tempo (wave 2)
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: tempo-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: garage-tempo          # <- criar no 1Password
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: garage-tempo
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
