# Tempo monolítico 3.0 (single binary, -target=all): backend de traces do cluster INTEIRO.
#
# MIGRADO DE CHART PARA MANIFESTS (ADR de saída do chart): o chart `tempo` single-binary
# congelou no app 2.10.7 (flag -mem-ballast hardcoded, removida no 3.0) e o chart 3.0 só
# existe no modo microservices (tempo-distributed, exige Kafka + ~12 componentes —
# desproporcional pro homelab). Monolithic 3.0 (sem Kafka, 1 pod) não é exposto por
# nenhum chart, então gerimos os manifests à mão. Responsabilidade nova: acompanhar
# breaking changes de cada release do Tempo manualmente.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: observability
  source:
    repoURL: https://github.com/fwfurtado/the-lab-zone.git
    targetRevision: main
    path: apps/observability/tempo/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
