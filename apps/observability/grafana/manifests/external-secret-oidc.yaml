# ADICIONAR ao apps/observability/grafana/manifests/external-secrets.yaml
# (mesmo estilo do grafana-admin-secret que já está lá).
#
# Lê o MESMO item do 1Password que alimenta o client_secret do provider no
# Terraform — tem que ser o mesmo valor dos dois lados (Authentik e Grafana),
# senão o token exchange falha. Confere o nome do item/property contra o teu
# .env.tpl central (a linha TF_VAR_..._grafana... = op://the-lab-zone/...).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # antes do Grafana (app em wave 2)
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
  data:
    - secretKey: client_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: oidc-grafana
        property: client_secret
