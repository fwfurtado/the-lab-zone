# apps/observability/grafana/manifests/tetragon-events-dashboard.yaml
#
# Dashboard custom do Tetragon sobre o VictoriaLogs, entregue como ConfigMap
# para o SIDECAR de dashboards do Grafana descobrir (label `grafana_dashboard`).
#
# PRÉ-REQUISITO: o sidecar de dashboards precisa estar habilitado no values do
# Grafana. [CONFERIR] se já está:
#   helm get values <release-grafana> -n observability | grep -A3 'sidecar:'
# Se não estiver, somar no values:
#   sidecar:
#     dashboards:
#       enabled: true
#       label: grafana_dashboard          # default que o sidecar procura
#       # searchNamespace: ALL            # se o Grafana não estiver em observability
#
# Se você preferir NÃO ligar o sidecar e seguir só com o provider clássico
# (dashboards.default), dá pra colar o JSON inline no values com
# `dashboards.default.tetragon-events.json: |` — mas polui o values com ~150
# linhas. O ConfigMap é o caminho mais limpo pra dashboards custom no git.
#
# sync-wave: depois do Grafana subir. Ajuste se o teu app do Grafana usar waves.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tetragon-events-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    # opcional: organiza numa pasta no Grafana
    grafana_folder: "Security"
data:
  tetragon-events.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 39,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${ds}"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${ds}"
              },
              "expr": "{k8s.namespace.name=\"tetragon\"} process_exec | stats count() total",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "process_exec na janela",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${ds}"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${ds}"
              },
              "expr": "{k8s.namespace.name=\"tetragon\"} process_exec CAP_SYS_ADMIN | stats count() total",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "Eventos com CAP_SYS_ADMIN na janela",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${ds}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "bars",
                "fillOpacity": 40,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${ds}"
              },
              "expr": "{k8s.namespace.name=\"tetragon\"} process_exec | stats count() hits",
              "queryType": "statsRange",
              "refId": "A",
              "step": "1m"
            }
          ],
          "title": "Taxa de process_exec (por minuto)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${ds}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "id": 4,
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${ds}"
              },
              "expr": "{k8s.namespace.name=\"tetragon\"} process_exec | unpack_json | stats by (\"process_exec.process.binary\") count() hits | sort by (hits desc) | limit 25",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "Top binários executados",
          "type": "table"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${ds}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "id": 5,
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${ds}"
              },
              "expr": "{k8s.namespace.name=\"tetragon\"} process_exec | unpack_json | stats by (\"process_exec.process.pod.namespace\") count() hits | sort by (hits desc)",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "Execuções por namespace observado",
          "type": "table"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${ds}"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "id": 6,
          "options": {
            "dedupStrategy": "none",
            "enableInfiniteScrolling": false,
            "enableLogDetails": true,
            "showControls": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${ds}"
              },
              "expr": "{k8s.namespace.name=\"tetragon\"} process_exec CAP_SYS_ADMIN",
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Stream — execuções privilegiadas (CAP_SYS_ADMIN)",
          "type": "logs"
        }
      ],
      "preload": false,
      "refresh": "",
      "schemaVersion": 42,
      "tags": [
        "security",
        "tetragon",
        "ebpf"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "VictoriaLogs",
              "value": "VictoriaLogs"
            },
            "label": "VictoriaLogs",
            "name": "ds",
            "options": [],
            "query": "victoriametrics-logs-datasource",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Tetragon — Runtime Events (eBPF)",
      "uid": "tetragon-events",
      "version": 1
    }
