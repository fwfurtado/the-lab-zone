# Grafana — chart 10.5.15
# TLS termina no Gateway (grafana.ini.server.root_url via HTTPS)

# RollingUpdate conflita com PVC ReadWriteOnce (openebs-hostpath):
# o novo pod tenta montar o volume antes do antigo liberar.
# rollingUpdate deve ser null explicitamente — se omitido, o chart injeta
# rollingUpdate: {} que conflita com type: Recreate e causa sync error.
deploymentStrategy:
  type: Recreate
  rollingUpdate: null

grafana.ini:
  server:
    root_url: https://grafana.lab.the-lab.zone
    # Necessário quando TLS termina no Gateway (sem tls no pod)
    serve_from_sub_path: false
  auth:
    disable_login_form: false
  auth.generic_oauth:
    enabled: true
    name: Authentik
    client_id: grafana                # = chave do app no oidc.tf (não é segredo)
    # client_secret NÃO vai aqui — entra via env GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
    scopes: "openid email profile groups"
    # Endpoints do Authentik são GLOBAIS (não per-provider); o provider é
    # identificado pelo client_id. Só o issuer/jwks é que é per-slug.
    auth_url: https://auth.mgmt.the-lab.zone/application/o/authorize/
    token_url: https://auth.mgmt.the-lab.zone/application/o/token/
    api_url: https://auth.mgmt.the-lab.zone/application/o/userinfo/
    # the-lab-admins -> Admin (org admin); qualquer outro -> Viewer.
    # `groups` é o claim que o teu scope mapping emite (lista de nomes de grupo).
    role_attribute_path: "contains(groups[*], 'the-lab-admins') && 'Admin' || 'Viewer'"
    use_pkce: true
  analytics:
    reporting_enabled: false
    check_for_updates: false

# Admin via ExternalSecret (manifests/grafana-secret.yaml)
admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

# O client_secret é obtido via ExternalSecret (manifests/external-secrets.yaml)
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oidc
      key: client_secret

# Não sobrescrever securityContext — o default do chart (uid 472, fsGroup 472)
# é necessário para que o PVC tenha as permissões corretas no mountPath.
# Sobrescrever com runAsUser diferente quebra escrita no volume.

persistence:
  enabled: true
  storageClassName: openebs-hostpath-ssd
  size: 5Gi
  accessModes:
    - ReadWriteOnce

# Datasources provisionadas automaticamente
datasources:
  datasources.yaml:
    apiVersion: 1

    # MIGRAÇÃO DE UID. O provisionamento casa a datasource pelo NOME, mas quando o
    # `uid` muda numa que já existe no banco, o Grafana tenta resolvê-la pelo uid
    # novo e falha com "data source not found" — e como `provisioning` é módulo de
    # boot, o pod entra em CrashLoopBackOff.
    #
    # O Grafana apaga as listadas aqui ANTES de inserir/atualizar as de baixo, o que
    # recria cada uma já com o uid definitivo. É idempotente: nos boots seguintes a
    # datasource é apagada e recriada com o mesmo uid, sem efeito observável.
    #
    # Pré-requisito: nenhum dashboard pode referenciar o uid ANTIGO. O
    # control-plane-etcd (que fixava P4169E866C3094E38) foi migrado para a variável
    # ${ds} no mesmo commit.
    deleteDatasources:
      - name: VictoriaMetrics
        orgId: 1
      - name: VictoriaLogs
        orgId: 1
      - name: Alertmanager
        orgId: 1
      - name: Tempo
        orgId: 1

    datasources:
      - name: VictoriaMetrics
        type: prometheus
        # uid EXPLÍCITO. Sem ele o Grafana gera um aleatório (era P4169E866C3094E38) e
        # qualquer referência — dashboard, correlação — fica presa a um valor fora do Git.
        uid: victoriametrics
        url: http://vmsingle-victoria-metrics-vmks.observability.svc.cluster.local:8428
        isDefault: true
        access: proxy
        jsonData:
          manageAlerts: true

      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        uid: victorialogs
        url: http://victoria-logs-vls-server.observability.svc.cluster.local:9428
        access: proxy

      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        url: http://vmalertmanager-victoria-metrics-vmks.observability.svc.cluster.local:9093
        access: proxy
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false

      # Tempo: backend de traces do cluster (Fase 7). A porta 3200 é a API HTTP de
      # query; o ingest OTLP (4317/4318) só o Collector usa.
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.observability.svc.cluster.local:3200
        access: proxy
        jsonData:
          # Node graph: desenha o grafo do trace aberto (não depende de métrica).
          nodeGraph:
            enabled: true
          # Correlação trace -> RED do span_metrics (já em snake_case no VM).
          # datasourceUid exige o UID (não o nome) da datasource de destino.
          tracesToMetrics:
            datasourceUid: victoriametrics
            tags:
              - key: service.name
                value: service_name
            queries:
              - name: "Taxa de requests (RED)"
                query: 'sum(rate(agents_span_metrics_calls{$__tags}[5m]))'
              - name: "Taxa de erros (RED)"
                query: 'sum(rate(agents_span_metrics_calls{$__tags, status_code="STATUS_CODE_ERROR"}[5m]))'
          # Service Graph: alimentado pelo connector service_graph do Collector
          # (traces_service_graph_*), não pelo span_metrics.
          serviceMap:
            datasourceUid: victoriametrics

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    kubernetes-cluster:
      gnetId: 15661
      revision: 1
      datasource: VictoriaMetrics
    # node-exporter (gnetId 1860, "Node Exporter Full", uid rYdddlPWk) REMOVIDO:
    # o victoria-metrics-k8s-stack já entrega o mesmo dashboard via ConfigMap
    # (sidecarProvider). Com o mesmo uid em dois providers, o Grafana loga
    # "the same UID is used more than once" e REVOGA a permissão de escrita de
    # AMBOS ("no database write permissions because of duplicates") — nenhum
    # dashboard é atualizado no banco, nem os deste repo.
    # Fase 6 — data layer
    cloudnative-pg:
      gnetId: 20417
      revision: 1
      datasource: VictoriaMetrics
    clickhouse:
      gnetId: 14192
      revision: 3
      datasource: VictoriaMetrics
    qdrant:
      gnetId: 24603
      revision: 1
      datasource: VictoriaMetrics
    valkey:
      gnetId: 763
      revision: 5
      datasource: VictoriaMetrics
    trivy-operator:
      gnetId: 17813
      revision: 2
      datasource: VictoriaMetrics
# Plugin de datasource para VictoriaLogs
plugins:
  - victoriametrics-logs-datasource

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Service padrão do chart: ClusterIP porta 80 → pod 3000. Não precisa sobrescrever.
# O HTTPRoute em manifests/http-route.yaml aponta para porta 80.

# rbac necessário para sidecar de dashboards (leitura de ConfigMaps)
rbac:
  create: true
  pspEnabled: false

# Sidecar para auto-provisioning de dashboards via ConfigMaps
# Qualquer ConfigMap com label grafana_dashboard: "1" é importado automaticamente
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL # busca em todos os namespaces
