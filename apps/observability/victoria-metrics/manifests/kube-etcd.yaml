# kube-etcd (2381/http puro) — control plane do Talos
#
# etcd expõe um listener DEDICADO de métricas (/metrics e /health) em HTTP puro,
# sem mTLS — muito mais limpo que extrair client cert do etcd. Service headless
# (clusterIP: None, sem selector) + Endpoints manuais com os IPs dos CPs.
#
# Pré-requisito (machine config): cluster.etcd.extraArgs.listen-metrics-urls: http://0.0.0.0:2381
#
# IMPORTANTE: definir kubeEtcd.enabled: false no values.yaml do chart, senão o
# chart recria o scrape antigo (2379/https com cert) que vai brigar com este.
---
apiVersion: v1
kind: Service
metadata:
  name: kube-etcd
  namespace: observability
  labels:
    app.kubernetes.io/name: kube-etcd
    app.kubernetes.io/component: kube-etcd
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http-metrics
      port: 2381
      targetPort: 2381
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kube-etcd   # nome IDÊNTICO ao Service
  namespace: observability
  labels:
    app.kubernetes.io/name: kube-etcd
    app.kubernetes.io/component: kube-etcd
subsets:
  - addresses:
      - ip: 10.40.6.11
      - ip: 10.40.6.12
      - ip: 10.40.6.13
    ports:
      - name: http-metrics
        port: 2381
        protocol: TCP
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kube-etcd
  namespace: observability
spec:
  jobLabel: app.kubernetes.io/component
  namespaceSelector:
    matchNames: [observability]
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-etcd
  endpoints:
    - port: http-metrics
      scheme: http   # 2381 é HTTP aberto — sem bearer token, sem TLS
