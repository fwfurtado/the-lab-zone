# kube-scheduler (10259/https) — control plane do Talos
#
# Talos roda o scheduler como static pod em host-network, SEM Service nem labels
# que deem match. Service headless (clusterIP: None, sem selector) + Endpoints
# manuais com os IPs dos CPs. O VMServiceScrape casa pelo label do Service.
#
# TLS: cert válido só para localhost no Talos → insecureSkipVerify (tráfego interno).
# Pré-requisito (machine config): cluster.scheduler.extraArgs.bind-address: 0.0.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: kube-scheduler
  namespace: observability
  labels:
    app.kubernetes.io/name: kube-scheduler
    app.kubernetes.io/component: kube-scheduler
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http-metrics
      port: 10259
      targetPort: 10259
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kube-scheduler   # nome IDÊNTICO ao Service
  namespace: observability
  labels:
    app.kubernetes.io/name: kube-scheduler
    app.kubernetes.io/component: kube-scheduler
subsets:
  - addresses:
      - ip: 10.40.6.11
      - ip: 10.40.6.12
      - ip: 10.40.6.13
    ports:
      - name: http-metrics
        port: 10259
        protocol: TCP
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kube-scheduler
  namespace: observability
spec:
  jobLabel: app.kubernetes.io/component
  namespaceSelector:
    matchNames: [observability]
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-scheduler
  endpoints:
    - port: http-metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
