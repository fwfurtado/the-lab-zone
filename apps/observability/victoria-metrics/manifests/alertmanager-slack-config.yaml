# manifests/alertmanager-slack-config.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: slack
  namespace: observability
spec:
  route:
    receiver: slack
    group_by: ["alertname", "namespace", "component"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Plumbing do kube-prometheus/VM: nunca notifica humano.
      - receiver: blackhole
        matchers:
          - alertname =~ "Watchdog|InfoInhibitor"
        continue: false

      # Triagem por agente. continue=true: envia para o agente e tambem segue
      # para a rota humana apropriada abaixo.
      - receiver: triage-webhook
        matchers:
          - triage = "true"
        continue: true
        group_by: ["namespace", "component"]
        group_wait: 2m
        group_interval: 10m
        repeat_interval: 12h

      # Critical tem ciclo proprio, independente do dominio.
      - receiver: slack
        matchers:
          - severity = "critical"
        group_by: ["alertname", "namespace", "component"]
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 1h
        continue: false

      # Synthetic monitoring: agrupa por rota para nao misturar sites distintos.
      - receiver: slack
        matchers:
          - component = "blackbox"
        group_by: ["alertname", "probe_class", "instance"]
        group_wait: 30s
        group_interval: 10m
        repeat_interval: 2h
        continue: false

      # Core platform: GitOps, certs, secrets, metrics API e backups.
      - receiver: slack
        matchers:
          - component =~ "argocd|cert-manager|external-secrets|metrics-server|velero"
        group_by: ["component", "namespace", "alertname"]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 4h
        continue: false

      # Segurança: drops de Cilium e cobertura de scan.
      - receiver: slack
        matchers:
          - component =~ "cilium|trivy-operator"
        group_by: ["component", "alertname", "source_namespace", "destination_namespace"]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 6h
        continue: false

      # Stores, jobs e pipelines de dados/AI.
      - receiver: slack
        matchers:
          - component =~ "redpanda|qa-indexer|analytics-elt"
        group_by: ["component", "namespace", "alertname"]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 6h
        continue: false

      # Agentes e pipeline de triagem.
      - receiver: slack
        matchers:
          - component =~ "agents|triage"
        group_by: ["component", "namespace", "alertname"]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 4h
        continue: false

      # Componentes da stack de observability fora do chart VictoriaMetrics.
      - receiver: slack
        matchers:
          - component =~ "grafana"
        group_by: ["component", "namespace", "alertname"]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 4h
        continue: false

      # Info ainda chega no Slack, mas com repeticao baixa. Inhibit rules abaixo
      # continuam removendo info quando ja existe warning/critical correlato.
      - receiver: slack
        matchers:
          - severity = "info"
        group_by: ["alertname", "namespace", "component"]
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 12h
        continue: false

      # Catch-all explicito para defaultRules e alertas novos sem componente.
      - receiver: slack

  receivers:
    - name: slack
      slack_configs:
        - api_url:
            name: alertmanager-slack
            key: slack-url
          channel: "#alerts"
          send_resolved: true
          title: >-
            [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
            {{ with .CommonLabels.severity }}({{ . }}){{ end }}
          text: >-
            {{ range .Alerts }}
            *{{ .Labels.alertname }}*
            {{ with .Labels.component }}component={{ . }} {{ end }}{{ with .Labels.namespace }}namespace={{ . }} {{ end }}
            {{ .Annotations.summary }}

            {{ .Annotations.description }}

            {{ end }}

    # Null receiver: sem configs = alerta engolido silenciosamente.
    - name: blackhole

    # Borda Go da triagem (ai/triage-webhook). send_resolved=false: triagem e
    # sobre incidente aberto; resolved nao dispara agente.
    - name: triage-webhook
      webhook_configs:
        - url: http://triage-webhook.ai.svc.cluster.local:8080/webhook
          send_resolved: false
          max_alerts: 20

  inhibit_rules:
    # warning/critical inibem info do mesmo namespace.
    - source_matchers:
        - severity =~ "warning|critical"
      target_matchers:
        - severity = "info"
      equal: ["namespace"]

    # InfoInhibitor inibe info do mesmo namespace quando nao ha warning/critical.
    - source_matchers:
        - alertname = "InfoInhibitor"
      target_matchers:
        - severity = "info"
      equal: ["namespace"]
