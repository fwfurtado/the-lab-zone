# Rota interna pra UI do Alertmanager — alvo dos links {{ .ExternalURL }} nas
# notificações do Slack (externalURL no values). Split-horizon: resolve só na
# rede interna/Tailscale, como o restante de *.lab.the-lab.zone.
#
# NOTA de segurança consciente: a UI do AM não tem auth e permite MUTAÇÃO
# (criar silences). Aceitável atrás do split-horizon; se um dia a exposição
# aumentar, o caminho é proxy do Authentik na frente, como nos demais apps.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: main
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway
      sectionName: https-wildcard
  hostnames:
    - alertmanager.lab.the-lab.zone
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vmalertmanager-victoria-metrics-vmks
          port: 9093
          group: ''
          kind: Service
          weight: 1
