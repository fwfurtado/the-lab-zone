# VictoriaMetrics K8s Stack v0.83.0
# Inclui: VMSingle, VMAgent, VMAlert, Alertmanager, kube-state-metrics, node-exporter
#
# NOTA IMPORTANTE (v0.83.0+):
# O chart valida em helm template que o VMAlert tem ao menos um notifier.
# Com alertmanager.enabled: false e sem notifier externo o deploy falha com:
#   "Neither notifier, notifiers nor notifierConfigRef is set for vmalert"
# Solução: manter alertmanager.enabled: true (interno ao chart) OU declarar
#   vmalert.spec.extraArgs["notifier.blackhole"]: "true"
# Optamos por manter o Alertmanager interno — simples e consistente.

# Evita nomes longos que estouram o limite de 63 chars dos recursos K8s
nameOverride: vmks

vmsingle:
  enabled: true
  spec:
    extraArgs:
      vmalert.proxyURL: "http://vmalert-victoria-metrics-vmks.observability.svc.cluster.local:8080"
    retentionPeriod: "30d"
    storage:
      storageClassName: openebs-hostpath-ssd
      resources:
        requests:
          storage: 50Gi
    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        memory: 4Gi

vmagent:
  enabled: true
  spec:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

vmalert:
  enabled: true
  spec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    # Sem canal de notificação real ainda (chega na Fase 9 com Authentik).
    # Alertmanager interno (abaixo) serve como notifier padrão — basta estar enabled.

# Alertmanager interno ao chart — resolve a validação do VMAlert.
# Config mínima: recebe alertas, não envia pra lugar nenhum por enquanto.
# Substitui o app separado apps/observability/alertmanager/ (que deve ser removido).
alertmanager:
  enabled: true
  useManagedConfig: true
  spec:
    selectAllByDefault: true
    disableNamespaceMatcher: true
    # URL que o AM anuncia de si mesmo: vira o {{ .ExternalURL }} dos templates
    # de notificação (links do Slack) e a base dos paths da UI. Sem isto, o
    # default é o hostname do pod — link morto fora do cluster.
    externalURL: https://alertmanager.lab.the-lab.zone
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

# Grafana gerenciado como app separado (apps/observability/grafana/)
grafana:
  enabled: false

# node-exporter e kube-state-metrics incluídos no stack
prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

# Regras de alerta base para K8s
defaultRules:
  enabled: true

  # NOTA: antes havia `create: true` (chave inexistente no chart — o campo é
  # `enabled`) e toggles de GRUPO (etcd, kubernetesApps, node...) dentro de
  # `rules:`, que é o mapa de override por REGRA. Schema errado, silenciosamente
  # ignorado. Todos valiam `true`, que já é o default — removidos sem mudança de
  # comportamento. Para desabilitar um grupo, use `defaultRules.groups.<grupo>`.
  rules:
    # Opt-in de triagem por agente (ADR-0017): o label entra na REGRA, então
    # TODA instância de TargetDown (qualquer job/namespace) vira candidata a
    # triagem. Escopo deliberado: target down é exatamente a classe de sintoma
    # que o agente investiga bem (scrape, CNP, pod, rede). O merge do chart
    # preserva severity e adiciona triage.
    TargetDown:
      spec:
        labels:
          triage: "true"

# ArgoCD: dashboards ConfigMaps grandes estouram annotation de 256KB no client-side apply
defaultDashboards:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true

# VM Operator — habilita endpoint de métricas na porta 8080
victoria-metrics-operator:
  # PIN da imagem do operator. O k8s-stack declara a dependência como WILDCARD
  # (`victoria-metrics-operator: 0.65.*`), então o mesmo commit pode renderizar
  # operators diferentes conforme a data. Fixar a tag torna o deploy reprodutível.
  #
  # v0.72.0 (= appVersion do subchart 0.65.1). Sai da v0.71.0, que os próprios
  # mantenedores recomendam PULAR (bug: para de emitir métricas com muitos objetos
  # rastreados). Não ir além da v0.72.0 aqui: a v0.73.0 introduziu strategic-merge
  # em listas de VMRule que quebrava regras homônimas (revertido só na v0.73.1) —
  # isso afeta o override de TargetDown acima. Etapa 2 vai direto pra v0.73.1.
  #
  # NOTA de upgrade v0.72.0: ConfigMaps de regras do VMAlert passam a guardar
  # conteúdo gzip em `binaryData` (init container descomprime) => os pods do
  # VMAlert são ROLADOS uma vez neste upgrade. Esperado, não é incidente.
  image:
    tag: v0.72.0
  operator:
    args:
      metricsAddr: ":8080"
  admissionWebhooks:
    enabled: true
    certManager:
      enabled: true        # cria Issuer (selfSigned) + Certificate e usa cainjector

# kube-controller-manager e kube-scheduler: defaultRules desabilitados.
# VMServiceScrapes customizados com insecureSkipVerify em manifests/vmservicescrapes-control-plane.yaml
# O TLS desses componentes no Talos só é válido para localhost — não para o IP do nó.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false
