apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: Métricas, logs, alertas e traces — VictoriaMetrics stack
  sourceRepos:
    - https://github.com/fwfurtado/the-lab-zone.git
    - https://victoriametrics.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://grafana-community.github.io/helm-charts
    - ghcr.io/reliablyobserve/charts
  destinations:
    - namespace: observability
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    # VMAgent e node-exporter precisam de acesso a namespaces do cluster
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    # CRDs do VictoriaMetrics Operator (VMSingle, VMAgent, VMAlert, etc.)
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    # Recursos cluster-scoped do VM Operator
    - group: "operator.victoriametrics.com"
      kind: "*"
    # RBAC adicional do stack
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "policy"
      kind: PodSecurityPolicy
    # MutatingWebhookConfiguration e ValidatingWebhookConfiguration do operator
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration
