apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
spec:
  description: "Fase 9 — segurança: scanning (Trivy), runtime eBPF (Tetragon), NetworkPolicies default-deny"

  sourceRepos:
    - https://github.com/fwfurtado/the-lab-zone.git
    - https://helm.cilium.io # tetragon (mesmo repo do Cilium, já usado no core)
    - https://aquasecurity.github.io/helm-charts/ # trivy-operator (OCI, mesmo padrão do toolhive no core)
    - https://kyverno.github.io/policy-reporter # UI navegável de PolicyReports
    - https://fjogeleit.github.io/trivy-operator-polr-adapter # converte CRDs do Trivy em PolicyReports

  destinations:
    - server: https://kubernetes.default.svc
      namespace: trivy-system # trivy-operator
    - server: https://kubernetes.default.svc
      namespace: policy-reporter # Policy Reporter UI + adapter do Trivy
    - server: https://kubernetes.default.svc
      namespace: tetragon # tetragon (DaemonSet eBPF)
    - server: https://kubernetes.default.svc
      namespace: observability # VMServiceScrape dos componentes de segurança
    - server: https://kubernetes.default.svc
      namespace: data # CiliumNetworkPolicy (default-deny ingress)
    - server: https://kubernetes.default.svc
      namespace: ai # CiliumNetworkPolicy (default-deny ingress)

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # CRDs grandes do trivy-operator (vulnerabilityreports, configauditreports, ...)
    # e do tetragon (tracingpolicies, tracingpoliciesnamespaced).
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    # TracingPolicy do Tetragon é cluster-scoped (cilium.io). Nesta fase NÃO
    # criamos nenhuma (só observação), mas o whitelist deixa o caminho pronto.
    - group: "cilium.io"
      kind: TracingPolicy
    - group: "aquasecurity.github.io"
      kind: "*"
    # Policy Reporter consome os CRDs wgpolicyk8s.io; o adapter do Trivy cria
    # PolicyReports/ClusterPolicyReports a partir dos reports aquasecurity.
    - group: "wgpolicyk8s.io"
      kind: "*"
    - group: "openreports.io"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
